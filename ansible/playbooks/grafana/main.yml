---
- name: Install grafana
  hosts: grafana
  vars_files:
    - ../../../kubernetes/cluster/vars.yaml
  vars:
    # Loki and VictoriaMetrics are unauthenticated. Admit only the three
    # Talos node IPs to their ports (Loki push 3100, metrics remote-write
    # and queries 8428).
    ufw_docker_allowed_source_ports:
      - port: 3100
        sources: "{{ talos_nodes | map(attribute='address') | list }}"
      - port: 8428
        sources: "{{ talos_nodes | map(attribute='address') | list }}"
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Copy loki-config.yaml
      ansible.builtin.template:
        src: loki-config.yaml
        dest: "~/loki-config.yaml"
        mode: "0640"

    # Provisioning is copied, never templated: dashboard JSON is full of
    # braces that Jinja would eat.
    - name: Copy Grafana provisioning (datasources, dashboards, and alerting)
      ansible.builtin.copy:
        src: provisioning/
        dest: "~/provisioning/"
        mode: "0640"
        directory_mode: "0750"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Serve HTTPS over the tailnet
      ansible.builtin.include_role:
        name: tailnet_caddy
        apply:
          tags: ["tailnet_caddy"]
      vars:
        tailnet_caddy_upstream: "http://127.0.0.1:3000"
      tags: ["tailnet_caddy"]
