services:
  # Metrics store for the Talos cluster. Alloy remote-writes to it from
  # the cluster; it is unauthenticated, and the host firewall admits 8428
  # only from the three Talos node IPs (see main.yml). Keep the image pinned by tag and manifest-list digest. Verify both
  # before changing the version (repo convention — never invent a digest).
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    container_name: victoriametrics
    user: "0"
    restart: always
    ports:
      - "8428:8428"
    volumes:
      - ./data/victoriametrics:/victoria-metrics-data
    command: -storageDataPath=/victoria-metrics-data -retentionPeriod=12
