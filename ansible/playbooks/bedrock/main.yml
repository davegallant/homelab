---
- name: Install bedrock
  hosts: bedrock
  vars:
    # Minecraft Bedrock clients (consoles, phones) are not on the tailnet.
    ufw_docker_allowed_sources:
      - 100.64.0.0/10
      - "{{ homelab_lan_subnet }}"
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Allow bedrock port
      community.general.ufw:
        rule: allow
        port: 19132
        proto: udp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml
