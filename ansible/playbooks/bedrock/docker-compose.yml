services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.10.0@sha256:0e0eaf6cabd90f6aff4c31a97f7f01aef780ced92de7a1304acdcd519e99b4f0
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
    ports:
      - "19132:19132/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
