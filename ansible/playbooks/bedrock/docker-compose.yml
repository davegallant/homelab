services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.11.1@sha256:463ea4ac99a3e5b67de0fc590a61cca7ea758520f67d9e4a4512fc3afcc97044
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
      SERVER_UDP_PORTS: "{{ ansible_default_ipv4.address }}:19140-19155:19140-19155"
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19140-19155:19140-19155/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
