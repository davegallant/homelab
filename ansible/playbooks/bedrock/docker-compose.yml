services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.11.0@sha256:0d8799379a492bd636037587298fa8a77ee409264fd77a3c68dba55104dbcca0
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
      SERVER_UDP_PORTS: "{{ ansible_default_ipv4.address }}:19140-19155:19140-19155"
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19140-19155:19140-19155/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
