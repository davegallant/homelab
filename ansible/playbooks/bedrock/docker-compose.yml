services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.7.6@sha256:0bbd0562679ecef9e17c7f76f6dcc43e567ed7821e976caa4a47300798db1b49
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
    ports:
      - "19132:19132/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
