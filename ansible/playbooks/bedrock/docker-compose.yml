services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.10.2@sha256:717eb60a3e9d461cb33588fc2a89ff2d7c60c11b61783a2d9f04040305e258c6
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
      SERVER_UDP_PORTS: "19132"
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
