services:
  bedrock:
    image: docker.io/itzg/minecraft-bedrock-server:2026.10.3@sha256:ad8243d09604051085702536d1e9fef4b0a97fb308f2f2fa73c3fb56b5f4c580
    container_name: bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "Bedrock level"
      SERVER_UDP_PORTS: "{{ ansible_default_ipv4.address }}:19140-19155:19140-19155"
    ports:
      - "19132:19132/tcp"
      - "19132:19132/udp"
      - "19140-19155:19140-19155/udp"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    restart: always
