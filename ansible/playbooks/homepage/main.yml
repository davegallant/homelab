---
- name: Install homepage
  hosts: homepage
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Create Homepage config directory
      ansible.builtin.file:
        path: "~/config"
        state: directory
        mode: "0755"

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Create Homepage icons directory
      ansible.builtin.file:
        path: "~/config/icons"
        state: directory
        mode: "0755"

    - name: Copy services.yaml
      ansible.builtin.template:
        src: config/services.yaml
        dest: "~/config/services.yaml"
        mode: "0640"

    - name: Copy settings.yaml
      ansible.builtin.template:
        src: config/settings.yaml
        dest: "~/config/settings.yaml"
        mode: "0640"

    - name: Copy custom icons
      ansible.builtin.copy:
        src: config/icons/
        dest: "~/config/icons/"
        mode: "0644"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml
