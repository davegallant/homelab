---
- name: Install jellyfin
  hosts: jellyfin
  vars:
    # DLNA (1900/udp) and Jellyfin client auto-discovery (7359/udp) are
    # LAN-only protocols, and TVs are not on the tailnet.
    ufw_docker_allowed_sources:
      - 100.64.0.0/10
      - "{{ homelab_lan_subnet }}"
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Allow DLNA discovery port
      community.general.ufw:
        rule: allow
        port: "1900"
        proto: udp

    - name: Allow Jellyfin client discovery port
      community.general.ufw:
        rule: allow
        port: "7359"
        proto: udp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml
