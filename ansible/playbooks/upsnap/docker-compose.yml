services:
  upsnap:
    image: ghcr.io/seriousm4x/upsnap:5.7.1@sha256:711fcf90d65be9a79e1b05e68dc89e1da8c896f0112e1e9da45fa3df4d9eff6b
    container_name: upsnap
    network_mode: host
    restart: always
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/pb_data
    environment:
      - TZ=America/Toronto
