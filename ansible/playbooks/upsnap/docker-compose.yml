services:
  upsnap:
    image: ghcr.io/seriousm4x/upsnap:5.7.0@sha256:18c8d4a79c3ce7cfa60799233e085287dc5c984a769d7d1e68358e5a69c42101
    container_name: upsnap
    network_mode: host
    restart: always
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/pb_data
    environment:
      - TZ=America/Toronto
