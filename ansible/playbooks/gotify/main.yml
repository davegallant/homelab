---
- name: Install gotify
  hosts: gotify
  vars:
    # Only the LAN may reach the HTTPS listener (Caddy on 443), not the tailnet default.
    ufw_docker_allowed_source_ports:
      - port: 443
        sources:
          - "{{ homelab_lan_subnet }}"
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Copy Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "~/Caddyfile"
        mode: "0640"

    - name: Create 'config' directory
      ansible.builtin.file:
        path: "~/config"
        state: directory
        mode: "0755"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml
