# Upstream reference: https://docs.pangolin.net/self-host/manual/docker-compose
#
# State that Ansible never touches (all under ./config, i.e. ~/config on the host):
#   db/db.sqlite        - Pangolin's database: all sites, resources, users. Do not delete.
#   key                 - Gerbil's WireGuard key, generated on first run.
#   letsencrypt/acme.json - Traefik's certificates, renewed in place.
# Seed those by keeping the existing VPS deployment; Ansible only manages the
# files templated by main.yml.

name: pangolin

services:
  headscale:
    image: docker.io/headscale/headscale:v0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    container_name: headscale
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /var/run/headscale
    command: serve
    volumes:
      - ./config/headscale:/etc/headscale:ro
      - ./config/headscale/data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 10s
      retries: 15

  pangolin:
    # https://github.com/fosrl/pangolin/releases
    image: docker.io/fosrl/pangolin:1.25.3@sha256:5039d0e64a2e57ac52c4833a838f8c015c153f8ab4234c2b3efe95ab4db0b90a
    container_name: pangolin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 10s
      timeout: 10s
      retries: 15

  gerbil:
    # https://github.com/fosrl/gerbil/releases
    image: docker.io/fosrl/gerbil:1.6.0@sha256:420f5210b6d1a6d3035f15c3938b5289fee5aeff51ffdcb9b217838338908885
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 19132:19132/udp

  traefik:
    image: docker.io/traefik:v3.7@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik

networks:
  default:
    driver: bridge
    name: pangolin
    enable_ipv6: true
