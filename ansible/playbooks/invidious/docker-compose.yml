services:
  invidious:
    # https://quay.io/repository/invidious/invidious?tab=tags
    image: quay.io/invidious/invidious:2026.09.30-1454ead@sha256:b86f06e1cfe6721f5bd0a375432c27859e572d0d365034f47a1b45f0739084c0
    container_name: invidious
    restart: always
    networks:
      - invidious
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: "{{ invidious_db_user }}"
          password: "{{ invidious_db_password }}"
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "{{ invidious_companion_secret_key }}"
        hmac_key: "{{ invidious_hmac_key }}"
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/comments/jNQXAC9IVRw || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    depends_on:
      - invidious-db

  companion:
    # https://quay.io/repository/invidious/invidious-companion?tab=tags
    image: quay.io/invidious/invidious-companion:2026.09.19-bb3b37f@sha256:f15bc688aedd4bbb76cc636c7cc0cfff9b2b9f0734a4b831efbda7253b180525
    container_name: invidious-companion
    environment:
      - SERVER_SECRET_KEY={{ invidious_companion_secret_key }}
    restart: unless-stopped
    networks:
      - invidious
    logging:
      options:
        max-size: "1G"
        max-file: "4"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ./companioncache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true

  invidious-db:
    image: docker.io/postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    container_name: invidious-db
    restart: always
    networks:
      - invidious
    volumes:
      - ./postgresdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: "{{ invidious_db_user }}"
      POSTGRES_PASSWORD: "{{ invidious_db_password }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  newt:
    image: docker.io/fosrl/newt:1.18.1@sha256:7fed6605e0a104a337e1cb903bbb1225f80c7f6e5e56ff1eb1d70c57740d8e0f
    container_name: newt-invidious
    restart: unless-stopped
    networks:
      - invidious
    environment:
      - PANGOLIN_ENDPOINT={{ pangolin_endpoint }}
      - NEWT_ID={{ invidious_newt_id }}
      - NEWT_SECRET={{ invidious_newt_secret }}
networks:
  invidious:
    name: invidious
