services:
  igotify:
    container_name: igotify
    image: ghcr.io/androidseb25/igotify-notification-assist:v1.6.1.0@sha256:cb1432ab8963d08177936463ecf3b6dc227c2992f4574befb79e98c643f048e6
    restart: always
    security_opt:
      - no-new-privileges:true
    pull_policy: always
    networks:
      - igotify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/Version"]
      interval: "3s"
      timeout: "3s"
      retries: 5
    volumes:
      - ~/api-data:/app/data
    environment:
      GOTIFY_URLS: "https://gotify.davegallant.ca"
      GOTIFY_CLIENT_TOKENS: "{{ igotify_gotify_client_tokens }}"
  newt:
    image: docker.io/fosrl/newt:1.20.1@sha256:03561e3f3d10b94ee7839318ae46e5acf8b4431550ea1d0e15666ab60caa2e43
    container_name: newt-igotify
    restart: unless-stopped
    networks:
      - igotify
    environment:
      - PANGOLIN_ENDPOINT={{ pangolin_endpoint }}
      - NEWT_ID={{ igotify_newt_id }}
      - NEWT_SECRET={{ igotify_newt_secret }}

networks:
  igotify:
    name: igotify
