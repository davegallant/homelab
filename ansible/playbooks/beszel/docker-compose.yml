services:
  beszel:
    image: docker.io/henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    environment:
      - APP_URL=https://beszel.{{ headscale_magic_dns_domain }}
    ports:
      - 127.0.0.1:8090:8090
    volumes:
      - ${PWD}/beszel-hub/beszel_data:/beszel_data
    restart: always
