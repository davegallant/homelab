services:
  paperless-redis:
    image: docker.io/library/redis:8@sha256:077ba791400f390cb96d9d419d90259d5e72e697fca7abc3bbde6d83285d7346
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - paperless
    volumes:
      - ./redis-data:/data
  paperless-ngx:
    image: docker.io/paperlessngx/paperless-ngx:3.0.3@sha256:17312f00bac06f8dad09d67c6c8c069fc5c076c0c22313241c673102dfaf8ee9
    container_name: paperless-ngx
    restart: always
    networks:
      - paperless
    environment:
      - PAPERLESS_SECRET_KEY={{ paperless_secret_key }}
      - PAPERLESS_ADMIN_USER={{ paperless_admin_user }}
      - PAPERLESS_ADMIN_PASSWORD={{ paperless_admin_password }}
      - PAPERLESS_URL={{ paperless_url }}
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_REDIS=redis://paperless-redis:6379
    volumes:
      - ./data:/usr/src/paperless/data
      - ./consume:/usr/src/paperless/consume
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  newt:
    image: docker.io/fosrl/newt:1.15.0@sha256:d69d047c816ca7721eae90d5f3cd3be53b615b3d498678be21488d666538ee5c
    container_name: newt-paperless
    restart: unless-stopped
    networks:
      - paperless
    environment:
      - PANGOLIN_ENDPOINT={{ pangolin_endpoint }}
      - NEWT_ID={{ paperless_newt_id }}
      - NEWT_SECRET={{ paperless_newt_secret }}

networks:
  paperless:
    name: paperless
