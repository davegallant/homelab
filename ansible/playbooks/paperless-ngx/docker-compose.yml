services:
  paperless-redis:
    image: docker.io/library/redis:8@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - paperless
    volumes:
      - ./redis-data:/data
  paperless-ngx:
    image: docker.io/paperlessngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    container_name: paperless-ngx
    restart: always
    networks:
      - paperless
    environment:
      - PAPERLESS_SECRET_KEY={{ paperless_secret_key }}
      - PAPERLESS_ADMIN_USER={{ paperless_admin_user }}
      - PAPERLESS_ADMIN_PASSWORD={{ paperless_admin_password }}
      - PAPERLESS_URL={{ paperless_url }}
      - PAPERLESS_TIME_ZONE=UTC
      - PAPERLESS_REDIS=redis://paperless-redis:6379
    volumes:
      - ./data:/usr/src/paperless/data
      - ./consume:/usr/src/paperless/consume
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  newt:
    image: docker.io/fosrl/newt:1.18.0@sha256:07507a530f3f239bee4dc208aabdd25095df650f132e926245659e1a67aa5de9
    container_name: newt-paperless
    restart: unless-stopped
    networks:
      - paperless
    environment:
      - PANGOLIN_ENDPOINT={{ pangolin_endpoint }}
      - NEWT_ID={{ paperless_newt_id }}
      - NEWT_SECRET={{ paperless_newt_secret }}

networks:
  paperless:
    name: paperless
