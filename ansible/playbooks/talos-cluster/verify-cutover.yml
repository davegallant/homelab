---
- name: Verify Homepage MagicDNS cutover
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  tasks:
    - name: Read Talos Homepage tailnet IP
      ansible.builtin.command:
        argv: [kubectl, -n, homepage, exec, deployment/homepage, -c, tailscale, --, tailscale, ip, -4]
      register: homepage_tailnet_ip
      changed_when: false
      no_log: true

    - name: Wait for normal hostname to reach Talos with valid TLS
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --noproxy
          - "*"
          - --ipv4
          - --max-time
          - "15"
          - --output
          - /dev/null
          - --write-out
          - "%{remote_ip} %{http_code}"
          - "https://homepage.{{ headscale_magic_dns_domain }}/"
      register: homepage_cutover_http
      until: homepage_cutover_http.rc == 0 and homepage_cutover_http.stdout == (homepage_tailnet_ip.stdout | trim) ~ ' 200'
      retries: 24
      delay: 5
      changed_when: false
      no_log: true

    - name: Confirm the existing hostname serves Talos Homepage
      ansible.builtin.assert:
        that:
          - homepage_cutover_http.stdout == (homepage_tailnet_ip.stdout | trim) ~ ' 200'
