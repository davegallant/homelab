---
- name: Provision the Forgejo runner configuration from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  tasks:
    - name: Require the existing Forgejo runner namespace
      ansible.builtin.command:
        argv: [kubectl, get, namespace, forgejo-runner]
      changed_when: false

    - name: Require the Forgejo runner configuration
      ansible.builtin.assert:
        that:
          - forgejo_runner_config | length > 0
      no_log: true

    - name: Apply the runner configuration without writing credentials to disk
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'forgejo-runner-config', 'namespace': 'forgejo-runner'},
              'type': 'Opaque',
              'data': {'.runner': forgejo_runner_config | b64encode}} | to_json }}
      changed_when: true
      no_log: true
