---
- name: Provision the test Immich Secret from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    # Domain separation keeps the disposable database credential distinct
    # from the production password without storing another plaintext secret.
    immich_test_db_password: "{{ ('homelab-immich-test-v1:' ~ immich_db_password) | hash('sha256') }}"
  tasks:
    - name: Require the test namespace
      ansible.builtin.command:
        argv: [kubectl, get, namespace, immich]
      changed_when: false

    - name: Require the Vault credential
      ansible.builtin.assert:
        that:
          - immich_db_password | length > 0
      no_log: true

    - name: Apply the test Secret without writing credentials to disk
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'immich-external', 'namespace': 'immich'},
              'type': 'Opaque',
              'data': {'DB_PASSWORD': immich_test_db_password | b64encode,
                       'POSTGRES_PASSWORD': immich_test_db_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
