---
- name: Provision the production Immich database Secret from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  tasks:
    - name: Require production database credentials
      ansible.builtin.assert:
        that:
          - immich_db_user | length > 0
          - immich_db_password | length > 0
      no_log: true

    - name: Apply the production Secret without writing credentials to disk
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'immich-production-external', 'namespace': 'immich'},
              'type': 'Opaque',
              'data': {'DB_USERNAME': immich_db_user | b64encode,
                       'POSTGRES_USER': immich_db_user | b64encode,
                       'DB_PASSWORD': immich_db_password | b64encode,
                       'POSTGRES_PASSWORD': immich_db_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
