- name: Render application resources with credentials only in memory
  ansible.builtin.command:
    argv:
      - helm
      - template
      - "{{ gitops_release.name }}"
      - "{{ gitops_apps_dir }}/{{ gitops_release.name }}/chart"
      - --namespace
      - "{{ gitops_release.name }}"
      - --values
      - "-"
    stdin: >-
      {{ (lookup('ansible.builtin.template', gitops_apps_dir + '/' + gitops_release.name + '/' + gitops_release.bridge)
          | from_yaml | combine(gitops_release.overrides, recursive=true)) | to_nice_yaml }}
  register: gitops_secret_render
  changed_when: false
  no_log: true

- name: Apply external application Secrets
  ansible.builtin.command:
    argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
    stdin: >-
      {{ item | combine({'metadata': {'name': item.metadata.name + '-external',
                                      'namespace': gitops_release.name}}, recursive=true) | to_json }}
  loop: "{{ gitops_secret_render.stdout | from_yaml_all | select('mapping') | selectattr('kind', 'equalto', 'Secret') | list }}"
  changed_when: true
  no_log: true

- name: Apply the Ansible-managed Homepage config maps
  ansible.builtin.command:
    argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-homepage, -f, "-"]
    stdin: "{{ item | to_json }}"
  loop: >-
    {{ gitops_secret_render.stdout | from_yaml_all | select('mapping')
       | selectattr('kind', 'equalto', 'ConfigMap')
       | selectattr('metadata.name', 'in', ['homepage-config', 'homepage-node-proxy']) | list }}
  when: gitops_release.name == 'homepage'
  changed_when: true
  no_log: true
