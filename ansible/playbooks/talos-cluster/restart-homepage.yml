- name: Restart Homepage and verify its Service
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Restart Homepage after worker network change
      ansible.builtin.command:
        argv: [kubectl, -n, homepage, rollout, restart, deployment/homepage]
      changed_when: true

    - name: Wait for refreshed Homepage pod
      ansible.builtin.command:
        argv: [kubectl, -n, homepage, rollout, status, deployment/homepage, --timeout=300s]
      changed_when: false

    - name: Read ready Homepage Service endpoints
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - homepage
          - get
          - endpointslice
          - -l
          - kubernetes.io/service-name=homepage
          - -o
          - 'jsonpath={range .items[*].endpoints[*]}{.conditions.ready}{"\n"}{end}'
      register: homepage_service_endpoints
      changed_when: false
      failed_when: homepage_service_endpoints.rc != 0 or 'true' not in homepage_service_endpoints.stdout
