---
- name: Provision the Miniflux pre-sync Argo credential
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  tasks:
    - name: Provision the scoped Argo credential
      ansible.builtin.include_tasks:
        file: presync-miniflux-token-tasks.yml
