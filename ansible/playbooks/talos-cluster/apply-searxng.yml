---
- name: Apply SearXNG to Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/vars.yaml
    - ../../group_vars/all/secrets.yaml
    - ../../kubernetes/apps/searxng/vars.yaml
  vars_prompt:
    - name: talos_kube_context
      prompt: Enter the expected kubectl context for the Talos cluster
      private: false
  tasks:
    - name: Require the SearXNG Vault variables
      ansible.builtin.assert:
        that:
          - searxng_secret_key is defined
          - searxng_secret_key | length > 0
          - searxng_newt_id is defined
          - searxng_newt_secret is defined
          - pangolin_endpoint is defined
        fail_msg: "Missing Vault variables. searxng_secret_key must be added to group_vars/all/secrets.yaml (see ansible/kubernetes/apps/searxng/README.md)."

    - name: Read the active kubectl context
      ansible.builtin.command:
        argv: [kubectl, config, current-context]
      register: searxng_kube_context
      changed_when: false

    - name: Confirm kubectl is pointed at the expected Talos cluster
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0
          - searxng_kube_context.stdout == talos_kube_context
        fail_msg: "kubectl current context does not match the explicitly supplied Talos context."

    - name: Verify all three Talos nodes are Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - --timeout=120s
          - node/k8s-cp-1
          - node/k8s-w-1
          - node/k8s-w-2
      changed_when: false

    - name: Create a protected temporary render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: searxng-k8s-
      register: searxng_render_dir

    - name: Render and apply SearXNG resources
      block:
        - name: Copy namespace manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/namespace.yaml"
            dest: "{{ searxng_render_dir.path }}/namespace.yaml"
            mode: "0600"

        - name: Render SearXNG Secrets
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/secrets.yaml.j2"
            dest: "{{ searxng_render_dir.path }}/secrets.yaml"
            mode: "0600"
          no_log: true

        - name: Render SearXNG Deployment
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/deployment.yaml.j2"
            dest: "{{ searxng_render_dir.path }}/deployment.yaml"
            mode: "0600"

        - name: Copy Valkey manifests
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/valkey.yaml"
            dest: "{{ searxng_render_dir.path }}/valkey.yaml"
            mode: "0600"

        - name: Copy Service manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/service.yaml"
            dest: "{{ searxng_render_dir.path }}/service.yaml"
            mode: "0600"

        - name: Copy SearXNG backup Schedule manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/velero/schedule-searxng.yaml"
            dest: "{{ searxng_render_dir.path }}/schedule-searxng.yaml"
            mode: "0600"

        - name: Apply SearXNG namespace
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/namespace.yaml"]
          register: searxng_apply_namespace
          changed_when: "'created' in searxng_apply_namespace.stdout or 'configured' in searxng_apply_namespace.stdout"

        - name: Apply SearXNG Secrets
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/secrets.yaml"]
          register: searxng_apply_secrets
          changed_when: "'created' in searxng_apply_secrets.stdout or 'configured' in searxng_apply_secrets.stdout"
          no_log: true

        - name: Apply Valkey
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/valkey.yaml"]
          register: searxng_apply_valkey
          changed_when: "'created' in searxng_apply_valkey.stdout or 'configured' in searxng_apply_valkey.stdout"

        - name: Apply SearXNG Deployment
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/deployment.yaml"]
          register: searxng_apply_deployment
          changed_when: "'created' in searxng_apply_deployment.stdout or 'configured' in searxng_apply_deployment.stdout"

        - name: Apply SearXNG Service
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/service.yaml"]
          register: searxng_apply_service
          changed_when: "'created' in searxng_apply_service.stdout or 'configured' in searxng_apply_service.stdout"

        - name: Apply the searxng-daily Schedule
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_render_dir.path }}/schedule-searxng.yaml"]
          register: searxng_apply_schedule
          changed_when: "'created' in searxng_apply_schedule.stdout or 'configured' in searxng_apply_schedule.stdout"

        - name: Wait for Valkey rollout
          ansible.builtin.command:
            argv: [kubectl, -n, searxng, rollout, status, deployment/valkey, --timeout=300s]
          changed_when: false

        - name: Wait for SearXNG rollout
          ansible.builtin.command:
            argv: [kubectl, -n, searxng, rollout, status, deployment/searxng, --timeout=300s]
          changed_when: false

        - name: Report the Newt sidecar state for this apply
          ansible.builtin.debug:
            msg: >-
              searxng_newt_enabled={{ searxng_newt_enabled }} (false = staging;
              the public Pangolin route still belongs to the LXC until
              cutover-searxng.yml runs)

        - name: Trigger a backup from searxng-daily
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - velero
              - exec
              - deployment/velero
              - --
              - /velero
              - backup
              - create
              - --from-schedule
              - searxng-daily
          register: searxng_backup_create
          changed_when: "'Backup request' in searxng_backup_create.stdout or 'backup' in searxng_backup_create.stdout"

        - name: Read SearXNG backups from the schedule
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - velero
              - get
              - backups.velero.io
              - -l
              - velero.io/schedule-name=searxng-daily
              - -o
              - json
          register: searxng_backup_list
          changed_when: false

        - name: Select the newest SearXNG backup name
          ansible.builtin.set_fact:
            searxng_backup_name_value: >-
              {{ ((searxng_backup_list.stdout | from_json)['items']
              | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}

        - name: Require a backup name from the schedule
          ansible.builtin.assert:
            that:
              - searxng_backup_name_value | length > 0

        - name: Wait for the SearXNG backup to complete
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - velero
              - wait
              - "--for=jsonpath={.status.phase}=Completed"
              - "backup/{{ searxng_backup_name_value }}"
              - --timeout=600s
          changed_when: false

        - name: Read PodVolumeBackup results for the SearXNG backup
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - velero
              - get
              - podvolumebackups.velero.io
              - -l
              - "velero.io/backup-name={{ searxng_backup_name_value }}"
              - -o
              - json
          register: searxng_pvb_results
          changed_when: false

        - name: Require a manifests-only backup by design
          ansible.builtin.assert:
            that:
              - (searxng_pvb_results.stdout | from_json)['items'] | length == 0
            fail_msg: >-
              Expected zero PodVolumeBackups for the stateless searxng namespace.
              If volumes were added deliberately, update this check and the app README together.

        - name: Report the verified backup name
          ansible.builtin.debug:
            msg: "Verified backup: {{ searxng_backup_name_value }} (Completed, manifests-only as designed)"
      always:
        - name: Remove temporary rendered manifests
          ansible.builtin.file:
            path: "{{ searxng_render_dir.path }}"
            state: absent
          when: searxng_render_dir.path is defined
