---
- name: Provision the external Umami Secrets from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: ""
    # The compose reaches the database by service name; in-pod it is
    # the neighbouring container, so the URL is assembled here with
    # 127.0.0.1 rather than carried verbatim from the LXC.
    umami_database_url: "postgresql://{{ umami_db_user }}:{{ umami_db_password }}@127.0.0.1:5432/umami"
  tasks:
    - name: Require the existing Umami namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, umami]
      changed_when: false

    - name: Require the Umami credentials
      ansible.builtin.assert:
        that:
          - pangolin_endpoint | length > 0
          - umami_newt_id | length > 0
          - umami_newt_secret | length > 0
          - umami_db_user | length > 0
          - umami_db_password | length > 0
          - umami_app_secret | length > 0
      no_log: true

    - name: Apply the Newt Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'umami-newt-external', 'namespace': 'umami'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': umami_newt_id | b64encode,
                       'NEWT_SECRET': umami_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply the app Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'umami-external', 'namespace': 'umami'},
              'type': 'Opaque',
              'data': {'DATABASE_URL': umami_database_url | b64encode,
                       'APP_SECRET': umami_app_secret | b64encode,
                       'POSTGRES_USER': umami_db_user | b64encode,
                       'POSTGRES_PASSWORD': umami_db_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
