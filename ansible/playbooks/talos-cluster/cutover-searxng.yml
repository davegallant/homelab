---
- name: Cut SearXNG over from the LXC to Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/vars.yaml
    - ../../group_vars/all/secrets.yaml
    - ../../kubernetes/apps/searxng/vars.yaml
  vars_prompt:
    - name: talos_kube_context
      prompt: Enter the expected kubectl context for the Talos cluster
      private: false
    - name: searxng_public_url
      prompt: Enter the public SearXNG URL served through Pangolin (e.g. https://search.example.com/)
      private: false
  tasks:
    - name: Read the active kubectl context
      ansible.builtin.command:
        argv: [kubectl, config, current-context]
      register: searxng_cutover_context
      changed_when: false

    - name: Confirm kubectl is pointed at the expected Talos cluster
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0
          - searxng_cutover_context.stdout == talos_kube_context
        fail_msg: "kubectl current context does not match the explicitly supplied Talos context."

    - name: Require Ready staged SearXNG pods before touching the LXC
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - searxng
          - wait
          - --for=condition=Ready
          - --timeout=120s
          - pod
          - -l
          - app.kubernetes.io/name in (searxng, valkey)
      changed_when: false

    - name: Stop the SearXNG Compose stack on the LXC
      ansible.builtin.command:
        argv: [docker, compose, stop]
        chdir: /root
      delegate_to: searxng
      connection: ssh
      register: searxng_lxc_stop
      changed_when: true

    - name: Require the LXC stack to have stopped
      ansible.builtin.assert:
        that:
          - searxng_lxc_stop.rc == 0
        fail_msg: >-
          docker compose stop failed on the searxng LXC
          (rc={{ searxng_lxc_stop.rc }}). The Newt identity still belongs to
          the LXC; do not enable the cluster sidecar.

    - name: Confirm no LXC containers remain running
      ansible.builtin.command:
        argv: [docker, compose, ps, -q]
        chdir: /root
      delegate_to: searxng
      connection: ssh
      register: searxng_lxc_ps
      changed_when: false

    - name: Require an empty LXC container list
      ansible.builtin.assert:
        that:
          - searxng_lxc_ps.stdout | trim | length == 0
        fail_msg: >-
          Containers are still running on the searxng LXC. Resolve that before
          enabling the cluster Newt sidecar, so the Pangolin site never has two owners.

    - name: Enable the Newt sidecar for this run
      ansible.builtin.set_fact:
        searxng_newt_enabled: true

    - name: Create a protected temporary render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: searxng-cutover-
      register: searxng_cutover_render_dir

    - name: Render and apply the Deployment with Newt enabled
      block:
        - name: Render SearXNG Deployment with Newt
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/searxng/deployment.yaml.j2"
            dest: "{{ searxng_cutover_render_dir.path }}/deployment.yaml"
            mode: "0600"

        - name: Apply SearXNG Deployment with Newt
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ searxng_cutover_render_dir.path }}/deployment.yaml"]
          register: searxng_cutover_apply
          changed_when: "'created' in searxng_cutover_apply.stdout or 'configured' in searxng_cutover_apply.stdout"

        - name: Wait for SearXNG rollout with Newt
          ansible.builtin.command:
            argv: [kubectl, -n, searxng, rollout, status, deployment/searxng, --timeout=300s]
          changed_when: false
      always:
        - name: Remove temporary rendered manifests
          ansible.builtin.file:
            path: "{{ searxng_cutover_render_dir.path }}"
            state: absent
          when: searxng_cutover_render_dir.path is defined

    - name: Read recent Newt sidecar logs
      ansible.builtin.command:
        argv: [kubectl, -n, searxng, logs, deployment/searxng, -c, newt, --tail=50]
      register: searxng_newt_logs
      changed_when: false
      failed_when: false

    - name: Report Newt sidecar logs
      ansible.builtin.debug:
        msg: "{{ searxng_newt_logs.stdout_lines | default([]) }}"

    - name: Require Pangolin to report the Newt target healthy
      ansible.builtin.assert:
        that:
          - >-
            'Target 5 initial status: healthy' in searxng_newt_logs.stdout or
            'Target 5 status changed: unhealthy -> healthy' in searxng_newt_logs.stdout
        fail_msg: "Newt has not reported target 5 healthy; do not consider cutover complete."

    - name: Wait for the public URL to respond
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --noproxy
          - "*"
          - --max-time
          - "15"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "{{ searxng_public_url }}"
      register: searxng_public_http
      until: >-
        searxng_public_http.rc == 0 and
        searxng_public_http.stdout in ['200', '401']
      retries: 24
      delay: 5
      changed_when: false

    - name: Confirm the public URL is reachable after the LXC stopped
      ansible.builtin.assert:
        that:
          - searxng_public_http.stdout in ['200', '401']
        fail_msg: "The public URL did not respond with HTTP 200 or the expected SSO-protected 401. Run rollback-searxng.yml to restore the LXC stack."

    - name: Report cutover complete
      ansible.builtin.debug:
        msg: >-
          Cutover complete: the LXC stack is stopped, Pangolin reports its Newt
          target healthy, and the public URL responds with HTTP
          {{ searxng_public_http.stdout }}. A 401 is expected when Pangolin SSO
          protects this resource. The stopped LXC stack remains the rollback
          target (rollback-searxng.yml).
