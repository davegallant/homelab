# Select with --tags cert-manager-cloudflare. Applies the Cloudflare DNS token
# the cert-manager ClusterIssuers use for DNS-01.
- name: Provision the cert-manager Cloudflare DNS token
  tags:
    - never
    - cert-manager-cloudflare
  block:
    - name: Verify the intended Kubernetes API server
      ansible.builtin.command:
        argv: [kubectl, config, view, --minify, -o, "jsonpath={.clusters[0].cluster.server}"]
      register: cert_manager_api
      changed_when: false

    - name: Read the intended Kubernetes nodes
      ansible.builtin.command:
        argv: [kubectl, get, nodes, -o, json]
      register: cert_manager_nodes
      changed_when: false

    - name: Require the intended cluster
      ansible.builtin.assert:
        that:
          - cert_manager_api.stdout == 'https://192.168.1.210:6443'
          - >-
            (cert_manager_nodes.stdout | from_json)['items']
            | map(attribute='metadata.name') | sort | list
            == ['k8s-cp-1', 'k8s-w-1', 'k8s-w-2']

    - name: Require the Vault Cloudflare DNS token
      ansible.builtin.assert:
        that:
          - cloudflare_dns_api_token is defined
          - cloudflare_dns_api_token | length > 0
      no_log: true

    - name: Render and apply the protected token Secret
      no_log: true
      block:
        - name: Allocate a protected manifest file
          ansible.builtin.tempfile:
            state: file
            prefix: cert-manager-cloudflare-
          register: cert_manager_token_temp

        - name: Write the token Secret manifest
          ansible.builtin.copy:
            dest: "{{ cert_manager_token_temp.path }}"
            mode: "0600"
            content: >-
              {{ {'apiVersion': 'v1', 'kind': 'Secret',
                  'metadata': {'name': 'cloudflare-dns-api-token', 'namespace': 'cert-manager'},
                  'type': 'Opaque',
                  'stringData': {'api-token': cloudflare_dns_api_token | trim}} | to_json }}

        - name: Apply the token Secret outside Argo ownership
          ansible.builtin.command:
            argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "{{ cert_manager_token_temp.path }}"]
          changed_when: true
      always:
        - name: Remove the protected manifest file
          ansible.builtin.file:
            path: "{{ cert_manager_token_temp.path }}"
            state: absent
          when: cert_manager_token_temp is defined and cert_manager_token_temp.path is defined
          no_log: true
