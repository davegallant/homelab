---
- name: Provision the external Audiobookshelf Secret from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: admin@homelab
  tasks:
    - name: Require the existing Audiobookshelf namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, audiobookshelf]
      changed_when: false

    - name: Require the Audiobookshelf credentials
      ansible.builtin.assert:
        that:
          - pangolin_endpoint | length > 0
          - audiobookshelf_newt_id | length > 0
          - audiobookshelf_newt_secret | length > 0
      no_log: true

    - name: Apply the external Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'audiobookshelf-newt-external', 'namespace': 'audiobookshelf'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': audiobookshelf_newt_id | b64encode,
                       'NEWT_SECRET': audiobookshelf_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true
