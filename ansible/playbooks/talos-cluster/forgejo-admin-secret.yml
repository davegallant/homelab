---
- name: Provision the Forgejo admin Secret from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  tasks:
    - name: Require the existing Forgejo namespace
      ansible.builtin.command:
        argv: [kubectl, get, namespace, forgejo]
      changed_when: false

    - name: Require the Forgejo admin password
      ansible.builtin.assert:
        that:
          - forgejo_admin_password | length >= 64
      no_log: true

    - name: Apply the Forgejo admin Secret without writing credentials to disk
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'forgejo-admin-external', 'namespace': 'forgejo'},
              'type': 'Opaque',
              'data': {'username': 'gitea_admin' | b64encode,
                       'password': forgejo_admin_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
