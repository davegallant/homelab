---
- name: Provision external resources for Argo CD workloads
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/vars.yaml
    - ../../group_vars/all/secrets.yaml
    - ../../../kubernetes/apps/homepage/vars.yaml
    - ../../../kubernetes/apps/kiwix/vars.yaml
  vars:
    talos_kube_context: admin@homelab
    gitops_apps_dir: "{{ playbook_dir }}/../../../kubernetes/apps"
    homepage_target_namespace: homepage
    homepage_restart_timestamp: ""
    gitops_releases:
      - name: bentopdf
        bridge: values.secrets.yaml.j2
        overrides: {newt: {enabled: true}}
      - name: searxng
        bridge: values.secrets.yaml.j2
        overrides: {newt: {enabled: true}}
      - name: miniflux
        bridge: values.ansible.yaml.j2
        overrides: {newt: {enabled: true}}
      - name: kiwix
        bridge: values.ansible.yaml.j2
        overrides: {tailscale: {enabled: true}}
      - name: homepage
        bridge: values.ansible.yaml.j2
        overrides: {}
    # Batch A (app-template workloads): each needs only its Caddy
    # Cloudflare credential as an external Secret. The namespaces
    # must exist first (apps/<app>/storage.yaml).
    gitops_caddy_secret_namespaces:
      - seerr
      - lubelogger
      - maloja
      - changedetection
      - romm
      # Batch C: the one tailnet app of the batch.
      - speedtest-tracker
      # Batch D: the *arr suite (all four are tailnet apps).
      - prowlarr
      - sonarr
      - radarr
      - lidarr
  tasks:
    - name: Provision Vault-backed application resources
      ansible.builtin.include_tasks:
        file: gitops-secrets-tasks.yml
      loop: "{{ gitops_releases }}"
      loop_control:
        loop_var: gitops_release
        label: "{{ gitops_release.name }}"

    - name: Read Homepage icon files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ lookup('ansible.builtin.fileglob', gitops_apps_dir + '/homepage/config/icons/*', wantlist=true) }}"
      register: homepage_icon_files
      no_log: true

    - name: Apply Homepage icons outside Argo CD ownership
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --force-conflicts, --field-manager=ansible-homepage, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', gitops_apps_dir + '/homepage/icons-configmap.yaml.j2') }}"
      changed_when: true

    - name: Provision the existing Velero Garage credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', gitops_apps_dir + '/velero/credentials.yaml.j2') }}"
      changed_when: true
      no_log: true

    - name: Provision the Argo CD Cloudflare credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'argocd-caddy', 'namespace': 'argocd'},
              'type': 'Opaque',
              'data': {'cloudflare_api_token': cloudflare_dns_api_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Provision the Batch A Caddy credentials
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': item + '-caddy-external', 'namespace': item},
              'type': 'Opaque',
              'data': {'cloudflare_api_token': cloudflare_dns_api_token | b64encode}} | to_json }}
      loop: "{{ gitops_caddy_secret_namespaces }}"
      changed_when: true
      no_log: true

    - name: Apply the Ansible-managed Argo CD tailnet configuration
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', gitops_apps_dir + '/argocd/tailnet-config.yaml.j2') }}"
      changed_when: true
