---
- name: Provision external resources for Argo CD workloads
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
    - ../../group_vars/all/vars.yaml
    - ../../../kubernetes/apps/homepage/vars.yaml
    - ../../../kubernetes/apps/kiwix/vars.yaml
  vars:
    talos_kube_context: ""
    gitops_apps_dir: "{{ playbook_dir }}/../../../kubernetes/apps"
    homepage_target_namespace: homepage
    homepage_restart_timestamp: ""
    gitops_releases:
      - name: bentopdf
        bridge: values.secrets.yaml.j2
        overrides: {newt: {enabled: true}}
      - name: searxng
        bridge: values.secrets.yaml.j2
        overrides: {newt: {enabled: true}}
      - name: kiwix
        bridge: values.ansible.yaml.j2
        overrides: {tailscale: {enabled: true}}
      - name: homepage
        bridge: values.ansible.yaml.j2
        overrides: {}
    # Batch A (app-template workloads): each needs only its Caddy
    # Cloudflare credential as an external Secret. The namespaces
    # must exist first (apps/<app>/storage.yaml).
    gitops_caddy_secret_namespaces:
      - seerr
      - lubelogger
      - maloja
      - changedetection
      - romm
      # Batch C: the one tailnet app of the batch.
      - speedtest-tracker
      # Batch D: the *arr suite (all four are tailnet apps).
      - prowlarr
      - sonarr
      - radarr
      - lidarr
      # k8s-readonly: the namespace must exist before its Caddy credential is applied.
      - k8s-readonly
    gitops_pod_security_namespaces:
      - homepage
      - bentopdf
      - searxng
      - arca
      - headplane
      - freshrss
      - loki
      - litellm
  tasks:
    - name: Provision Gaswatch runtime settings
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'gaswatch-runtime-external', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'GASWATCH_LOCATION': gaswatch_location | b64encode,
                       'GASWATCH_LATITUDE': gaswatch_latitude | string | b64encode,
                       'GASWATCH_LONGITUDE': gaswatch_longitude | string | b64encode,
                       'GASWATCH_RADIUS_KM': gaswatch_radius_km | string | b64encode,
                       'GASWATCH_FUEL_GRADE': gaswatch_fuel_grade | b64encode,
                       'GASWATCH_MAX_PRICE_AGE_HOURS': gaswatch_max_price_age_hours | string | b64encode,
                       'GASWATCH_DROP_CPL': gaswatch_drop_cpl | string | b64encode,
                       'GASWATCH_DROP_LOOKBACK_HOURS': gaswatch_drop_lookback_hours | string | b64encode,
                       'GASWATCH_HYSTERESIS_CPL': gaswatch_hysteresis_cpl | string | b64encode,
                       'GASWATCH_QUIET_HOURS': gaswatch_quiet_hours | b64encode,
                       'GASWATCH_TIMEOUT_SECONDS': gaswatch_timeout_seconds | string | b64encode,
                       'GASWATCH_FAVOURITE_STATION_IDS': gaswatch_favourite_station_ids | b64encode,
                       'GASWATCH_GOTIFY_TOKEN': gaswatch_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      when: >-
        gaswatch_location is defined and gaswatch_latitude is defined and
        gaswatch_longitude is defined and gaswatch_radius_km is defined and
        gaswatch_fuel_grade is defined and gaswatch_max_price_age_hours is defined and
        gaswatch_drop_cpl is defined and gaswatch_drop_lookback_hours is defined and
        gaswatch_hysteresis_cpl is defined and gaswatch_quiet_hours is defined and
        gaswatch_timeout_seconds is defined and gaswatch_favourite_station_ids is defined and
        gaswatch_gotify_token is defined
      tags: [gaswatch-secrets]

    - name: Provision the RFD rising deals Gotify credential
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'rfd-rising-deals-gotify', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'token': rfd_notify_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags: [rfd-rising-deals-secret]
    - name: Provision the Argo Workflows Gotify notification credential
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'argo-workflows-gotify', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'token': argo_workflows_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags: [argo-workflows-gotify-secret]

    - name: Provision RFD Notify runtime settings
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'rfd-notify-runtime-external', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'APPRISE_URL': ('gotifys://gotify.davegallant.ca/' ~ rfd_notify_gotify_token ~ '?format=markdown') | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags: [rfd-notify-secrets]
    - name: Provision the RFD rising deals LiteLLM credential
      ansible.builtin.command:
        argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'rfd-rising-deals-litellm', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'api-key': rfd_enrich_litellm_master_key | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags: [rfd-rising-deals-secret]
    - name: Apply Pod Security labels to application namespaces
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-pod-security
          - -f
          - "{{ gitops_apps_dir }}/{{ item }}/namespace.yaml"
      loop: "{{ gitops_pod_security_namespaces }}"
      register: gitops_pod_security_apply
      changed_when: >-
        'created' in gitops_pod_security_apply.stdout or
        'configured' in gitops_pod_security_apply.stdout
      tags:
        - pod-security

    - name: Provision LiteLLM provider credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'litellm-provider-external', 'namespace': 'litellm'},
              'type': 'Opaque',
              'data': {'OPENROUTER_API_KEY': rfd_enrich_openrouter_api_key | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - rfd-enrich-secrets

    - name: Provision LiteLLM master key
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'litellm-masterkey-external', 'namespace': 'litellm'},
              'type': 'Opaque',
              'data': {'masterkey': rfd_enrich_litellm_master_key | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - rfd-enrich-secrets

    - name: Provision RFD enricher credentials
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'rfd-enrich-runtime-external', 'namespace': 'argo-workflows'},
              'type': 'Opaque',
              'data': {'REFRESH_SECRET': rfd_enrich_refresh_secret | b64encode,
                       'ENRICH_API_KEY': rfd_enrich_litellm_master_key | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - rfd-enrich-secrets

    - name: Provision Arca registry pull credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'arca-registry-external', 'namespace': 'arca'},
              'type': 'kubernetes.io/dockerconfigjson',
              'data': {'.dockerconfigjson':
                {'auths': {'forgejo.davegallant.ca':
                  {'username': 'dave', 'password': arca_registry_read_token,
                   'auth': ('dave:' ~ arca_registry_read_token) | b64encode}}} | to_json | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      when: arca_registry_read_token is defined
      tags:
        - arca-registry-secret

    - name: Provision Vault-backed application resources
      ansible.builtin.include_tasks:
        file: gitops-secrets-tasks.yml
      loop: "{{ gitops_releases }}"
      loop_control:
        loop_var: gitops_release
        label: "{{ gitops_release.name }}"

    - name: Read Homepage icon files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ lookup('ansible.builtin.fileglob', gitops_apps_dir + '/homepage/config/icons/*', wantlist=true) }}"
      register: homepage_icon_files
      no_log: true

    - name: Apply Homepage icons outside Argo CD ownership
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-homepage, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', gitops_apps_dir + '/homepage/icons-configmap.yaml.j2') }}"
      changed_when: true

    - name: Provision the existing Velero Garage credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "-"]
        stdin: "{{ lookup('ansible.builtin.template', gitops_apps_dir + '/velero/credentials.yaml.j2') }}"
      changed_when: true
      no_log: true

    - name: Read the current Velero Kopia repository credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", -n, velero, get, secret, velero-repo-credentials, -o, json]
      register: velero_kopia_current_secret
      changed_when: false
      failed_when: velero_kopia_current_secret.rc != 0 and 'NotFound' not in velero_kopia_current_secret.stderr
      no_log: true
      when: velero_kopia_password_update_enabled | default(false) | bool
      tags:
        - never
        - velero-kopia-secret

    - name: Provision the Kopia repository password after migration
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --force-conflicts, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'velero-repo-credentials', 'namespace': 'velero'},
              'type': 'Opaque',
              'data': {'repository-password': velero_kopia_repository_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      when:
        - velero_kopia_password_update_enabled | default(false) | bool
        - >-
          velero_kopia_current_secret.rc != 0 or
          (velero_kopia_current_secret.stdout | from_json).data.get('repository-password', '')
          != velero_kopia_repository_password | b64encode
      tags:
        - never
        - velero-kopia-secret

    - name: Provision the Argo CD Gotify credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'argocd-notifications-secret', 'namespace': 'argocd'},
              'type': 'Opaque',
              'data': {'gotify-token': argocd_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Provision the Headplane session secret
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'headplane-external', 'namespace': 'headplane'},
              'type': 'Opaque',
              'data': {'cookie-secret': headplane_cookie_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - headplane-secret

    - name: Provision the backup watchdog Gotify credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'backup-watchdog-gotify', 'namespace': 'velero'},
              'type': 'Opaque',
              'data': {'token': backup_watchdog_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - backup-watchdog-secret

    - name: Provision the Forgejo URL credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'forgejo-external', 'namespace': 'forgejo'},
              'type': 'Opaque',
              'data': {'ROOT_URL': forgejo_root_url | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - forgejo-secrets

    - name: Provision the Forgejo Newt credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'forgejo-newt-external', 'namespace': 'forgejo'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': forgejo_newt_id | b64encode,
                       'NEWT_SECRET': forgejo_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - forgejo-secrets

    - name: Provision the Grafana Gotify credential
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'grafana-gotify', 'namespace': 'grafana'},
              'type': 'Opaque',
              'data': {'token': grafana_gotify_token | b64encode}} | to_json }}
      changed_when: true
      no_log: true
      tags:
        - grafana-gotify-secret

    - name: Provision the Batch A Caddy credentials
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, --server-side, --field-manager=ansible-vault, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': item + '-caddy-external', 'namespace': item},
              'type': 'Opaque',
              'data': {'cloudflare_api_token': cloudflare_dns_api_token | b64encode}} | to_json }}
      loop: "{{ gitops_caddy_secret_namespaces }}"
      changed_when: true
      no_log: true

    - name: Provision the approved tailnet Gateway certificate
      ansible.builtin.include_tasks:
        file: gitops-tailnet-gateway-secret-tasks.yml
        apply:
          tags: tailnet-gateway-tls
      when: tailnet_gateway_provision_tls | default(false) | bool
      tags:
        - never
        - tailnet-gateway-tls

    - name: Provision the approved tailnet Gateway fronting auth
      ansible.builtin.include_tasks:
        file: gitops-tailnet-gateway-auth-tasks.yml
        apply:
          tags: tailnet-gateway-auth
      when: tailnet_gateway_provision_auth | default(false) | bool
      tags:
        - never
        - tailnet-gateway-auth
