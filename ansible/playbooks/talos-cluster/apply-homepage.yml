---
- name: Apply Homepage to Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/vars.yaml
    - ../../group_vars/all/secrets.yaml
    - ../../kubernetes/apps/homepage/vars.yaml
  vars:
    homepage_tailscale_authkey: ""
  vars_prompt:
    - name: talos_kube_context
      prompt: Enter the expected kubectl context for the Talos cluster
      private: false
  tasks:
    - name: Read the active kubectl context
      ansible.builtin.command:
        argv: [kubectl, config, current-context]
      register: homepage_kube_context
      changed_when: false

    - name: Confirm kubectl is pointed at the expected Talos cluster
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0
          - homepage_kube_context.stdout == talos_kube_context
        fail_msg: "kubectl current context does not match the explicitly supplied Talos context."

    - name: Verify all three Talos nodes are Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - --timeout=120s
          - node/k8s-cp-1
          - node/k8s-w-1
          - node/k8s-w-2
      changed_when: false

    - name: Check for an existing online Homepage tailnet identity
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - homepage
          - exec
          - deployment/homepage
          - -c
          - tailscale
          - --
          - tailscale
          - ip
          - -4
      register: homepage_existing_tailnet_identity
      failed_when: false
      changed_when: false
      no_log: true

    - name: Create a one-use Headscale registration key
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - headscale
          - headscale
          - preauthkeys
          - create
          - --user
          - "1"
          - --expiration
          - 1h
          - --output
          - json
      delegate_to: pangolin
      connection: ssh
      remote_user: root
      register: homepage_new_preauthkey
      changed_when: true
      when: homepage_existing_tailnet_identity.rc != 0 or homepage_existing_tailnet_identity.stdout | length == 0
      failed_when: false
      no_log: true

    - name: Require successful Headscale key creation
      ansible.builtin.assert:
        that:
          - homepage_new_preauthkey.rc == 0
        fail_msg: >-
          Headscale key creation failed (rc={{ homepage_new_preauthkey.rc }};
          stderr={{ homepage_new_preauthkey.stderr | regex_replace('[A-Za-z0-9+/=_-]{16,}', '[redacted]') }}).
      when: homepage_new_preauthkey is not skipped

    - name: Hold the one-use key only in Ansible memory
      ansible.builtin.set_fact:
        homepage_tailscale_authkey: "{{ (homepage_new_preauthkey.stdout | from_json).key }}"
      when: homepage_new_preauthkey is not skipped
      no_log: true

    - name: Create a protected temporary render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: homepage-k8s-
      register: homepage_render_dir

    - name: Render and apply Homepage resources
      block:
        - name: Copy namespace manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/namespace.yaml"
            dest: "{{ homepage_render_dir.path }}/namespace.yaml"
            mode: "0600"

        - name: Copy storage manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/storage.yaml"
            dest: "{{ homepage_render_dir.path }}/storage.yaml"
            mode: "0600"

        - name: Copy ServiceAccount manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/serviceaccount.yaml"
            dest: "{{ homepage_render_dir.path }}/serviceaccount.yaml"
            mode: "0600"

        - name: Read custom icons as binary data
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop: "{{ query('ansible.builtin.fileglob', playbook_dir + '/../homepage/config/icons/*') | sort }}"
          register: homepage_icon_files
          no_log: true

        - name: Render Homepage ConfigMaps
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/configmap.yaml.j2"
            dest: "{{ homepage_render_dir.path }}/configmap.yaml"
            mode: "0600"

        - name: Render Homepage Secrets
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/secrets.yaml.j2"
            dest: "{{ homepage_render_dir.path }}/secrets.yaml"
            mode: "0600"
          no_log: true

        - name: Render one-use Tailscale auth Secret
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/tailscale-auth-secret.yaml.j2"
            dest: "{{ homepage_render_dir.path }}/tailscale-auth-secret.yaml"
            mode: "0600"
          when: homepage_tailscale_authkey | length > 0
          no_log: true

        - name: Render Homepage Deployment
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/deployment.yaml.j2"
            dest: "{{ homepage_render_dir.path }}/deployment.yaml"
            mode: "0600"

        - name: Copy Homepage Service manifest
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../kubernetes/apps/homepage/service.yaml"
            dest: "{{ homepage_render_dir.path }}/service.yaml"
            mode: "0600"

        - name: Verify persistent Tailscale identity before an update without a new key
          when: homepage_tailscale_authkey | length == 0
          block:
            - name: Find the existing Homepage pod
              ansible.builtin.command:
                argv:
                  - kubectl
                  - -n
                  - homepage
                  - get
                  - pods
                  - -l
                  - app.kubernetes.io/name=homepage
                  - -o
                  - jsonpath={.items[0].metadata.name}
              register: homepage_existing_pod
              changed_when: false
              failed_when: homepage_existing_pod.rc != 0 or homepage_existing_pod.stdout | length == 0
              no_log: true

            - name: Confirm the existing Tailscale identity is online
              ansible.builtin.command:
                argv:
                  - kubectl
                  - -n
                  - homepage
                  - exec
                  - "{{ homepage_existing_pod.stdout }}"
                  - -c
                  - tailscale
                  - --
                  - tailscale
                  - ip
                  - -4
              register: homepage_existing_tailscale_ip
              changed_when: false
              failed_when: homepage_existing_tailscale_ip.rc != 0 or homepage_existing_tailscale_ip.stdout | length == 0
              no_log: true

        - name: Apply Homepage namespace
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/namespace.yaml"]
          register: homepage_apply_namespace
          changed_when: "'created' in homepage_apply_namespace.stdout or 'configured' in homepage_apply_namespace.stdout"

        - name: Apply Homepage storage
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/storage.yaml"]
          register: homepage_apply_storage
          changed_when: "'created' in homepage_apply_storage.stdout or 'configured' in homepage_apply_storage.stdout"

        - name: Apply Homepage ServiceAccount
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/serviceaccount.yaml"]
          register: homepage_apply_serviceaccount
          changed_when: "'created' in homepage_apply_serviceaccount.stdout or 'configured' in homepage_apply_serviceaccount.stdout"

        - name: Apply Homepage ConfigMaps
          ansible.builtin.command:
            argv: [kubectl, apply, --server-side, -f, "{{ homepage_render_dir.path }}/configmap.yaml"]
          register: homepage_apply_configmaps
          changed_when: "'created' in homepage_apply_configmaps.stdout or 'configured' in homepage_apply_configmaps.stdout"

        - name: Apply Homepage Secrets
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/secrets.yaml"]
          register: homepage_apply_secrets
          changed_when: "'created' in homepage_apply_secrets.stdout or 'configured' in homepage_apply_secrets.stdout"
          no_log: true

        - name: Apply one-use Tailscale auth Secret
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/tailscale-auth-secret.yaml"]
          when: homepage_tailscale_authkey | length > 0
          register: homepage_apply_tailscale_secret
          changed_when: "'created' in homepage_apply_tailscale_secret.stdout or 'configured' in homepage_apply_tailscale_secret.stdout"
          no_log: true

        - name: Apply Homepage Deployment
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/deployment.yaml"]
          register: homepage_apply_deployment
          changed_when: "'created' in homepage_apply_deployment.stdout or 'configured' in homepage_apply_deployment.stdout"

        - name: Restart Homepage to load the one-use Tailscale auth Secret
          ansible.builtin.command:
            argv: [kubectl, -n, homepage, rollout, restart, deployment/homepage]
          when: homepage_tailscale_authkey | length > 0
          changed_when: true
          no_log: true

        - name: Apply Homepage Service
          ansible.builtin.command:
            argv: [kubectl, apply, -f, "{{ homepage_render_dir.path }}/service.yaml"]
          register: homepage_apply_service
          changed_when: "'created' in homepage_apply_service.stdout or 'configured' in homepage_apply_service.stdout"

        - name: Wait for Homepage rollout
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - rollout
              - status
              - deployment/homepage
              - --timeout=300s
          changed_when: false

        - name: Confirm Tailscale has an assigned tailnet IP
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - exec
              - deployment/homepage
              - -c
              - tailscale
              - --
              - tailscale
              - ip
              - -4
          register: homepage_tailscale_ip
          changed_when: false
          failed_when: homepage_tailscale_ip.rc != 0 or homepage_tailscale_ip.stdout | length == 0
          no_log: true

        - name: Read the initial Tailscale node identity
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - exec
              - deployment/homepage
              - -c
              - tailscale
              - --
              - tailscale
              - status
              - --json
          register: homepage_tailscale_status
          changed_when: false
          no_log: true

        - name: Confirm Tailscale uses the configured hostname
          ansible.builtin.assert:
            that:
              - homepage_tailscale_status.stdout is search('"HostName"\\s*:\\s*"' ~ homepage_tailscale_hostname ~ '"')
            fail_msg: "The Tailscale node does not have the configured hostname."
          no_log: true

        - name: Remove the one-use Tailscale auth Secret after identity verification
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - delete
              - secret
              - homepage-tailscale-auth
              - --ignore-not-found=true
          register: homepage_delete_tailscale_secret
          changed_when: "'deleted' in homepage_delete_tailscale_secret.stdout"
          no_log: true

        - name: Restart Homepage after removing the one-use auth Secret
          ansible.builtin.command:
            argv: [kubectl, -n, homepage, rollout, restart, deployment/homepage]
          when: homepage_delete_tailscale_secret.stdout is search('deleted')
          changed_when: true
          no_log: true

        - name: Wait for Homepage rollout without the one-use auth Secret
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - rollout
              - status
              - deployment/homepage
              - --timeout=300s
          when: homepage_delete_tailscale_secret.stdout is search('deleted')
          changed_when: false

        - name: Confirm Tailscale identity survives without the auth Secret
          ansible.builtin.command:
            argv:
              - kubectl
              - -n
              - homepage
              - exec
              - deployment/homepage
              - -c
              - tailscale
              - --
              - tailscale
              - ip
              - -4
          register: homepage_tailscale_ip_after_restart
          when: homepage_delete_tailscale_secret.stdout is search('deleted')
          changed_when: false
          failed_when: homepage_tailscale_ip_after_restart.rc != 0 or homepage_tailscale_ip_after_restart.stdout | length == 0
          no_log: true
      always:
        - name: Remove temporary rendered manifests
          ansible.builtin.file:
            path: "{{ homepage_render_dir.path }}"
            state: absent
          when: homepage_render_dir.path is defined
