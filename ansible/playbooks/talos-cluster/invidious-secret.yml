---
- name: Provision the external Invidious Secrets from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: ""
    # The whole INVIDIOUS_CONFIG block lives in the Secret: the app
    # takes its configuration as one env var, and the database and
    # companion addresses change in-pod (the compose's service names
    # become 127.0.0.1, the neighbouring containers).
    invidious_config: |
      db:
        dbname: invidious
        user: "{{ invidious_db_user }}"
        password: "{{ invidious_db_password }}"
        host: 127.0.0.1
        port: 5432
      check_tables: true
      invidious_companion:
        - private_url: "http://127.0.0.1:8282/companion"
      invidious_companion_key: "{{ invidious_companion_secret_key }}"
      hmac_key: "{{ invidious_hmac_key }}"
  tasks:
    - name: Require the existing Invidious namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, invidious]
      changed_when: false

    - name: Require the Invidious credentials
      ansible.builtin.assert:
        that:
          - pangolin_endpoint | length > 0
          - invidious_newt_id | length > 0
          - invidious_newt_secret | length > 0
          - invidious_db_user | length > 0
          - invidious_db_password | length > 0
          - invidious_companion_secret_key | length > 0
          - invidious_hmac_key | length > 0
      no_log: true

    - name: Apply the Newt Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'invidious-newt-external', 'namespace': 'invidious'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': invidious_newt_id | b64encode,
                       'NEWT_SECRET': invidious_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply the app Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'invidious-external', 'namespace': 'invidious'},
              'type': 'Opaque',
              'data': {'INVIDIOUS_CONFIG': invidious_config | b64encode,
                       'SERVER_SECRET_KEY': invidious_companion_secret_key | b64encode,
                       'POSTGRES_USER': invidious_db_user | b64encode,
                       'POSTGRES_PASSWORD': invidious_db_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
