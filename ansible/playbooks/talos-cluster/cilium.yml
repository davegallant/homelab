---
- name: Check Cilium memory headroom on pve-g3-2
  hosts: pve-g3-2
  gather_facts: false
  vars:
    cilium_agent_memory_request_mib: 192
    pve_memory_reserve_mib: 2048
  tasks:
    - name: Read pve-g3-2 memory availability
      ansible.builtin.command:
        argv: [cat, /proc/meminfo]
      register: cilium_pve_meminfo
      changed_when: false
      when: cilium_install_scope | default('cluster') == 'cluster'

    - name: Require the agent request plus the 2 GiB host reserve
      ansible.builtin.assert:
        that:
          - >-
            (((cilium_pve_meminfo.stdout_lines | select('match', '^MemAvailable:') | first).split()[1] | int) / 1024)
            >= (cilium_agent_memory_request_mib + pve_memory_reserve_mib)
        fail_msg: "Cilium needs its 192 MiB request in addition to pve-g3-2's 2 GiB free-memory reserve."
      when: cilium_install_scope | default('cluster') == 'cluster'

- name: Install Cilium in secondary migration mode on Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../kubernetes/apps/cilium/vars.yaml
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: ""
    cilium_bootstrap_mode: migration
    cilium_recovery: false
    cilium_apps_dir: "{{ playbook_dir }}/../../../kubernetes/apps/cilium"
  tasks:
    - name: Validate the secondary installation scope
      ansible.builtin.assert:
        that:
          - cilium_install_scope | default('cluster') in ['cluster', 'control-plane']
          - cilium_bootstrap_mode in ['migration', 'steady']

    - name: Leave Argo-managed Cilium to manual sync unless explicitly recovering
      ansible.builtin.include_tasks:
        file: ../../tasks/assert-not-argocd-managed.yml
      vars:
        gitops_guard_namespace: cilium-system
        gitops_guard_kind: daemonset
        gitops_guard_name: cilium
      when: not (cilium_recovery | bool)

    - name: Read the active kubectl context
      ansible.builtin.command:
        argv: [kubectl, config, current-context]
      register: cilium_kube_context
      changed_when: false

    - name: Confirm kubectl is pointed at the expected Talos cluster
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0
          - cilium_kube_context.stdout == talos_kube_context
        fail_msg: "Pass -e talos_kube_context=<the Talos context> matching the active kubectl context."

    - name: Verify all Talos nodes are Ready before installation
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - wait
          - --for=condition=Ready
          - --timeout=120s
          - node/k8s-cp-1
          - node/k8s-w-1
          - node/k8s-w-2
      changed_when: false
      when: not (cilium_recovery | bool)

    - name: Read Argo CD application health before installation
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - argocd
          - get
          - applications
          - -o
          - jsonpath={range .items[*]}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}
      register: cilium_apps_before
      changed_when: false
      when: not (cilium_recovery | bool)

    - name: Require all applications Synced and Healthy before installation
      ansible.builtin.assert:
        that:
          - cilium_apps_before.stdout_lines | length > 0
          - cilium_apps_before.stdout_lines | reject('equalto', 'Synced Healthy') | list | length == 0
        fail_msg: "All Argo CD applications must be Synced and Healthy before Cilium installation."
      when: not (cilium_recovery | bool)

    - name: Read node InternalIP addresses before installation
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - get
          - nodes
          - -o
          - 'jsonpath={range .items[*]}{.metadata.name}{" "}{range .status.addresses[?(@.type=="InternalIP")]}{.address}{","}{end}{"\n"}{end}'
      register: cilium_node_ips_before
      changed_when: false

    - name: Require the three configured LAN node addresses before installation
      ansible.builtin.assert:
        that:
          - "'k8s-cp-1 192.168.1.210,' in cilium_node_ips_before.stdout_lines"
          - "'k8s-w-1 192.168.1.211,' in cilium_node_ips_before.stdout_lines"
          - "'k8s-w-2 192.168.1.212,' in cilium_node_ips_before.stdout_lines"
        fail_msg: "Talos nodes must report only their configured LAN InternalIPs before Cilium installation."

    - name: Confirm Flannel remains the active CNI
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - kube-system
          - get
          - daemonset/kube-flannel
          - -o
          - jsonpath={.status.numberReady}
      register: cilium_flannel_ready
      changed_when: false
      when: cilium_bootstrap_mode == 'migration'

    - name: Require all Flannel agents before secondary installation
      ansible.builtin.assert:
        that:
          - cilium_flannel_ready.stdout | int == 3
        fail_msg: "Flannel is not healthy on all three nodes; do not start the migration."
      when: cilium_bootstrap_mode == 'migration'

    - name: Apply the Cilium Pod Security exception namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - -f
          - "{{ cilium_apps_dir }}/namespace.yaml"
      changed_when: false

    - name: Materialize Vault-owned TLS for steady-state recovery
      ansible.builtin.include_tasks:
        file: cilium-tls-tasks.yml
      when: cilium_bootstrap_mode == 'steady'

    - name: Validate the pinned secondary-mode Cilium chart
      ansible.builtin.command:
        argv:
          - helm
          - template
          - cilium
          - cilium
          - --repo
          - "{{ cilium_chart_repo }}"
          - --version
          - "{{ cilium_chart_version }}"
          - --namespace
          - cilium-system
          - --values
          - "{{ cilium_apps_dir }}/{{ 'values-migration.yaml' if cilium_bootstrap_mode == 'migration' else 'values.yaml' }}"
          - --values
          - "{{ cilium_apps_dir }}/values-placement-{{ cilium_install_scope | default('cluster') }}.yaml"
      changed_when: false

    - name: Install pinned Cilium in secondary mode
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - cilium
          - cilium
          - --repo
          - "{{ cilium_chart_repo }}"
          - --version
          - "{{ cilium_chart_version }}"
          - --kube-context
          - "{{ talos_kube_context }}"
          - --namespace
          - cilium-system
          - --values
          - "{{ cilium_apps_dir }}/{{ 'values-migration.yaml' if cilium_bootstrap_mode == 'migration' else 'values.yaml' }}"
          - --values
          - "{{ cilium_apps_dir }}/values-placement-{{ cilium_install_scope | default('cluster') }}.yaml"
          - --wait
          - --timeout
          - 10m
      changed_when: true

    - name: Apply the selector-based per-node migration configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - -f
          - "{{ cilium_apps_dir }}/nodeconfig.yaml"
      changed_when: true
      when: cilium_bootstrap_mode == 'migration'

    - name: Verify Cilium agents are ready in secondary mode
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - cilium-system
          - rollout
          - status
          - daemonset/cilium
          - --timeout=300s
      changed_when: false

    - name: Verify the Cilium operator is ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - cilium-system
          - rollout
          - status
          - deployment/cilium-operator
          - --timeout=300s
      changed_when: false

    - name: Verify Hubble Relay is ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - cilium-system
          - rollout
          - status
          - deployment/hubble-relay
          - --timeout=300s
      changed_when: false

- name: Verify Cilium memory headroom remains on pve-g3-2
  hosts: pve-g3-2
  gather_facts: false
  vars:
    pve_memory_reserve_mib: 2048
  tasks:
    - name: Read pve-g3-2 memory availability after agent rollout
      ansible.builtin.command:
        argv: [cat, /proc/meminfo]
      register: cilium_pve_meminfo_after
      changed_when: false
      when: cilium_install_scope | default('cluster') == 'cluster'

    - name: Require pve-g3-2 to retain the 2 GiB free-memory reserve
      ansible.builtin.assert:
        that:
          - >-
            (((cilium_pve_meminfo_after.stdout_lines | select('match', '^MemAvailable:') | first).split()[1] | int) / 1024)
            >= pve_memory_reserve_mib
        fail_msg: "Cilium must leave pve-g3-2 with at least 2 GiB available memory."
      when: cilium_install_scope | default('cluster') == 'cluster'
