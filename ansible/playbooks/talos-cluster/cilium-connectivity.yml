---
- name: Verify Cilium connectivity on Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    talos_kube_context: ""
    cilium_cli_binary: cilium
    cilium_connectivity_stage: canary
    cilium_connectivity_node: k8s-w-2
    cilium_flow_validation: strict
    cilium_connectivity_timeout: 60m
    cilium_connectivity_junit_file: /tmp/cilium-connectivity-full.junit.xml
    cilium_echo_image: >-
      gcr.io/k8s-staging-gateway-api/echo-advanced:v20251204-v1.4.1@sha256:96c3b75534386ca36c0c76ac8fdbe695f63f35bb3e0632537ffba9732c1f58c9
  tasks:
    - name: Require an explicit cluster and supported verification stage
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0
          - cilium_connectivity_stage in ['canary', 'full', 'cleanup-canary', 'cleanup-full']

    - name: Run the canary connectivity suite with Hubble flow validation
      ansible.builtin.command:
        argv:
          - "{{ cilium_cli_binary }}"
          - --context
          - "{{ talos_kube_context }}"
          - --namespace
          - cilium-system
          - connectivity
          - test
          - --single-node
          - --node-selector
          - "kubernetes.io/hostname={{ cilium_connectivity_node }}"
          - --test-namespace
          - cilium-canary
          - --namespace-labels
          - pod-security.kubernetes.io/enforce=privileged
          - --echo-image
          - "{{ cilium_echo_image }}"
          - --test
          - '^(no-policies.*|health)$,!no-policies/pod-to-service'
          - --flow-validation
          - "{{ cilium_flow_validation }}"
          - --timeout
          - 20m
      when: cilium_connectivity_stage == 'canary'
      changed_when: true

    - name: Verify the Service scenario without the upstream VIP flow matcher
      ansible.builtin.command:
        argv:
          - "{{ cilium_cli_binary }}"
          - --context
          - "{{ talos_kube_context }}"
          - --namespace
          - cilium-system
          - connectivity
          - test
          - --single-node
          - --node-selector
          - "kubernetes.io/hostname={{ cilium_connectivity_node }}"
          - --test-namespace
          - cilium-canary
          - --namespace-labels
          - pod-security.kubernetes.io/enforce=privileged
          - --echo-image
          - "{{ cilium_echo_image }}"
          - --test
          - '^no-policies/pod-to-service$'
          - --flow-validation
          - disabled
          - --timeout
          - 10m
      when: cilium_connectivity_stage == 'canary'
      changed_when: true

    - name: Require translated Service request and reply flows in Hubble
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../../kubernetes/apps/cilium/verify-service-flow.py"
          - --context
          - "{{ talos_kube_context }}"
          - --node
          - "{{ cilium_connectivity_node }}"
      when: cilium_connectivity_stage == 'canary'
      changed_when: false

    - name: Run the full connectivity and policy suite after migration
      ansible.builtin.command:
        argv:
          - "{{ cilium_cli_binary }}"
          - --context
          - "{{ talos_kube_context }}"
          - --namespace
          - cilium-system
          - connectivity
          - test
          - --test-namespace
          - cilium-test
          - --namespace-labels
          - pod-security.kubernetes.io/enforce=privileged
          - --echo-image
          - "{{ cilium_echo_image }}"
          - --flow-validation
          - "{{ cilium_flow_validation }}"
          - --junit-file
          - "{{ cilium_connectivity_junit_file }}"
          - --timeout
          - "{{ cilium_connectivity_timeout }}"
      when: cilium_connectivity_stage == 'full'
      changed_when: true

    - name: Remove only the connectivity suite's diagnostic resources
      ansible.builtin.command:
        argv:
          - "{{ cilium_cli_binary }}"
          - --context
          - "{{ talos_kube_context }}"
          - --namespace
          - cilium-system
          - connectivity
          - test
          - --test-namespace
          - "{{ 'cilium-canary' if cilium_connectivity_stage == 'cleanup-canary' else 'cilium-test' }}"
          - --cleanup
      when: cilium_connectivity_stage in ['cleanup-canary', 'cleanup-full']
      changed_when: true
