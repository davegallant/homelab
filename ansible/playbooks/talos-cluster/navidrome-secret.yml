---
- name: Provision the external Navidrome Secrets from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: ""
  tasks:
    - name: Require the existing Navidrome namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, navidrome]
      changed_when: false

    - name: Require the Navidrome credentials
      ansible.builtin.assert:
        that:
          - pangolin_endpoint | length > 0
          - navidrome_newt_id | length > 0
          - navidrome_newt_secret | length > 0
          - navidrome_lastfm_api_key | length > 0
          - navidrome_lastfm_api_secret | length > 0
      no_log: true

    - name: Apply the Newt Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'navidrome-newt-external', 'namespace': 'navidrome'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': navidrome_newt_id | b64encode,
                       'NEWT_SECRET': navidrome_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply the app Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'navidrome-external', 'namespace': 'navidrome'},
              'type': 'Opaque',
              'data': {'ND_LASTFM_APIKEY': navidrome_lastfm_api_key | b64encode,
                       'ND_LASTFM_SECRET': navidrome_lastfm_api_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true
