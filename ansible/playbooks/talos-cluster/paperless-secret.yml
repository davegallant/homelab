---
- name: Provision the external Paperless-ngx Secrets from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: ""
  tasks:
    - name: Require the existing Paperless-ngx namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, paperless-ngx]
      changed_when: false

    - name: Require the Paperless-ngx credentials
      ansible.builtin.assert:
        that:
          - pangolin_endpoint | length > 0
          - paperless_newt_id | length > 0
          - paperless_newt_secret | length > 0
          - paperless_secret_key | length > 0
          - paperless_admin_user | length > 0
          - paperless_admin_password | length > 0
          - paperless_url | length > 0
      no_log: true

    - name: Apply the Newt Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'paperless-newt-external', 'namespace': 'paperless-ngx'},
              'type': 'Opaque',
              'data': {'PANGOLIN_ENDPOINT': pangolin_endpoint | b64encode,
                       'NEWT_ID': paperless_newt_id | b64encode,
                       'NEWT_SECRET': paperless_newt_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply the app Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'paperless-external', 'namespace': 'paperless-ngx'},
              'type': 'Opaque',
              'data': {'PAPERLESS_SECRET_KEY': paperless_secret_key | b64encode,
                       'PAPERLESS_ADMIN_USER': paperless_admin_user | b64encode,
                       'PAPERLESS_ADMIN_PASSWORD': paperless_admin_password | b64encode,
                       'PAPERLESS_URL': paperless_url | b64encode}} | to_json }}
      changed_when: true
      no_log: true
