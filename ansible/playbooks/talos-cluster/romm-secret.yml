---
- name: Provision the external RomM Secret from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: admin@homelab
  tasks:
    - name: Require the existing RomM namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, romm]
      changed_when: false

    # The assert names are the Vault keys the LXC compose references.
    # If one is wrong the assert fails safe before anything is
    # applied — fix the name here, never print a value to check it.
    - name: Require the RomM credentials
      ansible.builtin.assert:
        that:
          - romm_db_password | length > 0
          - romm_db_root_password | length > 0
          - romm_auth_secret_key | length > 0
          - romm_igdb_client_id | length > 0
          - romm_igdb_client_secret | length > 0
      no_log: true

    - name: Apply the external Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'romm-external', 'namespace': 'romm'},
              'type': 'Opaque',
              'data': {'DB_PASSWD': romm_db_password | b64encode,
                       'MARIADB_PASSWORD': romm_db_password | b64encode,
                       'MARIADB_ROOT_PASSWORD': romm_db_root_password | b64encode,
                       'ROMM_AUTH_SECRET_KEY': romm_auth_secret_key | b64encode,
                       'IGDB_CLIENT_ID': romm_igdb_client_id | b64encode,
                       'IGDB_CLIENT_SECRET': romm_igdb_client_secret | b64encode}} | to_json }}
      changed_when: true
      no_log: true
