---
- name: Resize Talos worker memory
  hosts: pve-g3-1:pve-g3-2
  gather_facts: false
  serial: 1
  vars_files:
    - ../../../kubernetes/cluster/vars.yaml
  tasks:
    - name: Select this host's Talos worker
      ansible.builtin.set_fact:
        talos_worker_vm: >-
          {{ talos_nodes | selectattr('role', 'equalto', 'worker')
          | selectattr('host', 'equalto', inventory_hostname) | first }}

    - name: Read available host memory
      ansible.builtin.command: cat /proc/meminfo
      register: talos_host_meminfo
      changed_when: false

    - name: Read worker VM configuration
      ansible.builtin.command:
        argv:
          - qm
          - config
          - "{{ talos_worker_vm.vmid }}"
      register: talos_worker_config
      changed_when: false

    - name: Confirm the expected worker and current memory size
      ansible.builtin.assert:
        that:
          - "('name: ' ~ talos_worker_vm.name) in talos_worker_config.stdout"
          - >-
            (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
            | first | int) in talos_worker_vm.allowed_memory_mib
        fail_msg: >-
          Refusing to resize an unexpected VM or memory size on
          {{ inventory_hostname }}.

    - name: Require the memory increase plus a 2 GiB host buffer
      ansible.builtin.assert:
        that:
          - >-
            (((talos_host_meminfo.stdout_lines | select('match', '^MemAvailable:') | first).split()[1] | int) / 1024)
            >= (talos_worker_vm.memory_mib -
            (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
            | first | int) + 2048)
        fail_msg: >-
          Insufficient available host RAM on {{ inventory_hostname }} for
          {{ talos_worker_vm.name }} and the 2 GiB host buffer.

    - name: Shut down the worker for a cold memory resize
      ansible.builtin.command:
        argv:
          - qm
          - shutdown
          - "{{ talos_worker_vm.vmid }}"
          - --timeout
          - "120"
      when: >-
        (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
        | first | int) != talos_worker_vm.memory_mib
      changed_when: true

    - name: Wait for the worker VM to stop
      ansible.builtin.command:
        argv:
          - qm
          - status
          - "{{ talos_worker_vm.vmid }}"
      register: talos_worker_status
      until: "'status: stopped' in talos_worker_status.stdout"
      retries: 24
      delay: 5
      when: >-
        (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
        | first | int) != talos_worker_vm.memory_mib
      changed_when: false

    - name: Set the worker memory
      ansible.builtin.command:
        argv:
          - qm
          - set
          - "{{ talos_worker_vm.vmid }}"
          - --memory
          - "{{ talos_worker_vm.memory_mib }}"
      when: >-
        (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
        | first | int) != talos_worker_vm.memory_mib
      changed_when: true

    - name: Start the resized worker
      ansible.builtin.command:
        argv:
          - qm
          - start
          - "{{ talos_worker_vm.vmid }}"
      when: >-
        (talos_worker_config.stdout | regex_findall('(?m)^memory: ([0-9]+)$')
        | first | int) != talos_worker_vm.memory_mib
      changed_when: true

    - name: Wait for the worker VM to run
      ansible.builtin.command:
        argv:
          - qm
          - status
          - "{{ talos_worker_vm.vmid }}"
      register: talos_worker_status
      until: "'status: running' in talos_worker_status.stdout"
      retries: 24
      delay: 5
      changed_when: false
