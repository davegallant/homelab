---
- name: Bootstrap Argo CD on Talos Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../kubernetes/apps/argocd/vars.yaml
    - ../../group_vars/all/vars.yaml
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: admin@homelab
    argocd_apps_dir: "{{ playbook_dir }}/../../../kubernetes/apps/argocd"
  tasks:
    - name: Check that Helm is still the release manager
      ansible.builtin.include_tasks:
        file: ../../tasks/assert-not-argocd-managed.yml
      vars:
        gitops_guard_namespace: argocd
        gitops_guard_name: argocd-server

    - name: Verify the selected cluster is reachable
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, nodes]
      changed_when: false

    - name: Ensure the Argo CD namespace exists
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "-"]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Namespace',
              'metadata': {'name': 'argocd'}} | to_json }}
      changed_when: true

    - name: Apply retained sidecar state PVCs
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "{{ argocd_apps_dir }}/storage.yaml"]
      changed_when: true

    - name: Validate the pinned Argo CD chart
      ansible.builtin.command:
        argv:
          - helm
          - template
          - argocd
          - argo-cd
          - --repo
          - "{{ argocd_chart_repo }}"
          - --version
          - "{{ argocd_chart_version }}"
          - --namespace
          - argocd
          - --values
          - "{{ argocd_apps_dir }}/values.yaml"
          - --values
          - "-"
        stdin: "{{ lookup('ansible.builtin.template', argocd_apps_dir + '/values.ansible.yaml.j2') }}"
      changed_when: false
      no_log: true

    - name: Read the existing server Deployment strategy
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - argocd
          - get
          - deployment
          - argocd-server
          - --ignore-not-found=true
          - -o
          - jsonpath={.spec.strategy.type}
      register: argocd_server_strategy
      changed_when: false

    - name: Clear rolling update fields before adopting the Recreate strategy
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - argocd
          - patch
          - deployment
          - argocd-server
          - --type=merge
          - -p
          - '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
      when: argocd_server_strategy.stdout | trim == 'RollingUpdate'
      changed_when: true

    - name: Install the pinned Argo CD chart
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - argocd
          - argo-cd
          - --repo
          - "{{ argocd_chart_repo }}"
          - --version
          - "{{ argocd_chart_version }}"
          - --kube-context
          - "{{ talos_kube_context }}"
          - --namespace
          - argocd
          - --create-namespace
          - --values
          - "{{ argocd_apps_dir }}/values.yaml"
          - --values
          - "-"
          - --wait
          - --timeout
          - 5m
        stdin: "{{ lookup('ansible.builtin.template', argocd_apps_dir + '/values.ansible.yaml.j2') }}"
      changed_when: true
      no_log: true

    - name: Apply the restricted monitoring and backup projects
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "{{ argocd_apps_dir }}/{{ item }}"]
      loop:
        - project-monitoring.yaml
        - project-velero-backup.yaml
      register: argocd_restricted_projects_apply
      changed_when: >-
        'created' in argocd_restricted_projects_apply.stdout or
        'configured' in argocd_restricted_projects_apply.stdout

    - name: Apply the restricted homelab project
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", apply, -f, "{{ argocd_apps_dir }}/project.yaml"]
      register: argocd_project_apply
      changed_when: "'created' in argocd_project_apply.stdout or 'configured' in argocd_project_apply.stdout"

    - name: Report bootstrap access
      ansible.builtin.debug:
        msg: >-
          Argo CD is ready at https://argocd.{{ headscale_magic_dns_domain }}.
          Retrieve the initial admin password privately from
          secret/argocd-initial-admin-secret. Register BentoPDF only after
          its chart and production values are available on remote main.
