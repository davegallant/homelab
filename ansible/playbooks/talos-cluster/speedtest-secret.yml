---
- name: Provision the external Speedtest Tracker Secrets from Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../group_vars/all/secrets.yaml
  vars:
    talos_kube_context: admin@homelab
  tasks:
    - name: Require the existing Speedtest Tracker namespace
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", get, namespace, speedtest-tracker]
      changed_when: false

    - name: Require the Speedtest Tracker credentials
      ansible.builtin.assert:
        that:
          - speedtest_tracker_db_username | length > 0
          - speedtest_tracker_db_password | length > 0
          - speedtest_tracker_app_key | length > 0
      no_log: true

    - name: Apply the app Secret without writing credentials to disk
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - --server-side
          - --field-manager=ansible-vault
          - -f
          - "-"
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'speedtest-tracker-external', 'namespace': 'speedtest-tracker'},
              'type': 'Opaque',
              'data': {'DB_USERNAME': speedtest_tracker_db_username | b64encode,
                       'DB_PASSWORD': speedtest_tracker_db_password | b64encode,
                       'APP_KEY': speedtest_tracker_app_key | b64encode,
                       'POSTGRES_USER': speedtest_tracker_db_username | b64encode,
                       'POSTGRES_PASSWORD': speedtest_tracker_db_password | b64encode}} | to_json }}
      changed_when: true
      no_log: true
