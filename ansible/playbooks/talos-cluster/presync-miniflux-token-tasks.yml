- name: Apply the scoped Miniflux pre-sync Argo credential
  ansible.builtin.command:
    argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "-"]
    stdin: >-
      {{ {'apiVersion': 'v1', 'kind': 'Secret',
          'metadata': {'name': 'presync-miniflux-argocd', 'namespace': 'miniflux'},
          'type': 'Opaque',
          'data': {'token': presync_miniflux_argocd_token | b64encode}} | to_json }}
  changed_when: true
  no_log: true
