---
- name: Apply the repository homelab AppProjects
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    talos_kube_context: ""
  tasks:
    - name: Require an explicit cluster context
      ansible.builtin.assert:
        that:
          - talos_kube_context | length > 0

    - name: Apply the restricted monitoring and backup projects
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - -f
          - "{{ playbook_dir }}/../../../kubernetes/apps/argocd/{{ item }}"
      loop:
        - project-monitoring.yaml
        - project-velero-backup.yaml
      register: argocd_restricted_projects_apply
      changed_when: >-
        'created' in argocd_restricted_projects_apply.stdout or
        'configured' in argocd_restricted_projects_apply.stdout

    - name: Read the VictoriaMetrics Application project
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", -n, argocd, get, application, victoriametrics, -o, json]
      register: argocd_victoriametrics_application
      changed_when: false

    - name: Read the Forgejo backup Application project
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", -n, argocd, get, application, forgejo-backup, -o, json]
      register: argocd_forgejo_backup_application
      changed_when: false

    - name: Read the Velero schedules Application project
      ansible.builtin.command:
        argv: [kubectl, --context, "{{ talos_kube_context }}", -n, argocd, get, application, velero-schedules, -o, json]
      register: argocd_velero_schedules_application
      changed_when: false

    - name: Require privileged-namespace Applications to use their restricted projects
      ansible.builtin.assert:
        that:
          - (argocd_victoriametrics_application.stdout | from_json).spec.project == 'homelab-monitoring'
          - (argocd_forgejo_backup_application.stdout | from_json).spec.project == 'homelab-velero-backup'
          - (argocd_velero_schedules_application.stdout | from_json).spec.project == 'homelab-velero-backup'
        fail_msg: >-
          Sync the argocd Application definitions from Git first. The
          homelab project still allows monitoring and velero until all
          privileged-namespace Applications use their restricted projects.

    - name: Apply the narrowed homelab project after its Applications move
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - apply
          - -f
          - "{{ playbook_dir }}/../../../kubernetes/apps/argocd/project.yaml"
      register: argocd_project_apply
      changed_when: "'created' in argocd_project_apply.stdout or 'configured' in argocd_project_apply.stdout"

    - name: Verify the CiliumNetworkPolicy resource is permitted
      ansible.builtin.command:
        argv:
          - kubectl
          - --context
          - "{{ talos_kube_context }}"
          - -n
          - argocd
          - get
          - appproject
          - homelab
          - -o
          - yaml
      register: argocd_policy_permission
      changed_when: false
      failed_when: >-
        'group: cilium.io' not in argocd_policy_permission.stdout or
        'kind: CiliumNetworkPolicy' not in argocd_policy_permission.stdout
