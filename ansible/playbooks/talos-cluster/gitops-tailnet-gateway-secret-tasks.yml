# Prepared include for the gitops-secrets flow. DO NOT RUN in Gate 0b.
# Select with --tags tailnet-gateway-tls and explicit opt-in, not full play.
- name: Provision the tailnet Gateway wildcard certificate
  when: tailnet_gateway_provision_tls | default(false) | bool
  tags:
    - never
    - tailnet-gateway-tls
  block:
    - name: Verify the intended Kubernetes API server
      ansible.builtin.command:
        argv: [kubectl, config, view, --minify, -o, "jsonpath={.clusters[0].cluster.server}"]
      register: tailnet_gateway_api
      changed_when: false

    - name: Read the intended Kubernetes nodes
      ansible.builtin.command:
        argv: [kubectl, get, nodes, -o, json]
      register: tailnet_gateway_nodes
      changed_when: false

    - name: Require the intended cluster
      ansible.builtin.assert:
        that:
          - tailnet_gateway_api.stdout == 'https://192.168.1.210:6443'
          - >-
            (tailnet_gateway_nodes.stdout | from_json)['items']
            | map(attribute='metadata.name') | sort | list
            == ['k8s-cp-1', 'k8s-w-1', 'k8s-w-2']

    - name: Require Vault certificate material
      ansible.builtin.assert:
        that:
          - tailnet_gateway_production_tls_crt is defined
          - tailnet_gateway_production_tls_key is defined
          - tailnet_gateway_production_tls_crt | length > 0
          - tailnet_gateway_production_tls_key | length > 0
      no_log: true

    - name: Render and apply the protected wildcard Secret
      no_log: true
      block:
        - name: Allocate a protected manifest file
          ansible.builtin.tempfile:
            state: file
            prefix: tailnet-gateway-tls-
          register: tailnet_gateway_tls_temp

        - name: Write the wildcard Secret manifest
          ansible.builtin.copy:
            dest: "{{ tailnet_gateway_tls_temp.path }}"
            mode: "0600"
            content: >-
              {{ {'apiVersion': 'v1', 'kind': 'Secret',
                  'metadata': {'name': 'tailnet-gateway-wildcard', 'namespace': 'tailnet-gateway'},
                  'type': 'kubernetes.io/tls',
                  'data': {'tls.crt': tailnet_gateway_production_tls_crt | b64encode,
                           'tls.key': tailnet_gateway_production_tls_key | b64encode}} | to_json }}

        - name: Apply the wildcard Secret outside Argo ownership
          ansible.builtin.command:
            argv: [kubectl, apply, --server-side, --field-manager=ansible-vault, -f, "{{ tailnet_gateway_tls_temp.path }}"]
          changed_when: true
      always:
        - name: Remove the protected manifest file
          ansible.builtin.file:
            path: "{{ tailnet_gateway_tls_temp.path }}"
            state: absent
          when: tailnet_gateway_tls_temp is defined and tailnet_gateway_tls_temp.path is defined
          no_log: true
