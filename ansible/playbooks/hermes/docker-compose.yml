services:
  hermes:
    # No published image exists upstream: the playbook builds this locally
    # from the pinned git tag (hermes_version in group_vars/all/vars.yaml).
    image: hermes-agent:{{ hermes_version }}
    container_name: hermes
    restart: always
    command: ["hermes", "gateway", "run"]
    # Host networking: Hermes shares the LXC's network stack, so it reaches
    # the tailnet directly via the host's tailscale interface (the container
    # has no tailscale client of its own). No ports: section -- it is ignored
    # in host mode. The dashboard binds 0.0.0.0:9119 on the host;
    # UFW (deny by default) keeps it off the LAN; Caddy proxies to it over
    # the tailnet via 127.0.0.1.
    network_mode: host
    volumes:
      # Persists config, sessions, skills and learned memory across restarts.
      # /opt/data is the hermes user's home in the image (per upstream docs).
      - /root/.hermes:/opt/data
    environment:
      # The dashboard ships as a supervised s6 service but stays down unless
      # this is set (per upstream docs/user-guide/docker.md).
      - HERMES_DASHBOARD=1
      # Dashboard auth is mandatory on the default 0.0.0.0 bind since the June
      # 2026 hardening: with no provider registered it fails closed at
      # startup. Basic auth is the zero-infra fit for a tailnet-only box.
      # Add all three to the vault: cd ansible && just edit-secrets
      # (generate the secret with: openssl rand -hex 32)
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME={{ hermes_dashboard_username }}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD={{ hermes_dashboard_password }}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET={{ hermes_dashboard_secret }}
      # Provider keys are optional; empty values are ignored by Hermes.
      # OAuth providers (ChatGPT/Codex subscription, Claude Max) are linked
      # interactively instead: docker exec -it hermes hermes model
      - OPENROUTER_API_KEY={{ hermes_openrouter_api_key | default('') }}
      # Signal platform: talks to the signal-cli sidecar. Host networking
      # means no Docker DNS, so this goes via localhost -- signal-cli
      # publishes 127.0.0.1:8080 for exactly this. The sidecar links to your
      # Signal account as a secondary device; allowed users gate who can
      # talk to it.
      # Add hermes_signal_account to the vault (E.164, e.g. "+15195551234"
      # -- no spaces or hyphens): cd ansible && just edit-secrets
      - SIGNAL_HTTP_URL=http://127.0.0.1:8080
      - SIGNAL_ACCOUNT={{ hermes_signal_account }}
      - SIGNAL_ALLOWED_USERS={{ hermes_signal_account }}
    security_opt:
      - no-new-privileges:true

  signal-cli:
    # Sidecar for Hermes' Signal platform: the native signal-cli JSON-RPC/SSE
    # daemon Hermes talks to (GraalVM build, no JRE). Version pinned via
    # signal_cli_version; the playbook builds this locally like hermes-agent.
    image: signal-cli:{{ signal_cli_version }}
    container_name: signal-cli
    restart: always
    ports:
      # Localhost-only: Hermes runs with host networking (no Docker DNS),
      # so it reaches the daemon via 127.0.0.1:8080. Bound to loopback so
      # the no-auth HTTP API never touches the LAN or tailnet.
      - "127.0.0.1:8080:8080"
    environment:
      # Your Signal number (E.164) from the vault. The entrypoint idles until
      # this account is linked (one-time manual step, see its log message).
      # NOTE: no quotes here -- compose's list format keeps them literally,
      # which would break the E.164 match in entrypoint.sh.
      - SIGNAL_CLI_ACCOUNT={{ hermes_signal_account }}
    volumes:
      # Persists the link state from the one-time `signal-cli link` step.
      # Daemon binds 0.0.0.0:8080 inside the container; only 127.0.0.1:8080
      # is published (see ports above).
      - /root/signal-cli-data:/data
    security_opt:
      - no-new-privileges:true
