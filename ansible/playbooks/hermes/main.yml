---
- name: Install hermes
  hosts: hermes
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Install git for the source checkout
      ansible.builtin.apt:
        name: git
        state: present

    - name: Clone hermes-agent at pinned version
      ansible.builtin.git:
        repo: https://github.com/NousResearch/hermes-agent.git
        dest: ~/hermes-agent
        version: "{{ hermes_version }}"
        depth: 1
      register: hermes_clone

    - name: Check whether the hermes-agent image already exists
      ansible.builtin.command:
        cmd: docker image inspect hermes-agent:{{ hermes_version }}
      register: hermes_image_inspect
      changed_when: false
      failed_when: false

    - name: Build hermes-agent container image
      # community.docker.docker_image uses the classic builder API, which
      # cannot parse the Dockerfile's COPY --chmod flags ("the --chmod option
      # requires BuildKit"). docker-buildx-plugin is installed by
      # install-docker.yml, so build with BuildKit directly instead.
      ansible.builtin.command:
        cmd: docker buildx build --load --progress=plain -t hermes-agent:{{ hermes_version }} {{ ansible_env.HOME }}/hermes-agent
      async: 3600
      poll: 60
      changed_when: true
      when: hermes_clone is changed or hermes_image_inspect.rc != 0

    - name: Copy signal-cli build context
      ansible.builtin.copy:
        src: docker/signal-cli/
        dest: ~/signal-cli/
        mode: "0644"
      register: signal_cli_context

    - name: Check whether the signal-cli image already exists
      ansible.builtin.command:
        cmd: docker image inspect signal-cli:{{ signal_cli_version }}
      register: signal_cli_image_inspect
      changed_when: false
      failed_when: false

    - name: Build signal-cli container image
      ansible.builtin.command:
        cmd: >-
          docker buildx build --load --progress=plain
          --build-arg SIGNAL_CLI_VERSION={{ signal_cli_version }}
          -t signal-cli:{{ signal_cli_version }}
          {{ ansible_env.HOME }}/signal-cli
      async: 600
      poll: 30
      changed_when: true
      when: signal_cli_context is changed or signal_cli_image_inspect.rc != 0

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Ensure Signal platform config in Hermes .env
      # The gateway reads platform credentials from its own .env (scoped
      # secrets), not container environment: without these lines the Signal
      # adapter never loads (verified 2026-10-08).
      ansible.builtin.lineinfile:
        path: /root/.hermes/.env
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: "SIGNAL_HTTP_URL", value: "http://127.0.0.1:8080" }
        - { key: "SIGNAL_ACCOUNT", value: "{{ hermes_signal_account }}" }
        - { key: "SIGNAL_ALLOWED_USERS", value: "{{ hermes_signal_account }}" }
      notify: Restart Hermes gateway

    - name: Serve HTTPS over the tailnet
      ansible.builtin.include_role:
        name: tailnet_caddy
        apply:
          tags: ["tailnet_caddy"]
      vars:
        tailnet_caddy_upstream: "http://127.0.0.1:9119"
      tags: ["tailnet_caddy"]

  handlers:
    - name: Restart Hermes gateway
      ansible.builtin.command:
        cmd: docker restart hermes
      changed_when: true
