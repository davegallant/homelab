---
- name: Install gatus
  hosts: gatus
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Get the Gatus tailnet address
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: gatus_tailscale_ip
      check_mode: false
      changed_when: false

    - name: Validate the secondary DNS address
      ansible.builtin.assert:
        that:
          - gatus_tailscale_ip.stdout | trim == headscale_secondary_dns_ip
        fail_msg: "Gatus must retain {{ headscale_secondary_dns_ip }} before Headscale advertises it as a DNS resolver."

    - name: Create gatus config directory
      ansible.builtin.file:
        path: "~/config"
        state: directory
        mode: "0750"
        owner: "999"
        group: "999"

    - name: Create secondary AdGuard directories
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/adguard-secondary/{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - conf
        - work

    - name: Check whether secondary AdGuard has a live config
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/adguard-secondary/conf/AdGuardHome.yaml"
      register: adguard_secondary_live_config

    - name: Render desired secondary AdGuard config
      ansible.builtin.template:
        src: adguard-secondary.yaml.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/adguard-secondary/desired.yaml"
        mode: "0640"
      register: adguard_secondary_desired_config

    - name: Check whether secondary AdGuard container exists
      community.docker.docker_container_info:
        name: adguard-secondary
      register: adguard_secondary_container

    - name: Stop secondary AdGuard before config changes # noqa: no-handler
      community.docker.docker_container:
        name: adguard-secondary
        state: stopped
      when:
        - adguard_secondary_container.exists
        - adguard_secondary_desired_config.changed or not adguard_secondary_live_config.stat.exists

    - name: Copy secondary AdGuard config
      ansible.builtin.copy:
        src: "{{ ansible_facts['env']['HOME'] }}/adguard-secondary/desired.yaml"
        dest: "{{ ansible_facts['env']['HOME'] }}/adguard-secondary/conf/AdGuardHome.yaml"
        remote_src: true
        mode: "0640"
      when: adguard_secondary_desired_config.changed or not adguard_secondary_live_config.stat.exists

    - name: Create gatus data directory
      ansible.builtin.file:
        path: "~/data"
        state: directory
        mode: "0750"
        owner: "999"
        group: "999"

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Copy config.yaml
      ansible.builtin.template:
        src: config/config.yaml
        dest: "~/config/config.yaml"
        mode: "0640"
        owner: "999"
        group: "999"
      register: gatus_config

    - name: Allow secondary DNS from the tailnet
      community.general.ufw:
        rule: allow
        port: "53"
        proto: "{{ item }}"
        from_ip: "100.64.0.0/10"
      loop:
        - tcp
        - udp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Restart Gatus when its config changes
      community.docker.docker_container:
        name: gatus
        state: started
        restart: true
      when: gatus_config.changed

    - name: Serve HTTPS over the tailnet
      ansible.builtin.include_role:
        name: tailnet_caddy
        apply:
          tags: ["tailnet_caddy"]
      vars:
        tailnet_caddy_upstream: "http://127.0.0.1:8080"
      tags: ["tailnet_caddy"]
