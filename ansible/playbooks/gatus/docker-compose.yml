services:
  adguard-secondary:
    image: docker.io/adguard/adguardhome:v0.107.80@sha256:8224eeda45e5c0efe014376f239f67b26e4b73bbb19576da6e576e398f1ea763
    container_name: adguard-secondary
    network_mode: host
    restart: always
    volumes:
      - ./adguard-secondary/work:/opt/adguardhome/work
      - ./adguard-secondary/conf:/opt/adguardhome/conf

  gatus:
    image: docker.io/twinproduction/gatus:v5.38.0@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    user: "999:999"
    network_mode: host
    volumes:
      - ./config:/config
      - ./data:/data
    restart: always
