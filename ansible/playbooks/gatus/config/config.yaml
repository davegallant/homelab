storage:
  type: sqlite
  path: /data/data.db

web:
  address: 127.0.0.1
  port: 8080

alerting:
  gotify:
    server-url: "{{ gotify_server_url }}"
    token: "{{ gatus_gotify_token }}"
    default-alert:
      description: "Health Check Failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h

endpoint-defaults: &defaults
  interval: 30s
  client:
    timeout: 10s
  conditions:
    - "[STATUS] == 200"
    - "[RESPONSE_TIME] < 5000"
  alerts:
    - type: gotify

endpoints:
  - name: changedetection
    url: "{{ changedetection_url }}"
    <<: *defaults

  - name: homepage
    url: "{{ homepage_url }}"
    <<: *defaults

  - name: tailnet-gateway
    url: "{{ homepage_url }}"
    <<: *defaults

  - name: kiwix
    url: "https://kiwix.{{ headscale_magic_dns_domain }}/"
    <<: *defaults

  - name: immich
    url: "{{ immich_url }}"
    <<: *defaults

