---
- name: Install qbittorrent
  hosts: qbittorrent
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Create 'qBittorrent' directory
      ansible.builtin.file:
        path: "~/qBittorrent"
        state: directory
        mode: "0755"

    - name: Create 'scripts' directory
      ansible.builtin.file:
        path: "~/scripts"
        state: directory
        mode: "0755"

    - name: Copy block-malware.sh
      ansible.builtin.copy:
        src: scripts/block-malware.sh
        dest: "~/scripts/block-malware.sh"
        mode: "0750"

    - name: Check whether qbittorrent.conf would change
      ansible.builtin.template:
        src: ./qbittorrent.conf
        dest: "~/qBittorrent/qBittorrent.conf"
        mode: "0640"
      check_mode: true
      register: qbittorrent_conf_check

    - name: Stop qbittorrent container before config change # noqa: no-handler
      community.docker.docker_container:
        name: qbittorrent
        state: stopped
      when: qbittorrent_conf_check is changed

    - name: Copy qbittorrent.conf
      ansible.builtin.template:
        src: ./qbittorrent.conf
        dest: "~/qBittorrent/qBittorrent.conf"
        mode: "0640"

    - name: Ensure git is installed
      ansible.builtin.apt:
        name: git
        state: present

    - name: Mark dracula directory as safe for git # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git config --global --add safe.directory {{ ansible_user_dir }}/qBittorrent/dracula
      changed_when: false

    - name: Clone Dracula WebUI theme
      ansible.builtin.git:
        repo: https://github.com/dracula/qbittorrent.git
        dest: "~/qBittorrent/dracula"
        version: 9020f6eb457087270179beb86d45914d434adb6b
        force: true

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml
