---
- name: Install speedtest-tracker
  hosts: speedtest-tracker
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Allow HTTPS from the tailnet
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ufw_docker_allowed_sources }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Serve HTTPS over the tailnet
      ansible.builtin.include_role:
        name: tailnet_caddy
      vars:
        tailnet_caddy_upstream: "http://127.0.0.1:8080"
