---
- name: Install pangolin
  hosts: pangolin
  vars:
    # Reuse the project name of the manually-deployed stack on the VPS.
    docker_compose_project_name: pangolin
    # Values verified against the VPS's live ~/config (2026-10-03). If the live
    # config changes, update these to match before running.
    #
    # pangolin_dashboard_domain lives in group_vars/all/vars.yaml (shared with
    # the Gatus endpoint). pangolin_server_secret lives in the vault and MUST
    # match the live value or existing sessions/tokens break.
    pangolin_base_domain: "davegallant.ca"
    pangolin_letsencrypt_email: "davegallant@proton.me"
    # Plain SSH via ~/.ssh/config (no Tailscale on this host). Explicit: the
    # other playbooks rely on Tailscale SSH and never set this.
    ansible_user: root
    # Edge reverse proxy: these published container ports must be reachable
    # from the public internet. Everything else published stays tailnet-only
    # (ufw_docker_allowed_sources). See ufw_docker_public_ports in
    # tasks/install-docker.yml.
    ufw_docker_public_ports:
      - port: "80"
        proto: tcp
      - port: "443"
        proto: tcp
      - port: "51820"
        proto: udp
      - port: "21820"
        proto: udp
      - port: "19132"
        proto: udp
    # Enforce role and monitoring tags by hostname after nodes enroll.
    headscale_node_tags:
      audiobookshelf: [tag:monitored, tag:pangolin]
      bento-pdf: [tag:monitored, tag:pangolin]
      beszel: [tag:beszel, tag:monitored]
      dispatcharr: [tag:monitored, tag:pangolin]
      forgejo: [tag:monitored, tag:pangolin]
      gotify: [tag:monitored, tag:pangolin]
      grafana: [tag:loki, tag:monitored]
      igotify: [tag:monitored, tag:pangolin]
      invidious: [tag:monitored, tag:pangolin]
      jellyfin: [tag:monitored, tag:pangolin]
      maloja: [tag:maloja, tag:monitored]
      mcleod: [tag:external, tag:beszel-agent]
      miniflux: [tag:monitored, tag:pangolin]
      muse: [tag:external]
      navidrome: [tag:monitored, tag:navidrome, tag:pangolin]
      paperless-ngx: [tag:monitored, tag:pangolin]
      searxng: [tag:monitored, tag:pangolin]
      umami: [tag:monitored, tag:pangolin]
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    # No install-alloy.yml / install-beszel-agent.yml: this host is not on the
    # tailnet, so it cannot reach Loki or the Beszel hub. It is monitored via
    # the Gatus pangolin endpoint instead.

    - name: Create pangolin config directories
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - config
        - config/db
        - config/letsencrypt
        - config/headscale
        - config/headscale/data
        - config/traefik
        - config/traefik/logs

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Copy pangolin config.yml
      ansible.builtin.template:
        src: config.yml.j2
        dest: "~/config/config.yml"
        mode: "0640"
    # State Ansible never touches, all under ~/config:
    # db/db.sqlite (all sites/resources), key (Gerbil), letsencrypt/acme.json.

    - name: Copy Headscale config
      ansible.builtin.template:
        src: headscale_config.yaml.j2
        dest: "~/config/headscale/config.yaml"
        mode: "0640"
      register: headscale_config

    - name: Copy Headscale policy
      ansible.builtin.copy:
        src: policy.headscale.hujson
        dest: "~/config/headscale/policy.hujson"
        mode: "0640"

    - name: Copy traefik static config
      ansible.builtin.template:
        src: traefik_config.yml.j2
        dest: "~/config/traefik/traefik_config.yml"
        mode: "0640"

    - name: Copy traefik dynamic config
      ansible.builtin.template:
        src: dynamic_config.yml.j2
        dest: "~/config/traefik/dynamic_config.yml"
        mode: "0640"

    - name: Allow SSH before enabling the firewall
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
    # This host is reached over plain SSH (no Tailscale), so 22 is the only
    # way in. It must be open BEFORE the deny policy loads. Do not move this
    # below "Enable UFW".

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Restart Headscale after configuration changes # noqa: no-handler
      community.docker.docker_container:
        name: headscale
        state: started
        restart: true
      when: headscale_config.changed

    - name: Read Headscale nodes
      ansible.builtin.command:
        cmd: docker exec headscale headscale nodes list -o json
      register: headscale_nodes
      changed_when: false

    - name: Assign Headscale node tags
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - headscale
          - headscale
          - nodes
          - tag
          - -i
          - "{{ headscale_node.id }}"
          - -t
          - "{{ item.value | join(',') }}"
      vars:
        headscale_node: "{{ (headscale_nodes.stdout | from_json | selectattr('name', 'equalto', item.key) | list | first) | default({}) }}"
      loop: "{{ headscale_node_tags | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      changed_when: true
      when:
        - headscale_node | length > 0
        - headscale_node.tags | default([]) | sort != item.value | sort

    - name: Validate Headscale policy
      ansible.builtin.command:
        cmd: docker exec headscale headscale policy check --file /etc/headscale/policy.hujson
      changed_when: false

    - name: Read active Headscale policy
      ansible.builtin.command:
        cmd: docker exec headscale headscale policy get
      register: headscale_active_policy
      changed_when: false
      failed_when: false

    - name: Apply Headscale policy when the database differs
      ansible.builtin.command:
        cmd: docker exec headscale headscale policy set -f /etc/headscale/policy.hujson
      changed_when: true
      when: >-
        headscale_active_policy.rc != 0 or
        headscale_active_policy.stdout | trim != lookup('ansible.builtin.file', playbook_dir + '/policy.headscale.hujson') | trim

    - name: Set up automated VPS state backups
      ansible.builtin.include_role:
        name: vps_backup
