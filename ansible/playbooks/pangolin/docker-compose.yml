# Upstream reference: https://docs.pangolin.net/self-host/manual/docker-compose
#
# State that Ansible never touches (all under ./config, i.e. ~/config on the host):
#   db/db.sqlite        - Pangolin's database: all sites, resources, users. Do not delete.
#   key                 - Gerbil's WireGuard key, generated on first run.
#   letsencrypt/acme.json - Traefik's certificates, renewed in place.
# Seed those by keeping the existing VPS deployment; Ansible only manages the
# files templated by main.yml.

name: pangolin

services:
  headscale:
    image: docker.io/headscale/headscale:0.29.4@sha256:8833f828b414c0907b7e5c71da76473216fe17cce0818a166b536ec552c0903f
    container_name: headscale
    restart: always
    read_only: true
    tmpfs:
      - /var/run/headscale
    command: serve
    volumes:
      - ./config/headscale:/etc/headscale:ro
      - ./config/headscale/data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 10s
      retries: 15

  pangolin:
    # https://github.com/fosrl/pangolin/releases
    image: docker.io/fosrl/pangolin:1.24.0@sha256:17774ddbb4bf13f4a2b9e813cc2dfc3ca8ded1c5745823624af632bab0376488
    container_name: pangolin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 10s
      timeout: 10s
      retries: 15

  gerbil:
    # https://github.com/fosrl/gerbil/releases
    image: docker.io/fosrl/gerbil:1.5.2@sha256:1f6e64eaba7997282c7067ba19922fc7e46b5f73e1a27add3dd66a591d50512f
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 19132:19132/udp

  traefik:
    image: docker.io/traefik:v3.7@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik

networks:
  default:
    driver: bridge
    name: pangolin
    enable_ipv6: true
