---
- name: Install adguard-home
  hosts: adguard-home
  tasks:
    - ansible.builtin.include_tasks:
        file: ../../tasks/install-docker.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-common-packages.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-alloy.yml

    - ansible.builtin.include_tasks:
        file: ../../tasks/install-beszel-agent.yml

    - name: Copy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml
        dest: "~/docker-compose.yml"
        mode: "0640"

    - name: Remove unrestricted AdGuard firewall rules
      community.general.ufw:
        rule: allow
        delete: true
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "53", proto: tcp }
        - { port: "53", proto: udp }
        - { port: "80", proto: tcp }
        - { port: "3000", proto: tcp }
        - { port: "443", proto: tcp }
        - { port: "443", proto: udp }
        - { port: "853", proto: tcp }
        - { port: "853", proto: udp }

    - name: Allow AdGuard DNS from the LAN and tailnet
      community.general.ufw:
        rule: allow
        port: "{{ item.0.port }}"
        proto: "{{ item.0.proto }}"
        from_ip: "{{ item.1 }}"
      loop: "{{ query('nested', adguard_dns_ports, [homelab_lan_subnet, '100.64.0.0/10']) }}"
      vars:
        adguard_dns_ports:
          - { port: "53", proto: tcp }
          - { port: "53", proto: udp }
          - { port: "443", proto: tcp }
          - { port: "443", proto: udp }
          - { port: "853", proto: tcp }
          - { port: "853", proto: udp }

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny

    - ansible.builtin.include_tasks:
        file: ../../tasks/docker-compose-up.yml

    - name: Serve HTTPS over the tailnet
      ansible.builtin.include_role:
        name: tailnet_caddy
        apply:
          tags: ["tailnet_caddy"]
      vars:
        tailnet_caddy_upstream: "http://127.0.0.1:80"
      tags: ["tailnet_caddy"]
