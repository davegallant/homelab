# Read the Headscale nodes that may use the lan-gateway tailnet node: untagged
# (user-owned) devices, which the ACL lets reach every node. Tagged servers
# (Gatus, LXC hosts, tag:external) keep the public answer: Gatus monitors the
# Pangolin path on purpose, and their ACLs do not allow the lan-gateway node.
# A device registered after this runs falls back to Pangolin until the
# adguard-home and gatus playbooks run again.
- name: Read Headscale nodes for LAN gateway DNS
  ansible.builtin.command:
    argv: [docker, exec, headscale, headscale, nodes, list, -o, json]
  delegate_to: vps
  vars:
    ansible_user: root
  register: lan_gateway_headscale_nodes
  changed_when: false
  check_mode: false

- name: Select untagged tailnet clients for LAN gateway DNS
  ansible.builtin.set_fact:
    lan_gateway_tailnet_clients: >-
      {%- set out = [] -%}
      {%- for n in lan_gateway_headscale_nodes.stdout | from_json -%}
      {%- if not (n.tags | default([])) -%}{%- set _ = out.append(n.ip_addresses | first) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | sort }}

- name: Require tailnet clients for LAN gateway DNS
  ansible.builtin.assert:
    that:
      - lan_gateway_tailnet_clients | length > 0
      - lan_gateway_tailnet_clients | select('match', '^100\.') | list | length == lan_gateway_tailnet_clients | length
