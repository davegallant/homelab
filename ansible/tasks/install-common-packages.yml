- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - neovim
      - locales
      - ripgrep
      - ufw
      - unattended-upgrades
    state: present

- name: Ensure en_CA.UTF-8 locale is generated
  community.general.locale_gen:
    name: en_CA.UTF-8
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Remove rsyslog (journald handles logging)
  ansible.builtin.apt:
    name: rsyslog
    state: absent
    purge: true

- name: Ensure journald configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit persistent journal disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-homelab-retention.conf
    content: |
      [Journal]
      SystemMaxUse=200M
    mode: "0644"
  register: journald_retention

- name: Restart journald to apply retention policy # noqa: no-handler
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: journald_retention is changed

- name: Vacuum existing journals # noqa: no-changed-when no-handler
  ansible.builtin.command:
    cmd: journalctl --vacuum-size=200M
  when: journald_retention is changed

- name: Clean APT package cache
  ansible.builtin.apt:
    clean: true
