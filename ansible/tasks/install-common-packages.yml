- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - neovim
      - ripgrep
      - ufw
      - unattended-upgrades
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Disable MOTD help text to suppress Ubuntu MOTD links
  ansible.builtin.file:
    path: /etc/update-motd.d/10-help-text
    mode: "0644"
    state: file
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove APT Ubuntu Pro/ESM nag (empty 20apt-esm-hook.conf)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20apt-esm-hook.conf
    content: ""
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'

- name: Remove rsyslog (journald handles logging)
  ansible.builtin.apt:
    name: rsyslog
    state: absent
    purge: true

- name: Ensure journald configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit persistent journal disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-homelab-retention.conf
    content: |
      [Journal]
      SystemMaxUse=200M
    mode: "0644"
  register: journald_retention

- name: Restart journald to apply retention policy # noqa: no-handler
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: journald_retention is changed

- name: Vacuum existing journals # noqa: no-changed-when no-handler
  ansible.builtin.command:
    cmd: journalctl --vacuum-size=200M
  when: journald_retention is changed

- name: Clean APT package cache
  ansible.builtin.apt:
    clean: true
