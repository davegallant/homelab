- name: Install gpg and python3-debian
  ansible.builtin.apt:
    name:
      - gpg
      - python3-debian
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install alloy
  ansible.builtin.apt:
    name:
      - alloy
    state: present
    update_cache: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  when: alloy_docker_discovery | default(true)

- name: Add alloy user to docker group
  ansible.builtin.user:
    name: alloy
    groups: docker
    append: true
  when: alloy_docker_discovery | default(true)

- name: Create /etc/alloy directory
  ansible.builtin.file:
    path: /etc/alloy
    state: directory
    mode: "0755"

- name: Deploy Alloy configuration file
  ansible.builtin.template:
    # Hosts without Docker (e.g. cinema) set alloy_docker_discovery: false
    # to ship journal logs only.
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: "0644"
    backup: true

- name: Disable Alloy reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: "^CUSTOM_ARGS="
    line: "CUSTOM_ARGS=--disable-reporting"
    create: true
    mode: "0644"

- name: Enable and start alloy
  ansible.builtin.systemd:
    name: alloy
    daemon_reload: true
    enabled: true
    state: restarted
