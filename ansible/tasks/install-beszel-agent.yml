- name: Download beszel-agent package
  ansible.builtin.get_url:
    # beszel_version is defined in group_vars/all/vars.yaml. Renovate groups
    # updates with the Kubernetes hub image in kubernetes/apps/beszel/values.production.yaml.
    url: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_version }}/beszel-agent_{{ beszel_version }}_linux_amd64.deb"
    checksum: "sha256:https://github.com/henrygd/beszel/releases/download/v{{ beszel_version }}/beszel_{{ beszel_version }}_checksums.txt"
    dest: /tmp/beszel-agent.deb
    mode: "0644"

- name: Install beszel-agent package
  ansible.builtin.apt:
    deb: /tmp/beszel-agent.deb
  when: not ansible_check_mode

- name: Remove downloaded beszel-agent package
  ansible.builtin.file:
    path: /tmp/beszel-agent.deb
    state: absent

- name: Configure beszel-agent
  ansible.builtin.copy:
    dest: /etc/beszel-agent.conf
    content: |
      KEY={{ beszel_key }}
      TOKEN={{ beszel_token }}
      HUB_URL={{ beszel_hub_url }}
    owner: beszel
    group: beszel
    mode: "0600"
  no_log: true
  when: (beszel_agent_mode | default('websocket')) == 'websocket'

- name: Configure beszel-agent credentials for SSH mode
  ansible.builtin.copy:
    dest: /etc/beszel-agent.conf
    content: |
      KEY={{ beszel_key }}
    owner: beszel
    group: beszel
    mode: "0600"
  no_log: true
  when: (beszel_agent_mode | default('websocket')) == 'ssh'

- name: Create beszel-agent systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/beszel-agent.service.d
    state: directory
    mode: "0755"
  when: (beszel_agent_mode | default('websocket')) == 'ssh'

- name: Configure beszel-agent for SSH mode
  ansible.builtin.copy:
    dest: /etc/systemd/system/beszel-agent.service.d/10-ssh-mode.conf
    content: |
      [Service]
      Environment="LISTEN=45876"
      UnsetEnvironment=HUB_URL TOKEN
    owner: root
    group: root
    mode: "0644"
  no_log: true
  when: (beszel_agent_mode | default('websocket')) == 'ssh'

- name: Reset failed state from the package's own first-boot start attempt
  ansible.builtin.command:
    cmd: systemctl reset-failed beszel-agent
  changed_when: false
  failed_when: false

- name: Enable and start beszel-agent
  ansible.builtin.systemd:
    name: beszel-agent
    daemon_reload: true
    enabled: true
    state: restarted
