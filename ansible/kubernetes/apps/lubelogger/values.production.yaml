---
# LubeLogger — Argo CD production values (bjw-s app-template 5.3.0).
# Source of truth for the workload: playbooks/lubelogger/docker-compose.yml
# (image ghcr.io/hargata/lubelogger v1.4.5, port 8080, eight named
# volumes — consolidated here into ONE local-path PVC mounted by
# subPath, see the persistence section).
# Tailnet-only: exposure mirrors the Kiwix pod — userspace Tailscale
# sidecar TCP-forwarding 443 to an in-pod Caddy (8443), which
# terminates a real certificate (Cloudflare DNS-01) and proxies to
# LubeLogger on 127.0.0.1:8080.
#
# Secrets stay outside Git and outside Argo's ownership:
#   lubelogger-caddy-external    (key cloudflare_api_token) — Ansible/Vault
#   lubelogger-tailscale-auth    (key TS_AUTHKEY, one-use)  — bootstrap only
controllers:
  lubelogger:
    type: deployment
    strategy: Recreate
    pod:
      annotations:
        # Opt-in filesystem backup of the app config volume only;
        # the sidecar volumes are excluded by omission (the Schedule
        # is opt-in), and the tailscale identity must never be
        # captured for restore.
        backup.velero.io/backup-volumes: data-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/hargata/lubelogger
          tag: v1.4.5
          digest: sha256:e915b53eba78349348c8a1937122d8dccc7eba6f71898eecb2af208bc213fe2e
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.104.1
          digest: sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
        envFrom:
          # The bootstrap-created Secret holds exactly one key
          # (TS_AUTHKEY), imported here as the env var of that name.
          # Optional: once the identity persists in tailscale-state,
          # the Secret is deleted and the sidecar runs without it.
          - secretRef:
              name: lubelogger-tailscale-auth
              optional: true
        env:
          TS_AUTH_ONCE: "true"
          TS_HOSTNAME: lubelogger
          TS_STATE_DIR: /var/lib/tailscale
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_EXTRA_ARGS: --login-server=https://hs.davegallant.ca --accept-dns=false
          TS_SERVE_CONFIG: /etc/tailscale/serve-config.json
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      caddy:
        image:
          repository: ghcr.io/davegallant/homelab-caddy-cloudflare
          tag: 2.11.6-a8737d0
          digest: sha256:36cb30f2df99d3aa9d41ed3bbf4685e662c9fe42cfbb5b06b4d98173d7473f03
        command:
          - caddy
        args:
          - run
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

service:
  lubelogger:
    controller: lubelogger
    ports:
      http:
        port: 8080

configMaps:
  # Keys are short on purpose: bjw-s names the rendered ConfigMaps
  # <release>-<key>, and the persistence entries below reference the
  # resulting lubelogger-tailscale / lubelogger-caddy names.
  tailscale:
    data:
      serve-config.json: |
        {
          "TCP": {
            "443": {
              "TCPForward": "127.0.0.1:8443"
            }
          }
        }
  caddy:
    data:
      Caddyfile: |
        {
          auto_https disable_redirects
          https_port 8443
          tls_resolvers 1.1.1.1
          servers {
            protocols h1 h2
          }
        }

        lubelogger.tail.davegallant.ca {
          bind 127.0.0.1

          tls {
            dns cloudflare {file./run/secrets/cloudflare_api_token}
            propagation_delay 30s
            propagation_timeout -1
          }

          reverse_proxy 127.0.0.1:8080
        }

persistence:
  data:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      lubelogger:
        app:
          - path: /mnt/lubelogger-rollback/config
            subPath: config
            readOnly: true
          - path: /mnt/lubelogger-rollback/data
            subPath: data
            readOnly: true
          - path: /mnt/lubelogger-rollback/translations
            subPath: translations
            readOnly: true
          - path: /mnt/lubelogger-rollback/documents
            subPath: documents
            readOnly: true
          - path: /mnt/lubelogger-rollback/images
            subPath: images
            readOnly: true
          - path: /mnt/lubelogger-rollback/temp
            subPath: temp
            readOnly: true
          - path: /mnt/lubelogger-rollback/log
            subPath: log
            readOnly: true
          # DataProtection keys: losing them invalidates protected
          # data (auth cookies), so they ride the same PVC.
          - path: /mnt/lubelogger-rollback/keys
            subPath: keys
            readOnly: true
  data-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      lubelogger:
        app:
          - path: /App/config
            subPath: config
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/translations
            subPath: translations
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/wwwroot/temp
            subPath: temp
          - path: /App/log
            subPath: log
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys
  tailscale-state:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 64Mi
    advancedMounts:
      lubelogger:
        tailscale:
          - path: /var/lib/tailscale
  tailscale-config:
    type: configMap
    name: lubelogger-tailscale
    advancedMounts:
      lubelogger:
        tailscale:
          - path: /etc/tailscale/serve-config.json
            subPath: serve-config.json
            readOnly: true
  caddy-config:
    type: configMap
    name: lubelogger-caddy
    advancedMounts:
      lubelogger:
        caddy:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
  caddy-state:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 256Mi
    advancedMounts:
      lubelogger:
        caddy:
          - path: /data
  caddy-runtime:
    type: emptyDir
    advancedMounts:
      lubelogger:
        caddy:
          - path: /config
  caddy-secret:
    type: secret
    name: lubelogger-caddy-external
    advancedMounts:
      lubelogger:
        caddy:
          - path: /run/secrets/cloudflare_api_token
            subPath: cloudflare_api_token
            readOnly: true

rawResources:
  backupSchedule:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: lubelogger-daily
        namespace: velero
      spec:
        schedule: "0 3 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - lubelogger
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default
