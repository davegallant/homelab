{{- if not .Values.homepage.existingSecret }}
{{- if not .Values.homepageEnv }}
{{ fail "homepageEnv must be supplied from Ansible (see values.ansible.yaml.j2)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: homepage-environment
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.homepageEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

{{- if not .Values.caddy.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: homepage-caddy
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cloudflare_api_token: {{ required "cloudflareApiToken must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.cloudflareApiToken | quote }}
{{- end }}
