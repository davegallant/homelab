apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: {{ .Release.Namespace }}
data:
  services.yaml: |
{{- .Values.configFiles.servicesYaml | nindent 4 }}
  settings.yaml: |
{{- .Values.configFiles.settingsYaml | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-node-proxy
  namespace: {{ .Release.Namespace }}
data:
  proxy-agent.cjs: |
{{- .Values.configFiles.proxyAgentCjs | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-caddy
  namespace: {{ .Release.Namespace }}
data:
  Caddyfile: |
    {
      auto_https disable_redirects
      https_port 8443
      tls_resolvers 1.1.1.1
      servers {
        protocols h1 h2
      }
    }

    homepage.{{ .Values.magicDnsDomain }} {
      bind 127.0.0.1

      tls {
        dns cloudflare {file./run/secrets/cloudflare_api_token}
        propagation_delay 30s
        propagation_timeout -1
      }

      reverse_proxy 127.0.0.1:3000
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-tailscale
  namespace: {{ .Release.Namespace }}
data:
  serve-config.json: |
    {
      "TCP": {
        "443": {
          "TCPForward": "127.0.0.1:8443"
        }
      }
    }
