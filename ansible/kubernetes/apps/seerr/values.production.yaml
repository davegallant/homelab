---
# Seerr — Argo CD production values (bjw-s app-template 5.3.0).
# Source of truth for the workload: playbooks/seerr/docker-compose.yml
# (image ghcr.io/seerr-team/seerr v3.5.1, port 5055, ./config:/app/config).
# Tailnet-only, per Dave's standing decision: exposure mirrors the
# Kiwix pod — userspace Tailscale sidecar TCP-forwarding 443 to an
# in-pod Caddy (8443), which terminates a real certificate
# (Cloudflare DNS-01) and proxies to Seerr on 127.0.0.1:5055.
#
# Secrets stay outside Git and outside Argo's ownership:
#   seerr-caddy-external    (key cloudflare_api_token) — Ansible/Vault
#   seerr-tailscale-auth    (key TS_AUTHKEY, one-use)  — bootstrap only
controllers:
  seerr:
    type: deployment
    strategy: Recreate
    # STAGING: 0 until the LXC config has been copied into the PVC
    # (see README.md). The cutover commit removes this line.
    pod:
      annotations:
        # Opt-in filesystem backup of the app config volume only;
        # the sidecar volumes are excluded by omission (the Schedule
        # is opt-in), and the tailscale identity must never be
        # captured for restore.
        backup.velero.io/backup-volumes: config
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.1
          digest: sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
        env:
          LOG_LEVEL: debug
          TZ: America/Toronto
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /api/v1/status
            port: 5055
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /api/v1/status
            port: 5055
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /api/v1/status
            port: 5055
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.104.1
          digest: sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
        envFrom:
          # The bootstrap-created Secret holds exactly one key
          # (TS_AUTHKEY), imported here as the env var of that name.
          # Optional: once the identity persists in tailscale-state,
          # the Secret is deleted and the sidecar runs without it.
          - secretRef:
              name: seerr-tailscale-auth
              optional: true
        env:
          TS_AUTH_ONCE: "true"
          TS_HOSTNAME: seerr
          TS_STATE_DIR: /var/lib/tailscale
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_EXTRA_ARGS: --login-server=https://hs.davegallant.ca --accept-dns=false
          TS_SERVE_CONFIG: /etc/tailscale/serve-config.json
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      caddy:
        image:
          repository: ghcr.io/davegallant/homelab-caddy-cloudflare
          tag: 2.11.6-a8737d0
          digest: sha256:36cb30f2df99d3aa9d41ed3bbf4685e662c9fe42cfbb5b06b4d98173d7473f03
        command:
          - caddy
        args:
          - run
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

service:
  seerr:
    controller: seerr
    ports:
      http:
        port: 5055

configMaps:
  # Keys are short on purpose: bjw-s names the rendered ConfigMaps
  # <release>-<key>, and the persistence entries below reference the
  # resulting seerr-tailscale / seerr-caddy names.
  tailscale:
    data:
      serve-config.json: |
        {
          "TCP": {
            "443": {
              "TCPForward": "127.0.0.1:8443"
            }
          }
        }
  caddy:
    data:
      Caddyfile: |
        {
          auto_https disable_redirects
          https_port 8443
          tls_resolvers 1.1.1.1
          servers {
            protocols h1 h2
          }
        }

        seerr.tail.davegallant.ca {
          bind 127.0.0.1

          tls {
            dns cloudflare {file./run/secrets/cloudflare_api_token}
            propagation_delay 30s
            propagation_timeout -1
          }

          reverse_proxy 127.0.0.1:5055
        }

persistence:
  config:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      seerr:
        app:
          - path: /app/config
  tailscale-state:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 64Mi
    advancedMounts:
      seerr:
        tailscale:
          - path: /var/lib/tailscale
  tailscale-config:
    type: configMap
    name: seerr-tailscale
    advancedMounts:
      seerr:
        tailscale:
          - path: /etc/tailscale/serve-config.json
            subPath: serve-config.json
            readOnly: true
  caddy-config:
    type: configMap
    name: seerr-caddy
    advancedMounts:
      seerr:
        caddy:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
  caddy-state:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 256Mi
    advancedMounts:
      seerr:
        caddy:
          - path: /data
  caddy-runtime:
    type: emptyDir
    advancedMounts:
      seerr:
        caddy:
          - path: /config
  caddy-secret:
    type: secret
    name: seerr-caddy-external
    advancedMounts:
      seerr:
        caddy:
          - path: /run/secrets/cloudflare_api_token
            subPath: cloudflare_api_token
            readOnly: true

rawResources:
  backupSchedule:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: seerr-daily
        namespace: velero
      spec:
        schedule: "0 3 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - seerr
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default
