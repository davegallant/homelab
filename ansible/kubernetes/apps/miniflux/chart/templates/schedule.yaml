{{- if .Values.backup.enabled }}
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: miniflux-daily
  namespace: velero
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  template:
    ttl: {{ .Values.backup.ttl }}
    includedNamespaces:
      - {{ .Release.Namespace }}
    excludedResources:
      - secrets
    # Opt-in only: the database pod annotates its data volume in
    # (backup.velero.io/backup-volumes) and a pre-backup hook writes
    # a logical pg_dump into that volume first. The app pod has no
    # volumes and contributes manifests only.
    defaultVolumesToFsBackup: false
    snapshotVolumes: false
    storageLocation: default
{{- end }}
