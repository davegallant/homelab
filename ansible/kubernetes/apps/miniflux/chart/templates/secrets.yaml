apiVersion: v1
kind: Secret
metadata:
  name: miniflux
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  db-user: {{ required "dbUser must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.dbUser | quote }}
  db-password: {{ required "dbPassword must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.dbPassword | quote }}
  admin-username: {{ required "adminUsername must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.adminUsername | quote }}
  admin-password: {{ required "adminPassword must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.adminPassword | quote }}
{{- if .Values.newt.enabled }}
  newt-id: {{ required "newtId must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.newtId | quote }}
  newt-secret: {{ required "newtSecret must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.newtSecret | quote }}
{{- end }}
