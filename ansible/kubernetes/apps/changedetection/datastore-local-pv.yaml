---
# This cutover-specific static local PV points at the directory provisioned
# by the initial changedetection-datastore local-path claim. Velero can back
# up local PVs, while its filesystem backup does not support the hostPath PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: changedetection-datastore-local
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-5a5241ee-8552-4584-b453-dce39cc40d90_changedetection_changedetection-datastore
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: changedetection
    name: changedetection-datastore-local
