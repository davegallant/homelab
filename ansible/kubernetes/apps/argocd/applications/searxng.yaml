---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: ansible/kubernetes/apps/searxng/chart
    helm:
      releaseName: searxng
      valueFiles:
        - ../values.production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: searxng
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
