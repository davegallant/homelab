---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: "5.3.0"
      helm:
        releaseName: prowlarr
        valueFiles:
          - $values/ansible/kubernetes/apps/prowlarr/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prowlarr
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
