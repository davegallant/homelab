---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-ngx-export-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-37410f53-d596-4f7b-aa8e-0418f0a0386b_paperless-ngx_paperless-ngx-export
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: paperless-ngx
    name: paperless-ngx-export-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-export-local
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: paperless-ngx-export-local
