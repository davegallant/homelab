---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-ngx-data-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-29cee2d8-19fc-41e7-aec1-e72a17308a5f_paperless-ngx_paperless-ngx-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: paperless-ngx
    name: paperless-ngx-data-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-data-local
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: paperless-ngx-data-local
