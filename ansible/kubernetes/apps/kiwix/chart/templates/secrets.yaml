{{- if .Values.tailscale.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: kiwix-caddy
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cloudflare_api_token: {{ required "cloudflareApiToken must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.cloudflareApiToken | quote }}
{{- end }}
