apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/secret-settings.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: searxng
          image: {{ .Values.searxng.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: UWSGI_WORKERS
              value: {{ .Values.searxng.uwsgiWorkers | quote }}
            - name: UWSGI_THREADS
              value: {{ .Values.searxng.uwsgiThreads | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
        {{- if .Values.newt.enabled }}
        - name: newt
          image: {{ .Values.newt.image }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: searxng-newt
          resources:
            {{- toYaml .Values.newt.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: searxng-settings
          secret:
            secretName: searxng-settings
