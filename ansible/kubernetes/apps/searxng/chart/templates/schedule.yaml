{{- if .Values.backup.enabled }}
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: searxng-daily
  namespace: velero
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  template:
    ttl: {{ .Values.backup.ttl }}
    includedNamespaces:
      - {{ .Release.Namespace }}
    excludedResources:
      - secrets
    defaultVolumesToFsBackup: false
{{- end }}
