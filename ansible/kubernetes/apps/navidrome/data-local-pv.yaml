---
# This cutover-specific static local PV points at the directory provisioned
# by the initial navidrome local-path claim. Velero can back up local
# PVs, while its filesystem backup does not support the original hostPath PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-data-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-2d30cfb4-a974-4404-a80f-9fe105a006bb_navidrome_navidrome
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: navidrome
    name: navidrome-data-local
