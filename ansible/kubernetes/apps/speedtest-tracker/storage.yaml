---
# Storage for speedtest-tracker, applied once by hand (see
# README.md) and deliberately NOT managed by Argo CD: the homelab
# AppProject allows namespace-scoped resources only, so namespaces
# and static volumes stay an Ansible / kubectl concern.
#
# Speedtest Tracker has no static volumes at staging: app config,
# the Postgres data directory, the Apprise state and the Tailscale /
# Caddy state are chart-managed local-path PVCs declared in
# values.production.yaml. This file creates just the namespace; the
# static local-PV binds happen at cutover (README).
apiVersion: v1
kind: Namespace
metadata:
  name: speedtest-tracker
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
