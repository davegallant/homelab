---
# Cutover PV for the restored Speedtest Tracker database on k8s-w-2.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: speedtest-tracker-db-data-local
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-ed90cef8-1a32-451d-b6a6-7275df79b475_speedtest-tracker_speedtest-tracker-db-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: speedtest-tracker
    name: speedtest-tracker-db-data-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-db-data-local
  namespace: speedtest-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: speedtest-tracker-db-data-local
