---
# Radarr — Argo CD production values (bjw-s app-template 5.3.0).
# Source of truth for the workload: playbooks/radarr/docker-compose.yml
# (app docker.io/linuxserver/radarr 6.4.4, port 7878; config on a
# local volume, the shared media tree at /mnt).
# Tailnet-only: exposure mirrors the RomM pod — userspace Tailscale
# sidecar TCP-forwarding 443 to an in-pod Caddy (8443), which
# terminates a real certificate (Cloudflare DNS-01) and proxies to
# Radarr on 127.0.0.1:7878, replacing the LXC's host Caddy role.
# The tailnet URL is unchanged.
#
# Batch D design note: qBittorrent does NOT move with the *arr
# suite. It keeps its LXC, its static LAN IP, and its OPNsense →
# Mullvad policy route. This pod reaches it over the LAN exactly
# as the LXC does today; the CiliumNetworkPolicy below carries the
# one new rule that split requires (egress to qBittorrent's API).
#
# The media tree stays on TrueNAS (static NFS claim radarr-media,
# see storage.yaml), mounted at /mnt — the identical path the LXC
# uses, so every path in Radarr's database stays true and hardlink
# imports keep working (NFS link/rename are server-side within the
# export). It never moves and is never Velero-backed-up (TrueNAS
# snapshots + Drive sync).
#
# Secrets stay outside Git and outside Argo's ownership:
#   radarr-caddy-external    (key cloudflare_api_token) — gitops-secrets.yml
#   radarr-tailscale-auth    (key TS_AUTHKEY, one-use)  — bootstrap only
# There is deliberately no app Secret: Radarr's API key and qBittorrent
# credentials live in its config.xml, which arrives with the copied
# /config.
#
# CUTOVER SUBSTITUTION (README step 0): the qBittorrent egress rule
# below uses 192.168.1.152/32 (TEST-NET-3, unroutable — fails safe).
# Replace BOTH occurrences with qBittorrent's real static LAN IP
# before the staging commit.
controllers:
  radarr:
    type: deployment
    strategy: Recreate
    pod:
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the config volume only; the
        # NFS media tree is excluded by omission (TrueNAS snapshots
        # + Drive sync protect it, never Velero).
        backup.velero.io/backup-volumes: config-local
    containers:
      app:
        image:
          repository: docker.io/linuxserver/radarr
          tag: 6.4.4
          digest: sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
        env:
          PUID: "1000"
          PGID: "1000"
          UMASK: "002"
          TZ: Etc/UTC
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 7878
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 7878
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 7878
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.104.1
          digest: sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
        envFrom:
          # The bootstrap-created Secret holds exactly one key
          # (TS_AUTHKEY), imported here as the env var of that name.
          # Optional: once the identity persists in tailscale-state,
          # the Secret is deleted and the sidecar runs without it.
          - secretRef:
              name: radarr-tailscale-auth
              optional: true
        env:
          TS_AUTH_ONCE: "true"
          TS_HOSTNAME: radarr
          TS_STATE_DIR: /var/lib/tailscale
          # State lives on the local PVC, so disable Kubernetes Secret storage.
          TS_KUBE_SECRET: ""
          TS_USERSPACE: "true"
          TS_EXTRA_ARGS: --login-server=https://hs.davegallant.ca --accept-dns=false
          TS_SERVE_CONFIG: /etc/tailscale/serve-config.json
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
      caddy:
        image:
          repository: ghcr.io/davegallant/homelab-caddy-cloudflare
          tag: 2.11.6-a8737d0
          digest: sha256:36cb30f2df99d3aa9d41ed3bbf4685e662c9fe42cfbb5b06b4d98173d7473f03
        command:
          - caddy
        args:
          - run
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

service:
  radarr:
    controller: radarr
    ports:
      http:
        port: 7878

configMaps:
  # Keys are short on purpose: bjw-s names the rendered ConfigMaps
  # <release>-<key>, and the persistence entries below reference the
  # resulting radarr-tailscale / radarr-caddy names.
  tailscale:
    data:
      serve-config.json: |
        {
          "TCP": {
            "443": {
              "TCPForward": "127.0.0.1:8443"
            }
          }
        }
  caddy:
    data:
      Caddyfile: |
        {
          auto_https disable_redirects
          https_port 8443
          tls_resolvers 1.1.1.1
          servers {
            protocols h1 h2
          }
        }

        radarr.tail.davegallant.ca {
          bind 127.0.0.1

          tls {
            dns cloudflare {file./run/secrets/cloudflare_api_token}
            propagation_delay 30s
            propagation_timeout -1
          }

          reverse_proxy 127.0.0.1:7878
        }

persistence:
  config-local:
    type: persistentVolumeClaim
    existingClaim: radarr-config-local
    advancedMounts:
      radarr:
        app:
          - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: radarr-media
    advancedMounts:
      radarr:
        app:
          - path: /mnt
  tailscale-state:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      radarr:
        tailscale:
          - path: /var/lib/tailscale
  tailscale-config:
    type: configMap
    name: radarr-tailscale
    advancedMounts:
      radarr:
        tailscale:
          - path: /etc/tailscale/serve-config.json
            subPath: serve-config.json
            readOnly: true
  caddy-config:
    type: configMap
    name: radarr-caddy
    advancedMounts:
      radarr:
        caddy:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
  caddy-state:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 256Mi
    advancedMounts:
      radarr:
        caddy:
          - path: /data
  caddy-runtime:
    type: emptyDir
    advancedMounts:
      radarr:
        caddy:
          - path: /config
  caddy-secret:
    type: secret
    name: radarr-caddy-external
    advancedMounts:
      radarr:
        caddy:
          - path: /run/secrets/cloudflare_api_token
            subPath: cloudflare_api_token
            readOnly: true

rawResources:
  daily:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: radarr-daily
        namespace: velero
      spec:
        schedule: "0 3 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - radarr
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default

  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: radarr
      spec:
        description: Default deny with metadata-fetch egress, cluster DNS, Prowlarr access, and a single LAN exception for the qBittorrent API on its LXC.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
          # Prowlarr pushes indexer results and syncs over the API.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
          # The apps poll Prowlarr's Torznab feeds; at cutover each
          # app's Prowlarr indexer URL is repointed to the Service.
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          # qBittorrent stays on its LXC: the download-client API is
          # the one LAN destination this pod may reach. SUBSTITUTE
          # the real static IP for 192.168.1.152/32 at cutover (README
          # step 0) — TEST-NET-3 is unroutable, so an unsubstituted
          # policy fails safe (test fails, nothing leaks).
          - toCIDRSet:
              - cidr: 192.168.1.152/32
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - toEntities:
              - cluster
          - toEntities:
              - world
        egressDeny:
          # The world allow above must never become a LAN backdoor;
          # deny the private ranges right back out, excepting only
          # the qBittorrent host (same substitution as above).
          - toCIDRSet:
              - cidr: 192.168.1.0/24
                except:
                  - 192.168.1.152/32
              - cidr: 10.96.0.0/12
              - cidr: 10.245.0.0/16
