---
- name: Get the tailnet IPv4 address
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailnet_caddy_tailscale_ip
  check_mode: false
  changed_when: false
  failed_when: tailnet_caddy_tailscale_ip.rc != 0

- name: Validate the Headscale IPv4 address
  ansible.builtin.assert:
    that:
      - tailnet_caddy_tailscale_ip.stdout | trim | length > 0
      - (tailnet_caddy_tailscale_ip.stdout | trim).split('.')[0:2] == headscale_v4_prefix.split('.')[0:2]
    fail_msg: "The tailnet Caddy role requires an assigned Headscale IPv4 address in {{ headscale_v4_prefix }}."

- name: Configure Caddy on the Headscale tailnet
  block:
    - name: Validate tailnet Caddy settings
      ansible.builtin.assert:
        that:
          - tailnet_caddy_domain is defined
          - tailnet_caddy_upstream is defined
          - cloudflare_dns_api_token is defined
          - cloudflare_dns_api_token | length > 0
        fail_msg: "Set the tailnet_caddy_domain, tailnet_caddy_upstream, and Cloudflare token before deploying tailnet Caddy."
      no_log: true

    - name: Create tailnet Caddy directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: /root/tailnet-caddy
          mode: "0750"
        - path: /etc/tailnet-caddy
          mode: "0700"

    - name: Create tailnet Caddy storage directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - /root/tailnet-caddy/data
        - /root/tailnet-caddy/config

    - name: Find tailnet Caddy storage entries
      ansible.builtin.find:
        paths:
          - /root/tailnet-caddy/data
          - /root/tailnet-caddy/config
        recurse: true
        hidden: true
        file_type: any
      register: tailnet_caddy_storage_entries

    - name: Correct tailnet Caddy storage ownership
      ansible.builtin.command:
        cmd: chown -R root:root /root/tailnet-caddy/data /root/tailnet-caddy/config
      changed_when: true
      when: >-
        tailnet_caddy_storage_entries.files | selectattr('uid', 'ne', 0) | list | length > 0
        or tailnet_caddy_storage_entries.files | selectattr('gid', 'ne', 0) | list | length > 0
      register: tailnet_caddy_storage_ownership

    - name: Install tailnet Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /root/tailnet-caddy/Caddyfile
        owner: root
        group: root
        mode: "0640"
      register: tailnet_caddy_config

    - name: Install tailnet Caddy Compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: /root/tailnet-caddy/docker-compose.yml
        owner: root
        group: root
        mode: "0640"
      register: tailnet_caddy_compose

    - name: Install Cloudflare DNS API token
      ansible.builtin.copy:
        content: "{{ cloudflare_dns_api_token }}"
        dest: /etc/tailnet-caddy/cloudflare_api_token
        owner: root
        group: root
        mode: "0600"
      register: tailnet_caddy_token
      no_log: true

    - name: Pull Caddy with Cloudflare DNS support
      community.docker.docker_image:
        name: "{{ tailnet_caddy_image }}"
        source: pull

    - name: Reset old Tailscale Serve configuration
      ansible.builtin.command:
        cmd: tailscale serve reset
      changed_when: false

    - name: Start tailnet Caddy
      community.docker.docker_compose_v2:
        project_src: /root/tailnet-caddy
        project_name: tailnet-caddy
        state: present
        build: never
        pull: never
        recreate: >-
          {{ 'always' if (
            tailnet_caddy_config.changed
            or tailnet_caddy_compose.changed
            or tailnet_caddy_token.changed
            or tailnet_caddy_storage_ownership.changed
          ) else 'auto' }}
