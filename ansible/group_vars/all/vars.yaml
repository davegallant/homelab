---
# Non-secret variables shared by every host. Secrets live in secrets.yaml
# (ansible-vault encrypted).

# Host agent package version. Renovate groups updates with the Kubernetes hub
# image in kubernetes/apps/beszel/values.production.yaml.
# renovate: datasource=github-releases depName=henrygd/beszel
beszel_version: "0.21.2"

homelab_lan_subnet: 192.168.1.0/24

# Sources allowed to reach published container ports (see the DOCKER-USER block
# in tasks/install-docker.yml). Docker's own bridge networks (172.16.0.0/12) are
# always allowed. Services that genuinely need to be reachable off the tailnet
# override this in their play's vars: (see bedrock).
ufw_docker_allowed_sources:
  - 100.64.0.0/10  # Tailscale (CGNAT range)

# Pangolin dashboard domain (VPS edge host). Shared by the VPS playbook
# and the Gatus endpoint. Verified against the live VPS config (2026-10-03).
pangolin_dashboard_domain: "pangolin.davegallant.ca"

# Tailnet-only SearXNG endpoint through the Kubernetes Tailnet Gateway.
searxng_url: "https://searxng.tail.davegallant.ca"

# Headplane admin UI; routed through the tailnet-only Kubernetes Gateway.
headplane_url: "https://headplane.tail.davegallant.ca"
headlamp_url: "https://headlamp.tail.davegallant.ca"
argo_workflows_url: "https://argo-workflows.tail.davegallant.ca"
invidious_url: "https://invidious.tail.davegallant.ca"

# Headscale tailnet IPv4 allocation range.
headscale_v4_prefix: "100.100.0.0/16"
headscale_primary_dns_ip: "100.100.0.9" # AdGuard Home
headscale_secondary_dns_ip: "100.100.0.7" # Gatus host

# LAN gateway split horizon. kubernetes/apps/lan-gateway/chart/values.yaml is
# the single source; both AdGuard playbooks manage the rules between the
# markers and leave every other user rule alone.
lan_gateway_values: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../kubernetes/apps/lan-gateway/chart/values.yaml') | from_yaml }}"
lan_gateway_adguard_rule_markers: ["! lan-gateway begin (managed by Ansible)", "! lan-gateway end"]
lan_gateway_adguard_rules: >-
  {%- set v = lan_gateway_values -%}
  {%- set out = [lan_gateway_adguard_rule_markers[0]] -%}
  {%- for a in v.apps -%}
  {%- set h = a.hostname | default(a.name ~ '.davegallant.ca') -%}
  {%- set _ = out.append('||' ~ h ~ '^$dnsrewrite=' ~ v.loadBalancerIP ~ ',client=' ~ (v.lanDnsClients | join('|'))) -%}
  {%- set _ = out.append('||' ~ h ~ '^$dnsrewrite=' ~ v.tailnetIP ~ ',client=' ~ (lan_gateway_tailnet_clients | join('|'))) -%}
  {%- endfor -%}
  {%- for r in lan_extra_adguard_rules -%}{%- set _ = out.append(r) -%}{%- endfor -%}
  {%- set _ = out.append(lan_gateway_adguard_rule_markers[1]) -%}
  {{ out }}

# Gotify LXC LAN address (DHCP reservation in opnsense-iac). Home clients resolve
# gotify.davegallant.ca to it so alerts keep flowing when the VPS is down.
gotify_lan_ip: 192.168.1.100
# Gotify LXC's Headscale address.
gotify_tailnet_ip: 100.100.0.10

# Extra split-horizon rules inside the managed AdGuard block (LAN clients only).
# All LAN clients, including Talos nodes: in-cluster DNS forwards from node IPs,
# so pods that alert through Gotify get the LAN answer too.
lan_extra_adguard_rules:
  - "||gotify.davegallant.ca^$dnsrewrite={{ gotify_lan_ip }},client={{ homelab_lan_subnet }}"
  # Tailnet clients (100.64.0.0/10) reach Gotify directly over the tailnet, not via Pangolin.
  - "||gotify.davegallant.ca^$dnsrewrite={{ gotify_tailnet_ip }},client=100.64.0.0/10"
