---
# Non-secret variables shared by every host. Secrets live in secrets.yaml
# (ansible-vault encrypted).

# Used by both tasks/install-beszel-agent.yml (agent .deb) and
# playbooks/beszel/docker-compose.yml (hub image tag). Keep them in lockstep.
# renovate: datasource=github-releases depName=henrygd/beszel
beszel_version: "0.21.0"

homelab_lan_subnet: 192.168.1.0/24

# Sources allowed to reach published container ports (see the DOCKER-USER block
# in tasks/install-docker.yml). Docker's own bridge networks (172.16.0.0/12) are
# always allowed. Services that genuinely need to be reachable off the tailnet
# override this in their play's vars: (see bedrock and jellyfin).
ufw_docker_allowed_sources:
  - 100.64.0.0/10  # Tailscale (CGNAT range)

# Pangolin dashboard domain (VPS edge host). Shared by the pangolin playbook
# and the Gatus endpoint. Verified against the live VPS config (2026-10-03).
pangolin_dashboard_domain: "pangolin.davegallant.ca"

# Headscale tailnet IPv4 allocation range.
headscale_v4_prefix: "100.100.0.0/16"
