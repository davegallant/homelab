name: Run all playbooks
on:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
  schedule:
    - cron: "@daily"
  workflow_dispatch:

jobs:
  discover:
    runs-on: host
    outputs:
      playbooks: ${{ steps.list.outputs.playbooks }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: |
          playbooks=$(find ansible/playbooks -name "main.yml" -mindepth 2 -maxdepth 2 \
            | xargs -I{} dirname {} | xargs -I{} basename {} \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "playbooks=$playbooks" >> $FORGEJO_OUTPUT

  run-ansible:
    needs: discover
    runs-on: host
    strategy:
      matrix:
        playbook: ${{ fromJson(needs.discover.outputs.playbooks) }}
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3.12
          PLAYBOOK: ${{ matrix.playbook }}
        run: |
          set -euo pipefail
          # Remove the plaintext vault password left behind by earlier runs.
          rm -f .vault_pass
          # Ansible executes the password file and reads stdout, so the vault
          # password never touches disk on this persistent runner.
          VAULT_PASS_FILE="$(mktemp)"
          trap 'rm -f "$VAULT_PASS_FILE"' EXIT
          chmod 700 "$VAULT_PASS_FILE"
          printf '#!/bin/sh\nprintf %%s "$ANSIBLE_VAULT_PASSWORD"\n' > "$VAULT_PASS_FILE"
          ansible-playbook -i ansible/inventory \
            "ansible/playbooks/$PLAYBOOK/main.yml" \
            --vault-password-file "$VAULT_PASS_FILE"

      - name: Notify failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          PLAYBOOK: ${{ matrix.playbook }}
        run: |
          curl -X POST "${{ secrets.GOTIFY_URL }}/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Ansible playbook '$PLAYBOOK' failed in ${{ github.repository }}" \
            -F "message=A playbook failed. Check workflow details: ${RUN_URL}" \
            -F "priority=5"
