name: Run single playbook
on:
  workflow_dispatch:
    inputs:
      host:
        description: "Name of the host to execute"
        required: false
        default: ""
        type: string

jobs:
  run-ansible:
    runs-on: host
    if: ${{ github.event.inputs.host != '' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run specified playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3.12
          # Untrusted input: never interpolate directly into the shell.
          PLAYBOOK_HOST: ${{ github.event.inputs.host }}
        run: |
          set -euo pipefail
          if ! grep -qxF "$PLAYBOOK_HOST" ansible/inventory; then
            echo "'$PLAYBOOK_HOST' is not a host in ansible/inventory" >&2
            exit 1
          fi
          # Remove the plaintext vault password left behind by earlier runs.
          rm -f .vault_pass
          # Ansible executes the password file and reads stdout, so the vault
          # password never touches disk on this persistent runner.
          VAULT_PASS_FILE="$(mktemp)"
          trap 'rm -f "$VAULT_PASS_FILE"' EXIT
          chmod 700 "$VAULT_PASS_FILE"
          printf '#!/bin/sh\nprintf %%s "$ANSIBLE_VAULT_PASSWORD"\n' > "$VAULT_PASS_FILE"
          ansible-playbook -i ansible/inventory \
            "ansible/playbooks/$PLAYBOOK_HOST/main.yml" \
            --vault-password-file "$VAULT_PASS_FILE"
  notify-failure:
    needs: run-ansible
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send failure notification
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          curl -X POST "${{ secrets.GOTIFY_URL }}/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=Ansible playbooks failed in ${{ github.repository }}!" \
            -F "message=One or more playbooks failed. Check workflow details: ${RUN_URL}" \
            -F "priority=5"
