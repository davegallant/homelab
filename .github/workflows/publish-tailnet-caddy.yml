name: Publish tailnet Caddy image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Caddy image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/tailnet-caddy
          push: true
          platforms: linux/amd64
          tags: ghcr.io/davegallant/homelab-caddy-cloudflare:2.11.6-a8737d0
          labels: org.opencontainers.image.source=https://github.com/davegallant/homelab
