name: Update containers table

on:
  push:
    branches:
      - main
    paths:
      - "**/docker-compose.yml"
  pull_request:
    paths:
      - "**/docker-compose.yml"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.53.3
        run: |
          set -euo pipefail
          base="https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}"
          wget -qO /tmp/yq "${base}/yq_linux_amd64"
          # yq publishes one column per hash algorithm; checksums_hashes_order
          # gives the column ordering, field 1 of checksums is the filename.
          col=$(curl -fsSL "${base}/checksums_hashes_order" | grep -n '^SHA-256$' | cut -d: -f1)
          sum=$(curl -fsSL "${base}/checksums" | awk -v c="$((col + 1))" '$1=="yq_linux_amd64"{print $c}')
          echo "${sum}  /tmp/yq" | sha256sum --check --strict -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Generate containers table
        run: ./generate-containers-table.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update containers table"
          git pull --rebase origin ${GITHUB_HEAD_REF:-main}
          git push origin HEAD:${GITHUB_HEAD_REF:-main}
