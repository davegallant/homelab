name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install linters
        run: |
          # --include-deps exposes ansible-galaxy from the bundled ansible-core
          pipx install --include-deps ansible-lint
          pipx install yamllint

      - name: Install Ansible Galaxy collections
        # ansible-lint cannot resolve community.general.ufw and friends without
        # them, and reports every use as an unknown module.
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml ansible/ kubernetes/ .forgejo/ .github/

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          # These manual operational playbooks load Vault directly. GitHub PR
          # lint runs without secrets; local `just lint` validates them fully.
          # The exclude list is derived from the playbooks themselves (any
          # talos-cluster playbook that references the Vault file), so it
          # cannot drift when a new Vault-loading playbook is added.
          excludes=()
          while IFS= read -r playbook; do
            excludes+=(--exclude "$playbook")
          done < <(grep -rl --include='*.yml' 'group_vars/all/secrets.yaml' playbooks/talos-cluster/ | sort)
          ansible-lint "${excludes[@]}"

      - name: Run shellcheck
        run: shellcheck generate-containers-table.sh scripts/*.sh
