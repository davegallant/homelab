name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install linters
        run: |
          # --include-deps exposes ansible-galaxy from the bundled ansible-core
          pipx install --include-deps ansible-lint
          pipx install yamllint

      - name: Install Ansible Galaxy collections
        # ansible-lint cannot resolve community.general.ufw and friends without
        # them, and reports every use as an unknown module.
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml ansible/ .forgejo/ .github/

      - name: Run ansible-lint
        working-directory: ansible
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -z "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
            echo "::error::ANSIBLE_VAULT_PASSWORD is required to lint Talos playbooks"
            exit 1
          fi

          vault_pass_file="$(mktemp)"
          trap 'rm -f "$vault_pass_file"' EXIT
          cat > "$vault_pass_file" <<'EOF'
          #!/usr/bin/env bash
          printf '%s' "$ANSIBLE_VAULT_PASSWORD"
          EOF
          chmod 0700 "$vault_pass_file"
          ANSIBLE_VAULT_PASSWORD_FILE="$vault_pass_file" ansible-lint

      - name: Run shellcheck
        run: shellcheck generate-containers-table.sh scripts/*.sh
