name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install linters
        run: |
          # --include-deps exposes ansible-galaxy from the bundled ansible-core
          pipx install --include-deps ansible-lint
          pipx install yamllint

      - name: Install Ansible Galaxy collections
        # ansible-lint cannot resolve community.general.ufw and friends without
        # them, and reports every use as an unknown module.
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml ansible/ .forgejo/ .github/

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          # These manual operational playbooks load Vault directly. GitHub PR
          # lint runs without secrets; local `just lint` validates them fully.
          ansible-lint \
            --exclude playbooks/talos-cluster/argocd.yml \
            --exclude playbooks/talos-cluster/bentopdf-secret.yml \
            --exclude playbooks/talos-cluster/bentopdf.yml \
            --exclude playbooks/talos-cluster/kiwix.yml \
            --exclude playbooks/talos-cluster/miniflux.yml \
            --exclude playbooks/talos-cluster/homepage.yml \
            --exclude playbooks/talos-cluster/apply-velero.yml \
            --exclude playbooks/talos-cluster/searxng.yml \
            --exclude playbooks/talos-cluster/verify-cutover.yml \
            --exclude playbooks/talos-cluster/verify-velero-backup.yml

      - name: Run shellcheck
        run: shellcheck generate-containers-table.sh scripts/*.sh
