apiVersion: v1
kind: Pod
metadata:
  name: violating
  namespace: sample
spec:
  containers:
    - name: app
      image: example.invalid/app:1
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
  initContainers:
    - name: prepare
      image: example.invalid/app:1
      securityContext:
        runAsNonRoot: false
        capabilities:
          drop:
            - NET_RAW
