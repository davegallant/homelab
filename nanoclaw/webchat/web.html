<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoClaw Chat</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/chat/favicon-32x32.png">
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #0e141c; color: #e9eef5; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; overflow: hidden; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    aside { background: #111b26; border-right: 1px solid #293747; padding: 18px 12px; display: flex; flex-direction: column; gap: 16px; }
    .side-title { font-size: 15px; font-weight: 800; padding: 5px 8px; }
    #new-chat { width: 100%; text-align: left; }
    #chats { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 4px; border-radius: 9px; }
    .chat-item.active { background: #1f3741; }
    .chat-select { flex: 1; min-width: 0; min-height: 44px; background: transparent; color: #dbe7ef; border: 0; text-align: left; font: inherit; font-weight: 500; padding: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    .chat-delete { min-width: 44px; min-height: 44px; background: transparent; color: #aebccc; border: 0; padding: 8px 10px; font-size: 18px; cursor: pointer; }
    .chat-delete:hover { color: #ff9c9c; }
    .chat-shell { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    header { border-bottom: 1px solid #293747; padding: 16px 18px; display: flex; align-items: center; gap: 12px; }
    .mark { background: #3edba8; color: #08251d; padding: 7px 9px; border-radius: 10px; font-weight: 900; }
    h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; margin: 0; }
    .sub { color: #96a7bb; font-size: 13px; }
    #logout { margin-left: auto; min-height: 44px; padding: 10px 12px; background: transparent; border: 1px solid #35485d; color: #dbe7ef; white-space: nowrap; }
    main { flex: 1; min-height: 0; width: 100%; padding: 24px 18px; overflow-y: auto; overscroll-behavior: contain; }
    .empty { color: #96a7bb; text-align: center; margin: 25vh auto 0; line-height: 1.6; }
    .row { display: flex; max-width: 850px; margin: 0 auto 20px; }
    .row.user { justify-content: flex-end; }
    .bubble { max-width: min(90%, 700px); padding: 13px 16px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: #1b2837; }
    .user .bubble { background: #146c58; color: white; }
    .bubble a { color: #8df2cb; }
    .user .bubble a { color: white; }
    .activity { display: flex; align-items: center; gap: 10px; max-width: 850px; margin: 0 auto; color: #b8c9d9; font-size: 14px; padding: 4px 2px 24px; }
    .activity[hidden] { display: none; }
    .spinner { width: 16px; height: 16px; border: 2px solid #415668; border-top-color: #3edba8; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { background: #0e141c; border-top: 1px solid #293747; padding: 15px 18px max(16px, env(safe-area-inset-bottom)); }
    form { display: flex; width: 100%; gap: 10px; align-items: end; }
    textarea { flex: 1; min-width: 0; width: 100%; min-height: 48px; max-height: 200px; resize: vertical; border: 1px solid #35485d; border-radius: 12px; background: #192533; color: #fff; padding: 12px 14px; font: inherit; font-size: 16px; }
    textarea:focus { outline: 2px solid #3edba8; border-color: transparent; }
    button { border: 0; border-radius: 12px; padding: 14px 18px; background: #3edba8; color: #08251d; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { min-height: 18px; color: #96a7bb; font-size: 12px; padding-top: 8px; }
    @media (max-width: 700px) {
      body { display: flex; flex-direction: column; }
      aside { flex: 0 0 auto; min-width: 0; border-right: 0; border-bottom: 1px solid #293747; gap: 8px; padding: 8px 12px; }
      .side-title { display: none; }
      #new-chat { width: auto; min-height: 44px; align-self: flex-start; padding: 8px 12px; }
      #chats { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
      .chat-item { flex: 0 0 auto; max-width: 220px; }
      .chat-shell { flex: 1; }
      .sub { display: none; }
      .bubble { max-width: 95%; }
      footer { padding-inline: 12px; }
      #send { min-height: 48px; }
    }
  </style>
</head>
<body>
  <aside aria-label="Chats">
    <div class="side-title">Chats</div>
    <button id="new-chat" type="button">+ New side chat</button>
    <nav id="chats" aria-label="Conversations"></nav>
  </aside>
  <div class="chat-shell">
    <header><span class="mark">&gt;&gt;</span><h1 id="chat-title">Main</h1><span class="sub">Dave’s NanoClaw agent</span><button id="logout" type="button">Log out</button></header>
    <main id="messages" aria-live="polite"><div class="empty">Message NanoClaw directly.<br>Contest Scout and your other tools are available here.</div><div id="activity" class="activity" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="activity-text"></span></div></main>
    <footer>
      <form id="form"><textarea id="input" rows="1" maxlength="8000" placeholder="Ask NanoClaw…" aria-label="Message" required></textarea><button id="send">Send</button></form>
      <div id="status">Connecting…</div>
    </footer>
  </div>
  <script>
    const list = document.getElementById('messages');
    const chatsNav = document.getElementById('chats');
    const chatTitle = document.getElementById('chat-title');
    const newChat = document.getElementById('new-chat');
    const logout = document.getElementById('logout');
    const input = document.getElementById('input');
    const form = document.getElementById('form');
    const button = document.getElementById('send');
    const status = document.getElementById('status');
    const activity = document.getElementById('activity');
    const activityText = document.getElementById('activity-text');
    const seen = new Set();
    let selected = location.hash.slice(1) || 'main';
    let chats = [];
    let sendingChat = null;
    let connected = null;
    let failure = '';
    const writeHeaders = { 'X-Webchat-Request': '1' };
    async function authFetch(url, options) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        location.replace('/chat/login');
        throw new Error('Sign in required');
      }
      return response;
    }
    function currentChat() { return chats.find((chat) => chat.id === selected); }
    function renderState() {
      const last = [...list.querySelectorAll('.row')].at(-1);
      const waiting = last?.classList.contains('user') ?? false;
      const age = waiting ? Date.now() - Date.parse(last.dataset.createdAt) : 0;
      const sending = sendingChat === selected;
      activity.hidden = !sending && !waiting;
      activityText.textContent = sending ? 'Sending message…' : age > 120000 ? 'No reply yet. Check back here later.' : age > 30000 ? 'Still waiting for NanoClaw…' : 'NanoClaw is working…';
      status.textContent = failure || (sending ? 'Sending…' : waiting ? 'Message received · waiting for reply' : connected === null ? 'Connecting…' : connected ? 'Connected' : 'Reconnecting…');
    }
    function renderChats() {
      chatsNav.replaceChildren();
      for (const chat of chats) {
        const item = document.createElement('div');
        item.className = 'chat-item' + (chat.id === selected ? ' active' : '');
        const select = document.createElement('button');
        select.type = 'button'; select.className = 'chat-select';
        select.textContent = chat.id === 'main' ? '◆ Main' : chat.title;
        select.title = chat.title;
        select.onclick = () => selectChat(chat.id);
        item.append(select);
        if (chat.id !== 'main') {
          const remove = document.createElement('button');
          remove.type = 'button'; remove.className = 'chat-delete';
          remove.textContent = '×'; remove.title = 'Delete ' + chat.title;
          remove.setAttribute('aria-label', 'Delete ' + chat.title);
          remove.onclick = () => deleteChat(chat);
          item.append(remove);
        }
        chatsNav.append(item);
      }
      chatTitle.textContent = currentChat()?.title || 'Main';
    }
    async function loadChats() {
      const r = await authFetch('/chat/api/chats');
      if (!r.ok) throw new Error('Could not load chats');
      chats = (await r.json()).chats;
      if (!currentChat()) {
        selected = 'main';
        history.replaceState(null, '', '#main');
      }
      renderChats();
    }
    function clearMessages() {
      list.querySelectorAll('.row, .empty').forEach((node) => node.remove());
      seen.clear();
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = selected === 'main' ? 'Main chat with NanoClaw.' : 'A fresh conversation with NanoClaw.';
      list.insertBefore(empty, activity);
      renderState();
    }
    async function selectChat(id) {
      selected = id;
      history.replaceState(null, '', '#' + id);
      failure = '';
      clearMessages();
      renderChats();
      await loadMessages(id);
    }
    function show(message) {
      if (seen.has(message.id)) return;
      seen.add(message.id);
      list.querySelector('.empty')?.remove();
      const row = document.createElement('div');
      row.className = 'row ' + (message.role === 'user' ? 'user' : 'assistant');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const text = String(message.text);
      const re = /https?:\/\/[^\s<>]+/g;
      let offset = 0;
      for (const match of text.matchAll(re)) {
        bubble.append(document.createTextNode(text.slice(offset, match.index)));
        const a = document.createElement('a');
        a.href = match[0]; a.textContent = match[0]; a.target = '_blank'; a.rel = 'noopener noreferrer';
        bubble.append(a);
        offset = match.index + match[0].length;
      }
      bubble.append(document.createTextNode(text.slice(offset)));
      row.append(bubble);
      row.dataset.createdAt = message.created_at;
      const next = [...list.querySelectorAll('.row')].find((item) => item.dataset.createdAt > message.created_at);
      list.insertBefore(row, next || activity);
      failure = '';
      renderState();
      list.scrollTop = list.scrollHeight;
    }
    async function loadMessages(id = selected) {
      const r = await authFetch('/chat/api/chats/' + id + '/messages');
      if (!r.ok) throw new Error('History unavailable');
      if (id !== selected) return;
      for (const message of (await r.json()).messages) show(message);
    }
    loadChats().then(() => loadMessages()).catch((error) => { failure = error.message; renderState(); });
    const events = new EventSource('/chat/events');
    events.onopen = () => { connected = true; renderState(); loadChats().then(() => loadMessages()).catch(() => {}); };
    events.onerror = () => { connected = false; renderState(); loadChats().catch(() => {}); };
    events.onmessage = (event) => {
      const update = JSON.parse(event.data);
      if (update.type === 'message') {
        if (update.chat_id === selected) show(update.message);
        loadChats().catch(() => {});
      } else if (update.type === 'chat-deleted') {
        if (update.chat_id === selected) selectChat('main').catch(() => {});
        loadChats().catch(() => {});
      } else if (update.type === 'chats-changed') loadChats().catch(() => {});
    };
    setInterval(renderState, 10000);
    newChat.onclick = async () => {
      newChat.disabled = true;
      try {
        const r = await authFetch('/chat/api/chats', { method: 'POST', headers: writeHeaders });
        if (!r.ok) throw new Error((await r.json()).error || 'Could not create chat');
        const chat = await r.json();
        await loadChats();
        await selectChat(chat.id);
        input.focus();
      } catch (error) { failure = error.message; renderState(); }
      finally { newChat.disabled = false; }
    };
    async function deleteChat(chat) {
      if (!confirm('Delete “' + chat.title + '” and its NanoClaw conversation?')) return;
      try {
        const r = await authFetch('/chat/api/chats/' + chat.id, { method: 'DELETE', headers: writeHeaders });
        if (!r.ok) throw new Error((await r.json()).error || 'Could not delete chat');
        if (selected === chat.id) await selectChat('main');
        await loadChats();
      } catch (error) { failure = error.message; renderState(); }
    }
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const id = selected;
      button.disabled = true; sendingChat = id; failure = ''; renderState();
      try {
        const r = await authFetch('/chat/api/chats/' + id + '/messages', { method: 'POST', headers: { ...writeHeaders, 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        if (!r.ok) throw new Error((await r.json()).error || 'Send failed');
        const message = await r.json();
        if (id === selected) show(message);
        if (id === selected && input.value.trim() === text) input.value = '';
      } catch (error) { if (id === selected) failure = error.message; }
      finally { sendingChat = null; button.disabled = false; renderState(); input.focus(); }
    });
    logout.onclick = async () => {
      logout.disabled = true;
      try {
        const r = await fetch('/chat/logout', { method: 'POST', headers: writeHeaders });
        if (!r.ok) throw new Error('Could not sign out');
        location.replace('/chat/login');
      } catch (error) { failure = error.message; renderState(); logout.disabled = false; }
    };
  </script>
</body>
</html>
