apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rfd-notify-egress
  namespace: argo-workflows
spec:
  description: Allow RFD Notify to reach DNS, RedFlagDeals, and Gotify.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rfd-notify
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: forums.redflagdeals.com
              - matchName: gotify.davegallant.ca
    - toFQDNs:
        - matchName: forums.redflagdeals.com
        - matchName: gotify.davegallant.ca
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
