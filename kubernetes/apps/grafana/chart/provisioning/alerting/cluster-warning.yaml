apiVersion: 1

# Warning tier for node disk, mirroring the /var > 90% critical rule in
# cluster-critical.yaml. Fires earlier (85%, matching the kubelet image-GC trigger) so a filling disk pages
# before it becomes critical. Same query, same datasource, same shape.
groups:
  - orgId: 1
    name: cluster-warning
    folder: Homelab
    interval: 1m
    rules:
      - uid: k8s_node_var_filesystem_warning
        title: Kubernetes node /var filling up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: >-
                100 * (1 - (node_filesystem_avail_bytes{job="node-exporter",
                cluster="homelab", mountpoint="/var", fstype!="rootfs"} /
                node_filesystem_size_bytes{job="node-exporter",
                cluster="homelab", mountpoint="/var", fstype!="rootfs"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: A Kubernetes node /var filesystem is over 85% full.
          description: '{{ $labels.node }} ({{ $labels.instance }}) /var usage has been above 85% for at least five minutes.'
        labels:
          severity: warning
          service: kubernetes
        isPaused: false

      - uid: k8s_node_var_inode_warning
        title: Kubernetes node /var running low on inodes
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: >-
                100 * (1 - (node_filesystem_files_free{job="node-exporter", cluster="homelab",
                mountpoint="/var", fstype!="rootfs"} / node_filesystem_files{job="node-exporter",
                cluster="homelab", mountpoint="/var", fstype!="rootfs"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: A Kubernetes node /var filesystem is over 80% inode use.
          description: '{{ $labels.node }} ({{ $labels.instance }}) /var inode use has been above 80% for at least five minutes.'
        labels:
          severity: warning
          service: kubernetes
        isPaused: false
