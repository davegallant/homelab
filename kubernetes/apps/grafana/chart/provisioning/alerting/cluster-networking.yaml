apiVersion: 1

groups:
  - orgId: 1
    name: cluster-networking
    folder: Homelab
    interval: 1m
    rules:
      - uid: cilium_workload_tcp_policy_drops
        title: Kubernetes workload TCP policy drops
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: >-
                sum by (source) (
                  increase(hubble_drop_total{
                    job="prometheus.scrape.annotated_services",
                    reason=~"POLICY_DENIED|POLICY_DENY",
                    protocol="TCP",
                    source!="",
                    destination!~"^(api\\.fossorial\\.io|13\\.223\\.241\\.208|98\\.85\\.9\\.165)$"
                  }[5m])
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: >-
            Cilium denied more than 10 TCP flows involving
            {{ $labels.source }} in five minutes.
          description: >-
            Cilium denied more than 10 TCP flows involving workload
            {{ $labels.source }} in each of the last five minutes. Inspect the
            Hubble dashboard and Loki dropped-flow logs for destination and
            drop reason.
        labels:
          severity: warning
          service: cilium
        isPaused: false

      - uid: coredns_servfail_responses
        title: CoreDNS SERVFAIL rate is elevated
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              editorMode: code
              expr: >-
                (
                  sum by (instance) (
                    increase(coredns_dns_responses_total{
                      job="prometheus.scrape.annotated_services",
                      service="kube-dns",
                      rcode="SERVFAIL"
                    }[5m])
                  )
                )
                and on (instance)
                (
                  sum by (instance) (
                    increase(coredns_dns_responses_total{
                      job="prometheus.scrape.annotated_services",
                      service="kube-dns",
                      rcode="SERVFAIL"
                    }[5m])
                  )
                  /
                  sum by (instance) (
                    increase(coredns_dns_responses_total{
                      job="prometheus.scrape.annotated_services",
                      service="kube-dns"
                    }[5m])
                  )
                  > 0.05
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: CoreDNS is returning an elevated rate of SERVFAIL responses.
          description: >-
            More than 10 responses and over 5% of DNS responses from CoreDNS on
            {{ $labels.instance }} were SERVFAIL in the last five minutes.
            Isolated blocked-domain responses are excluded. Check CoreDNS logs
            and the DNS resolver health checks.
        labels:
          severity: warning
          service: dns
        isPaused: false
