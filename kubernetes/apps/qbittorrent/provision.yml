---
- name: Provision qbittorrent external resources
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../ansible/group_vars/all/secrets.yaml
  vars:
    talos_kube_context: homelab
  tasks:
    - name: Require Vault credentials
      ansible.builtin.assert:
        that:
          - qbittorrent_webui_username | length > 0
          - qbittorrent_webui_password | length > 0
          - qbittorrent_webui_login_password | length > 0
          - cloudflare_dns_api_token | length > 0
      no_log: true

    - name: Apply namespace and NFS storage
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            apply,
            -f,
            "{{ playbook_dir }}/storage.yaml",
          ]
      changed_when: true

    - name: Read the existing notification script without exposing its contents
      ansible.builtin.command:
        argv:
          [
            ssh,
            -o,
            BatchMode=yes,
            root@qbittorrent,
            base64 -w0 /root/scripts/notify.sh,
          ]
      register: qbittorrent_notify
      changed_when: false
      no_log: true

    - name: Apply external configuration Secret from Vault
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            apply,
            --server-side,
            --field-manager=ansible-vault,
            -f,
            "-",
          ]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'qbittorrent-config-external', 'namespace': 'qbittorrent'},
              'type': 'Opaque',
              'stringData': {'qbittorrent.conf': lookup('ansible.builtin.template', playbook_dir + '/qbittorrent.conf.j2')}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply external scripts Secret
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            apply,
            --server-side,
            --field-manager=ansible-vault,
            -f,
            "-",
          ]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'qbittorrent-scripts-external', 'namespace': 'qbittorrent'},
              'type': 'Opaque',
              'data': {'notify.sh': qbittorrent_notify.stdout,
                             'block-malware.sh': lookup('ansible.builtin.file',
                               playbook_dir + '/scripts/block-malware.sh', rstrip=false) | b64encode}} | to_json }}
      changed_when: true
      no_log: true

    - name: Apply the external Caddy credential
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            apply,
            --server-side,
            --field-manager=ansible-vault,
            -f,
            "-",
          ]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'qbittorrent-caddy-external', 'namespace': 'qbittorrent'},
              'type': 'Opaque', 'stringData': {'cloudflare_api_token': cloudflare_dns_api_token}} | to_json }}
      changed_when: true
      no_log: true

    - name: Check for an existing registration Secret
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            -n,
            qbittorrent,
            get,
            secret,
            qbittorrent-tailscale-auth,
            --ignore-not-found,
            -o,
            name,
          ]
      register: qbittorrent_registration
      changed_when: false

    - name: Create a one-use tagged Headscale registration key
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - root@vps
          - docker exec headscale headscale preauthkeys create --user 1 --tags tag:monitored --expiration 1h -o json
      register: qbittorrent_auth
      when: qbittorrent_registration.stdout | length == 0
      changed_when: true
      no_log: true

    - name: Apply the one-use registration Secret
      ansible.builtin.command:
        argv:
          [
            kubectl,
            --context,
            "{{ talos_kube_context }}",
            apply,
            --server-side,
            --field-manager=ansible-vault,
            -f,
            "-",
          ]
        stdin: >-
          {{ {'apiVersion': 'v1', 'kind': 'Secret',
              'metadata': {'name': 'qbittorrent-tailscale-auth', 'namespace': 'qbittorrent'},
              'type': 'Opaque', 'stringData': {'TS_AUTHKEY': (qbittorrent_auth.stdout | from_json).key}} | to_json }}
      when: qbittorrent_registration.stdout | length == 0
      changed_when: true
      no_log: true
