---
# WebUI-only build, Gateway-only inbound. Sidecars (tailscale + caddy) removed 2026-10-28; WebUI via central tailnet-gateway. No peer Service or egress gateway policy is enabled.
controllers:
  qbittorrent:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        backup.velero.io/backup-volumes: config
        backup.velero.io/backup-volumes-excludes: downloads
    containers:
      app:
        image:
          repository: docker.io/linuxserver/qbittorrent
          tag: 5.3.0
          digest: sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        env:
          PUID: '1000'
          PGID: '1000'
          TZ: Etc/UTC
          WEBUI_PORT: '8080'
          QBITTORRENT_VERSION: 5.3.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - KILL
              - SETGID
              - SETUID
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
    initContainers:
      bootstrap:
        image:
          repository: docker.io/linuxserver/qbittorrent
          tag: 5.3.0
          digest: sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
        command:
          - /bin/bash
          - -ec
        args:
          - |
            install -d -o 1000 -g 1000 /config/qBittorrent
            if [ ! -f /config/qBittorrent/qBittorrent.conf ]; then
              install -o 1000 -g 1000 -m 0640 /bootstrap/qbittorrent.conf /config/qBittorrent/qBittorrent.conf
            fi
            if [ ! -f /config/qBittorrent/dracula/.revision ]; then
              curl --fail --silent --show-error --location \
                https://codeload.github.com/dracula/qbittorrent/tar.gz/9020f6eb457087270179beb86d45914d434adb6b \
                --output /tmp/dracula.tar.gz
              install -d /config/qBittorrent/dracula
              tar -xzf /tmp/dracula.tar.gz -C /config/qBittorrent/dracula --strip-components=1
              echo 9020f6eb457087270179beb86d45914d434adb6b > /config/qBittorrent/dracula/.revision
              chown -R 1000:1000 /config/qBittorrent/dracula
            fi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
service:
  qbittorrent:
    controller: qbittorrent
    ports:
      http:
        port: 8080
persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: qbittorrent-config
    advancedMounts:
      qbittorrent:
        app:
          - path: /config
        bootstrap:
          - path: /config
  downloads:
    type: persistentVolumeClaim
    existingClaim: qbittorrent-downloads
    advancedMounts:
      qbittorrent:
        app:
          - path: /mnt/torrents
            subPath: torrents
  bootstrap-config:
    type: secret
    name: qbittorrent-config-external
    advancedMounts:
      qbittorrent:
        bootstrap:
          - path: /bootstrap
            readOnly: true
  scripts:
    type: secret
    name: qbittorrent-scripts-external
    items:
      - key: block-malware.sh
        path: block-malware.sh
        mode: 488
      - key: notify.sh
        path: notify.sh
        mode: 420
    advancedMounts:
      qbittorrent:
        app:
          - path: /scripts
            readOnly: true
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: qbittorrent
      spec:
        description: 'WebUI-only build: default deny ingress with DNS, Tailscale/Cloudflare egress. NOT a verified gateway-only or fail-closed policy.'
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lidarr
            toPorts:
              - ports:
                  - port: '8080'
                    protocol: TCP
          - fromEntities:
              - world
            toPorts:
              - ports:
                  - port: '41641'
                    protocol: UDP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: '53'
                    protocol: UDP
                  - port: '53'
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: qbittorrent
          - toCIDR:
              - 192.168.1.0/24
            toPorts:
              - ports:
                  - port: '41641'
                    protocol: UDP
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 10.96.0.0/12
              - 10.245.0.0/16
