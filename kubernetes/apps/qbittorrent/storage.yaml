# Namespace and NFS PV/PVC are hand-applied; pending Argo adoption.
---
apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-downloads
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: truenas-qbittorrent-downloads
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ''
  volumeName: qbittorrent-downloads
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-pool
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true
    volumeHandle: cinema-qbittorrent-pool
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-pool
  namespace: qbittorrent
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ''
  volumeName: qbittorrent-pool
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-torrents
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: cinema-qbittorrent-torrents
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool/torrents
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-torrents
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ''
  volumeName: qbittorrent-torrents
  resources:
    requests:
      storage: 1Ti
