---
# Radarr — Argo CD production values (bjw-s app-template 5.3.0).
# Workload definition: this file, rendered by the bjw-s app-template chart.
# (app docker.io/linuxserver/radarr 6.4.4, port 7878; config on a
# local volume, the shared media tree at /mnt).
# Tailnet HTTPS is served by the central Gateway. qBittorrent and
# Prowlarr are reached through their cluster Services.
#
# The media tree stays on TrueNAS (static NFS claim radarr-media,
# see storage.yaml), mounted at /mnt — the identical path the LXC
# uses, so every path in Radarr's database stays true and hardlink
# imports keep working (NFS link/rename are server-side within the
# export). It never moves and is never Velero-backed-up (TrueNAS
# snapshots + Drive sync).
#
# Radarr credentials and API key stay in its protected /config volume.
#
controllers:
  radarr:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the config volume only; the
        # NFS media tree is excluded by omission (TrueNAS snapshots
        # + Drive sync protect it, never Velero).
        backup.velero.io/backup-volumes: config-local
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/linuxserver/radarr
          tag: 6.4.4
          digest: sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
        env:
          PUID: "1000"
          PGID: "1000"
          UMASK: "002"
          TZ: Etc/UTC
          NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 7878
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 7878
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 7878
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  radarr:
    controller: radarr
    ports:
      http:
        port: 7878

persistence:
  config-local:
    type: persistentVolumeClaim
    existingClaim: radarr-config-local
    advancedMounts:
      radarr:
        app:
          - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: radarr-media
    advancedMounts:
      radarr:
        app:
          - path: /mnt

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: radarr
      spec:
        description: Default deny with metadata-fetch egress, cluster DNS, and Prowlarr access.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
          # Prowlarr pushes indexer results and syncs over the API.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: seerr
                  k8s:app.kubernetes.io/name: seerr
                  k8s:app.kubernetes.io/instance: seerr
                  k8s:app.kubernetes.io/controller: seerr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
          # The apps poll Prowlarr's Torznab feeds through this Service.
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEntities:
              - cluster
        egressDeny:
          # The world allow above must never become a LAN backdoor.
          - toCIDRSet:
              - cidr: 192.168.1.0/24
              - cidr: 10.96.0.0/12
              - cidr: 10.245.0.0/16

