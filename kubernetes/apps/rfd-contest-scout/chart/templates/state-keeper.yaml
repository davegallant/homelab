apiVersion: apps/v1
kind: Deployment
metadata:
  name: rfd-contest-scout-state-keeper
  namespace: argo-workflows
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rfd-contest-scout-state-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rfd-contest-scout-state-keeper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: state-keeper
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, -B, -c, "import signal; signal.pause()"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - import os; assert os.path.ismount("/state")
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - import os; assert os.path.ismount("/state")
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.state.claimName }}
