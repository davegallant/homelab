---
# Namespace for seerr, applied once by hand and
# deliberately NOT managed by Argo CD: the homelab AppProject allows
# namespace-scoped resources only, so namespaces stay an Ansible /
# kubectl concern. The PVCs themselves are chart-managed
# (local-path, dynamically provisioned) — nothing else lives here.
apiVersion: v1
kind: Namespace
metadata:
  name: seerr
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
