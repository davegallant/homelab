---
# Seerr — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. Seerr uses
# ghcr.io/seerr-team/seerr v3.5.1 on port 5055.
# Tailnet access is provided by the shared Gateway.
controllers:
  seerr:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the app config volume only.
        backup.velero.io/backup-volumes: config-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.1
          digest: sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
        env:
          LOG_LEVEL: debug
          TZ: America/Toronto
        probes:
          startup:
            enabled: true
            type: TCP
            port: 5055
            spec:
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            type: HTTP
            path: /api/v1/status
            port: 5055
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /api/v1/status
            port: 5055
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  seerr:
    controller: seerr
    ports:
      http:
        port: 5055

persistence:
  # Keep the original hostPath-backed claim present for rollback. It is
  # deliberately unmounted; Velero cannot make a PodVolumeBackup from it.
  config:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      seerr:
        app:
          - path: /mnt/seerr-rollback-config
            readOnly: true
  config-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      seerr:
        app:
          - path: /app/config

  tmp:
    type: emptyDir
    advancedMounts:
      seerr:
        app:
          - path: /tmp

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: seerr
      spec:
        description: Default deny with Tailscale, Cloudflare, and Seerr HTTPS API egress.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: seerr
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: seerr
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
                  k8s:app.kubernetes.io/name: radarr
                  k8s:app.kubernetes.io/instance: radarr
                  k8s:app.kubernetes.io/controller: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
                  k8s:app.kubernetes.io/name: sonarr
                  k8s:app.kubernetes.io/instance: sonarr
                  k8s:app.kubernetes.io/controller: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "3478"
                    protocol: UDP
                  - port: "41641"
                    protocol: UDP
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
