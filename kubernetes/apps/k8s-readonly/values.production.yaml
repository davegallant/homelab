---
# k8s-readonly — Argo CD production values (bjw-s app-template 5.3.0).
# Tailnet-only read-only Kubernetes API proxy, for Tux's Velero/PV audit.
#
# Chain: Tux (tailnet, via tunnel proxy)
#   -> tailnet-gateway at 100.100.0.8 -> Gateway TLS termination
#   -> Service port 8001 -> kubectl proxy on 0.0.0.0:8001 (default filter, NO
#      --disable-filter, so writes are rejected by the proxy itself)
#   -> https://kubernetes.default.svc with the pod's ServiceAccount
#      token, whose RBAC is rbac.yaml (get/list/watch only, no secrets).
#
# Access remains tailnet-only. There is NO public URL and NO Pangolin
# resource. The inbound Tailscale and Caddy sidecars have been removed.
#
# kubectl is pinned to the Kubernetes 1.37.2 client (matching the
# cluster minor) and its verified linux/amd64 manifest digest.
#
# There is deliberately no app Secret: the API auth is the pod's
# ServiceAccount token (rbac.yaml), mounted by Kubernetes itself.
controllers:
  k8s-readonly:
    type: deployment
    strategy: Recreate
    serviceAccount:
      name: k8s-readonly
    pod:
      # The proxy container needs the ServiceAccount token.
      # serviceAccount.name above (controllers.k8s-readonly.serviceAccount.name,
      # fixed by the 2026-10-24 Codex render check - pod.serviceAccountName
      # is rejected by app-template 5.3.0) selects the SA; automount here
      # mounts it into the pod. The token's RBAC is read-only and has no
      # secrets access or write permissions.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k8s-w-2
      annotations:
        # This pod holds no backed-up data.
        backup.velero.io/backup-volumes: ""
    containers:
      proxy:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image:
          repository: registry.k8s.io/kubectl
          tag: v1.37.2
          digest: sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
        command:
          - kubectl
        args:
          - proxy
          - --address=0.0.0.0
          - --port=8001
          - --api-prefix=/
          # The Gateway preserves the original Host, while kubectl proxy
          # defaults to localhost-only. Allow the app hostname and loopback.
          - '--accept-hosts=^(localhost|127\.0\.0\.1|\[::1\]|k8s-readonly\.tail\.davegallant\.ca)$'
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
service:
  k8s-readonly:
    controller: k8s-readonly
    ports:
      https:
        port: 8001

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: k8s-readonly
      spec:
        description: >
          Default deny for the readonly API proxy. Ingress is via the
          Tailscale sidecar TCPForward to localhost Caddy, not via
          cluster networking, so no pod ingress is allowed. Egress is
          DNS and the in-cluster API server. No external destinations
          are permitted without Hubble evidence.
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEntities:
              - cluster
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
