---
# k8s-readonly namespace. Applied by hand BEFORE the Argo CD sync:
# the homelab AppProject has an empty clusterResourceWhitelist, so
# Argo CD cannot create Namespaces (or ClusterRoles) for this app.
# Same split as Forgejo's namespace.yaml and Homepage's hand-applied
# storage: namespace + RBAC by hand, workload via Argo CD only.
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-readonly
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
