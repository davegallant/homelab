{{- if or (not .Values.application) (not .Values.targetNamespace) }}
{{- fail "application and targetNamespace are required" }}
{{- end }}
{{- if gt (len .Values.application) 54 }}
{{- fail "application must be at most 54 characters" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-{{ .Values.application }}-backup
  namespace: {{ .Values.gateNamespace }}
  labels:
    velero.io/exclude-from-backup: "true"
    homelab.davegallant.ca/pre-sync-app: {{ .Values.application | quote }}
  annotations:
    homelab.davegallant.ca/pre-sync-backup: "true"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    metadata:
      labels:
        velero.io/exclude-from-backup: "true"
        homelab.davegallant.ca/pre-sync-app: {{ .Values.application | quote }}
    spec:
      restartPolicy: Never
      serviceAccountName: presync-{{ .Values.application }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-argocd-client
          image: {{ .Values.argocdImage | quote }}
          command: [sh, -c, "cp /usr/local/bin/argocd /tools/argocd"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 300Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 500Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: backup
          image: {{ .Values.image | quote }}
          command: [python3, /app/presync_orchestration.py]
          env:
            - name: PATH
              value: /tools:/usr/local/bin:/usr/bin:/bin
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: ARGOCD_SERVER
              value: argocd-server.argocd.svc:8080
            - name: ARGOCD_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: presync-gate-argocd
                  key: token
            - name: PRESYNC_NAMESPACE
              value: {{ .Values.targetNamespace | quote }}
            - name: PRESYNC_APPLICATION
              value: {{ .Values.application | quote }}
            - name: PRESYNC_SCHEDULE
              value: {{ .Values.scheduleName | quote }}
            - name: PRESYNC_REQUIRED_HOOKS
              value: {{ .Values.requiredHooks | toJson | quote }}
            - name: PRESYNC_EXCLUDED_VOLUMES
              value: {{ .Values.excludedVolumes | toJson | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 500Mi
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tools
          emptyDir:
            sizeLimit: 300Mi
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: code
          configMap:
            name: presync-gate-code
