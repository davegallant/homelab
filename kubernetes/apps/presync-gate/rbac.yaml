---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: presync-miniflux
  namespace: miniflux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presync-miniflux
  namespace: miniflux
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [miniflux-db]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presync-miniflux
  namespace: miniflux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presync-miniflux
subjects:
  - kind: ServiceAccount
    name: presync-miniflux
    namespace: miniflux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presync-miniflux
  namespace: velero
rules:
  - apiGroups: [velero.io]
    resources: [schedules]
    resourceNames: [miniflux-daily]
    verbs: [get]
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [create, get]
  - apiGroups: [velero.io]
    resources: [podvolumebackups]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presync-miniflux
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presync-miniflux
subjects:
  - kind: ServiceAccount
    name: presync-miniflux
    namespace: miniflux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: presync-miniflux
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [miniflux]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: presync-miniflux
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: presync-miniflux
subjects:
  - kind: ServiceAccount
    name: presync-miniflux
    namespace: miniflux
