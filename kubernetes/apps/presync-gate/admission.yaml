  validations:
  - message: Pre-sync Jobs may create only their registered seven-day namespace backup.
    expression: >-
      object.metadata.namespace == "velero" && has(object.metadata.labels) && "homelab.davegallant.ca/pre-sync-app" in object.metadata.labels

      && "homelab.davegallant.ca/pre-sync-namespace" in object.metadata.labels && request.userInfo.username ==

      "system:serviceaccount:presync-gate:presync-" + object.metadata.labels["homelab.davegallant.ca/pre-sync-app"] &&

      (object.metadata.labels["homelab.davegallant.ca/pre-sync-app"] + "/" +

      object.metadata.labels["homelab.davegallant.ca/pre-sync-namespace"]) in ["argocd/argocd", "audiobookshelf/audiobookshelf",

