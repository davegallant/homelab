---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miniflux-presync-backup-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [velero.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [backups]
  matchConditions:
    - name: miniflux-gate-service-account
      expression: 'request.userInfo.username == "system:serviceaccount:miniflux:presync-miniflux"'
  validations:
    - message: The Miniflux gate may only create its approved seven-day backup.
      expression: >-
        object.metadata.namespace == "velero" &&
        object.spec.includedNamespaces == ["miniflux"] &&
        object.spec.excludedResources == ["secrets"] &&
        has(object.spec.defaultVolumesToFsBackup) && !object.spec.defaultVolumesToFsBackup &&
        has(object.spec.snapshotVolumes) && !object.spec.snapshotVolumes &&
        object.spec.storageLocation == "default" && object.spec.ttl == "168h" &&
        !has(object.spec.hooks) && !has(object.spec.resourcePolicy) &&
        !has(object.spec.includeClusterResources) &&
        !has(object.spec.includedClusterScopedResources) &&
        !has(object.spec.excludedClusterScopedResources) &&
        !has(object.spec.includedNamespaceScopedResources) &&
        !has(object.spec.excludedNamespaceScopedResources) &&
        !has(object.spec.includedResources) &&
        !has(object.spec.excludedNamespaces) &&
        !has(object.spec.labelSelector) && !has(object.spec.orLabelSelectors) &&
        !has(object.spec.orderedResources) && !has(object.spec.snapshotMoveData) &&
        !has(object.spec.volumeSnapshotLocations) && !has(object.spec.uploaderConfig) &&
        !has(object.spec.datamover) && !has(object.spec.volumeGroupSnapshotLabelKey)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: miniflux-presync-backup-scope
spec:
  policyName: miniflux-presync-backup-scope
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miniflux-presync-pod-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: miniflux-pods
      expression: 'request.namespace == "miniflux"'
  validations:
    - message: The Miniflux pre-sync label and service account are reserved for the gate Job.
      expression: >-
        (!(has(object.metadata.labels) &&
           "homelab.davegallant.ca/presync-gate" in object.metadata.labels &&
           object.metadata.labels["homelab.davegallant.ca/presync-gate"] == "miniflux") &&
         object.spec.serviceAccountName != "presync-miniflux") ||
        (has(object.metadata.labels) &&
         "homelab.davegallant.ca/presync-gate" in object.metadata.labels &&
         object.metadata.labels["homelab.davegallant.ca/presync-gate"] == "miniflux" &&
         object.spec.serviceAccountName == "presync-miniflux" &&
         (request.userInfo.username == "system:serviceaccount:kube-system:job-controller" ||
          request.userInfo.username == "system:kube-controller-manager") &&
         has(object.metadata.ownerReferences) &&
         object.metadata.ownerReferences.exists(o,
           o.apiVersion == "batch/v1" && o.kind == "Job" &&
           o.name == "miniflux-presync-backup" && has(o.controller) && o.controller))
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: miniflux-presync-pod-identity
spec:
  policyName: miniflux-presync-pod-identity
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: miniflux-presync-job-identity
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  matchConditions:
    - name: miniflux-jobs
      expression: 'request.namespace == "miniflux"'
  validations:
    - message: Only Argo CD may create or update the reserved Miniflux pre-sync Job.
      expression: >-
        (object.metadata.name != "miniflux-presync-backup" &&
         (!has(object.spec.template.spec.serviceAccountName) ||
          object.spec.template.spec.serviceAccountName != "presync-miniflux") &&
         !(has(object.spec.template.metadata.labels) &&
           "homelab.davegallant.ca/presync-gate" in object.spec.template.metadata.labels &&
           object.spec.template.metadata.labels["homelab.davegallant.ca/presync-gate"] == "miniflux")) ||
        (object.metadata.name == "miniflux-presync-backup" &&
         has(object.spec.template.spec.serviceAccountName) &&
         object.spec.template.spec.serviceAccountName == "presync-miniflux" &&
         request.userInfo.username == "system:serviceaccount:argocd:argocd-application-controller")
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: miniflux-presync-job-identity
spec:
  policyName: miniflux-presync-job-identity
  validationActions: [Deny]
