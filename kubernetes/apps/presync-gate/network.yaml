---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: presync-miniflux-egress
  namespace: miniflux
spec:
  description: Allow the Miniflux pre-sync gate to reach Kubernetes and Argo.
  endpointSelector:
    matchLabels:
      homelab.davegallant.ca/presync-gate: miniflux
  ingress:
    - {}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/name: argocd-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: presync-miniflux-argocd-ingress
  namespace: argocd
spec:
  description: Allow the Miniflux pre-sync gate to compare the previous Argo application revision.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            k8s:homelab.davegallant.ca/presync-gate: miniflux
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
