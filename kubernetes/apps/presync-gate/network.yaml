apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: presync-gate-egress
  namespace: presync-gate
spec:
  description: Allow pre-sync Jobs to reach Kubernetes, DNS, and the Argo CD API.
  endpointSelector: {}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/name: argocd-server
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: presync-gate-argocd-ingress
  namespace: argocd
spec:
  description: Allow the gate namespace to compare Argo Application baselines.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: argocd-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: presync-gate
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
