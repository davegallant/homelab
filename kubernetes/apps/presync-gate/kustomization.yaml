apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admission.yaml
  - network.yaml
  - miniflux-default-deny.yaml
  - rbac.yaml
configMapGenerator:
  - name: presync-miniflux-code
    namespace: miniflux
    files:
      - presync_coverage.py
      - presync_orchestration.py
generatorOptions:
  disableNameSuffixHash: true
