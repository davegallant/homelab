---
# Sonarr — Argo CD production values (bjw-s app-template 5.3.0).
# Workload definition: this file, rendered by the bjw-s app-template chart.
# (app docker.io/linuxserver/sonarr 4.0.20, port 8989; config on a
# local volume, the shared media tree at /mnt).
# Tailnet HTTPS is served by the central Gateway. qBittorrent and
# Prowlarr are reached through their cluster Services.
#
# The media tree stays on TrueNAS (static NFS claim sonarr-media,
# see storage.yaml), mounted at /mnt — the identical path the LXC
# uses, so every path in Sonarr's database stays true and hardlink
# imports keep working (NFS link/rename are server-side within the
# export). It never moves and is never Velero-backed-up (TrueNAS
# snapshots + Drive sync).
#
# Sonarr credentials and API key stay in its protected /config volume.
#
controllers:
  sonarr:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the config volume only; the
        # NFS media tree is excluded by omission (TrueNAS snapshots
        # + Drive sync protect it, never Velero).
        backup.velero.io/backup-volumes: config-local
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/linuxserver/sonarr
          tag: 4.0.20
          digest: sha256:889dcc58c6aea859033985894b519b2e6b1e55d92527ed123f9f52e42ae7c97b
        env:
          PUID: "1000"
          PGID: "1000"
          UMASK: "002"
          TZ: Etc/UTC
          NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8989
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8989
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 8989
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  sonarr:
    controller: sonarr
    ports:
      http:
        port: 8989

persistence:
  config-local:
    type: persistentVolumeClaim
    existingClaim: sonarr-config-local
    advancedMounts:
      sonarr:
        app:
          - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: sonarr-media
    advancedMounts:
      sonarr:
        app:
          - path: /mnt

rawResources:
  daily:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: sonarr-daily
        namespace: velero
      spec:
        schedule: "20 4 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - sonarr
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default

  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: sonarr
      spec:
        description: Default deny with metadata-fetch egress, cluster DNS, and Prowlarr access.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
          # Prowlarr pushes indexer results and syncs over the API.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: seerr
                  k8s:app.kubernetes.io/name: seerr
                  k8s:app.kubernetes.io/instance: seerr
                  k8s:app.kubernetes.io/controller: seerr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
          # The apps poll Prowlarr's Torznab feeds through this Service.
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEntities:
              - cluster
          - toEntities:
              - world
        egressDeny:
          # The world allow above must never become a LAN backdoor.
          - toCIDRSet:
              - cidr: 192.168.1.0/24
              - cidr: 10.96.0.0/12
              - cidr: 10.245.0.0/16
