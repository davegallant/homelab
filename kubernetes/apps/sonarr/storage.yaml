---
# Storage for sonarr, applied once by hand and
# deliberately NOT managed by Argo CD: the homelab AppProject allows
# namespace-scoped resources only, so namespaces and static volumes
# stay an Ansible / kubectl concern.
#
# Two volume families, two different natures:
#   sonarr-media  - the shared media tree, a static NFS PV onto the
#                   existing TrueNAS export the *arr LXCs and
#                   qBittorrent read today, mounted at /mnt — the
#                   identical path, so database paths stay true and
#                   hardlink imports keep working (NFS link/rename
#                   are server-side within the export). Read-write,
#                   matching the LXC mount. The data never moves and
#                   is never Velero-backed-up (TrueNAS snapshots +
#                   Drive sync, same as Kiwix and RomM).
#   app state     - config is a chart-managed local-path PVC
#                   declared in values.production.yaml; nothing
#                   lives here.
#
# VERIFY BEFORE APPLYING (README step 0): the share below follows
# the house spelling (/mnt/tank/media) — confirm against the LXC's
# actual mount (`findmnt /mnt` on the sonarr LXC) and correct it if
# the tree is a different export. If /mnt on the LXC spans several
# exports, create one PV per export and mount them under /mnt with
# subPath entries in the values instead; the in-pod tree must be
# identical either way.
apiVersion: v1
kind: Namespace
metadata:
  name: sonarr
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-media
spec:
  capacity:
    storage: 1Ti # nominal; NFS reports the export's real size
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: truenas-sonarr-media
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-media
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: sonarr-media
  resources:
    requests:
      storage: 1Ti

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-config-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-8553bded-5ad2-4550-8c9f-665234171b70_sonarr_sonarr-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1
  claimRef:
    namespace: sonarr
    name: sonarr-config-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config-local
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pve-g3-1-local
  volumeName: sonarr-config-local
  resources:
    requests:
      storage: 5Gi
