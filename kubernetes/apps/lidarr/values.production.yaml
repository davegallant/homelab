---
# Lidarr — Argo CD production values (bjw-s app-template 5.3.0).
# Workload definition: this file, rendered by the bjw-s app-template chart.
# (app docker.io/linuxserver/lidarr 3.1.0, port 8686; config on a
# local volume, the shared media tree at /mnt, plus the LXC's
# separate /music mount as a second static claim — storage.yaml).
# Tailnet-only: the central Cilium Gateway routes the existing
# tailnet hostname to the Lidarr Service on port 8686.
#
# qBittorrent runs in Kubernetes. The saved client endpoint uses its
# Kubernetes Service DNS name on port 8080. Cluster Service traffic
# does not use an HTTP proxy.
#
# The media tree stays on TrueNAS (static NFS claim lidarr-media,
# see storage.yaml), mounted at /mnt — the identical path the LXC
# uses, so every path in Lidarr's database stays true and hardlink
# imports keep working (NFS link/rename are server-side within the
# export). It never moves and is never Velero-backed-up (TrueNAS
# snapshots + Drive sync).
#
# There is deliberately no app Secret: Lidarr's API key and qBittorrent
# credentials live in its config.xml, which arrives with the copied
# /config.
#
controllers:
  lidarr:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the config volume only; the
        # NFS media tree is excluded by omission (TrueNAS snapshots
        # + Drive sync protect it, never Velero).
        backup.velero.io/backup-volumes: config-local
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/linuxserver/lidarr
          tag: 3.1.6
          digest: sha256:9fddcf5c613361edfce390d4e6b7c364282e71e90a40ce7793077fed788f6e63
        env:
          PUID: "1000"
          PGID: "1000"
          UMASK: "002"
          TZ: Etc/UTC
          NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8686
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8686
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 8686
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  lidarr:
    controller: lidarr
    ports:
      http:
        port: 8686

persistence:
  config-local:
    type: persistentVolumeClaim
    existingClaim: lidarr-config-local
    advancedMounts:
      lidarr:
        app:
          - path: /config
  media:
    type: persistentVolumeClaim
    existingClaim: lidarr-media
    advancedMounts:
      lidarr:
        app:
          - path: /mnt
  music:
    type: persistentVolumeClaim
    existingClaim: lidarr-music
    advancedMounts:
      lidarr:
        app:
          - path: /music
rawResources:
  daily:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: lidarr-daily
        namespace: velero
      spec:
        schedule: "50 4 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - lidarr
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default

  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: lidarr
      spec:
        description: Default deny with metadata-fetch egress, cluster DNS, and Prowlarr access.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lidarr
          # Prowlarr pushes indexer results and syncs over the API.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lidarr
          # The apps poll Prowlarr's Torznab feeds through this Service.
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEntities:
              - cluster
          - toEntities:
              - world
        egressDeny:
          # The world allow above must never become a LAN backdoor.
          - toCIDRSet:
              - cidr: 192.168.1.0/24
              - cidr: 10.96.0.0/12
              - cidr: 10.245.0.0/16
