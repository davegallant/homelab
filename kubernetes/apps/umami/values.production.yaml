---
# Umami — Argo CD production values (bjw-s app-template 5.3.0).
# Active workload definition: this file; the LXC Compose stack is retired.
# (app ghcr.io/umami-software/umami 3.4.0, port 3000; database
# docker.io/postgres 18.6 as a second container in the same pod, the
# Miniflux in-pod database pattern).
# Public via Pangolin: the retired LXC paired the app with a Newt sidecar,
# reproduced in-pod with the *same* Newt identity, so the existing
# Pangolin route and public URL carry over unchanged. Do not rewrite
# this app as tailnet-only.
#
# The only state is the Postgres data directory (chart-managed
# local-path PVC, volume db-data). The app itself is stateless.
#
# Secrets stay outside Git and outside Argo's ownership:
#   umami-newt-external  (PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET)
#                        — playbooks/talos-cluster/umami-secret.yml
#   umami-external       (DATABASE_URL, APP_SECRET, POSTGRES_USER,
#                         POSTGRES_PASSWORD) — same playbook
# DATABASE_URL is assembled by the secret playbook with host
# 127.0.0.1: the compose reaches the database by service name, in-pod
# it is the neighbouring container.
controllers:
  umami:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Opt-in filesystem backup of the database volume, with a
        # consistent logical dump written into the volume first so
        # the filesystem backup carries a restorable copy.
        backup.velero.io/backup-volumes: db-data-local
        pre.hook.backup.velero.io/container: db
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","PGPASSWORD=$POSTGRES_PASSWORD pg_dump -U $POSTGRES_USER
          -d $POSTGRES_DB > /var/lib/postgresql/umami-backup.sql"]'
    containers:
      app:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 65533
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: ghcr.io/umami-software/umami
          tag: 3.4.1
          digest: sha256:e69d1a7932e9dab0fc523edc7be1f3a53f3c261f57856fc2167ae74a8fc022e8
        envFrom:
          - secretRef:
              name: umami-external
        env:
          DATABASE_TYPE: postgresql
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /api/heartbeat
            port: 3000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /api/heartbeat
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /api/heartbeat
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      db:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: docker.io/library/postgres
          tag: "18.6"
          digest: sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        envFrom:
          - secretRef:
              name: umami-external
        env:
          POSTGRES_DB: umami
        probes:
          startup:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 88Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      newt:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        image:
          repository: docker.io/fosrl/newt
          tag: 1.19.1
          digest: sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
        envFrom:
          - secretRef:
              name: umami-newt-external
        env:
          HOME: /tmp
          XDG_CONFIG_HOME: /tmp/.config
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 192Mi

service:
  umami:
    controller: umami
    ports:
      http:
        port: 3000

persistence:
  app-tmp:
    type: emptyDir
    advancedMounts:
      umami:
        app:
          - path: /tmp
  db-tmp:
    type: emptyDir
    advancedMounts:
      umami:
        db:
          - path: /tmp
  db-run:
    type: emptyDir
    advancedMounts:
      umami:
        db:
          - path: /var/run/postgresql
  newt-tmp:
    type: emptyDir
    advancedMounts:
      umami:
        newt:
          - path: /tmp
  # Keep the original local-path claim mounted read-only for rollback.
  db-data:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      umami:
        db:
          - path: /mnt/umami-rollback-db-data
            readOnly: true
  db-data-local:
    type: persistentVolumeClaim
    existingClaim: umami-db-data-local
    advancedMounts:
      umami:
        db:
          - path: /var/lib/postgresql

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: umami
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: umami
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: umami
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

  exactHubbleEgressPolicy:
    enabled: true
    suffix: exacthubbleegress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: exact-hubble-egress
        namespace: umami
      spec:
        description: Exact forwarded Hubble egress tuples captured on 2026-10-24.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: umami
        egress:
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "21820"
                    protocol: UDP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
