---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qbittorrent-egress-monitor
  namespace: qbittorrent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qbittorrent-egress-monitor
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumegressgatewaypolicies]
    resourceNames: [qbittorrent]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qbittorrent-egress-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qbittorrent-egress-monitor
subjects:
  - kind: ServiceAccount
    name: qbittorrent-egress-monitor
    namespace: qbittorrent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qbittorrent-egress-monitor
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [qbittorrent-egress]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qbittorrent-egress-monitor
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qbittorrent-egress-monitor
subjects:
  - kind: ServiceAccount
    name: qbittorrent-egress-monitor
    namespace: qbittorrent
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent-egress-monitor-api
  namespace: qbittorrent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent-egress-monitor
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: '6443'
              protocol: TCP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-egress-monitor
  namespace: qbittorrent
spec:
  schedule: '*/5 * * * *'
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 100
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qbittorrent-egress-monitor
            app.kubernetes.io/instance: qbittorrent-egress-monitor
            app.kubernetes.io/controller: qbittorrent
        spec:
          serviceAccountName: qbittorrent-egress-monitor
          # check.py reads this scoped token to verify the policy and Argo app.
          automountServiceAccountToken: true
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: k8s-w-1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Startup ordering only; this delay is not a map check or a
          # fail-closed boundary. The actual exit is checked by check.py.
          initContainers:
            - name: reconciliation-delay
              image: docker.io/linuxserver/qbittorrent:5.3.0@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
              command: [sleep, '20']
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
          containers:
            - name: check
              image: docker.io/linuxserver/qbittorrent:5.3.0@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
              command: [python3, /checks/check.py]
              envFrom:
                - secretRef:
                    name: qbittorrent-egress-alert
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: check
                  mountPath: /checks
                  readOnly: true
          volumes:
            - name: check
              configMap:
                name: qbittorrent-egress-monitor
