---
# RBAC is additive. This role provides scoped maintenance permissions; the
# admission policy below also covers existing wildcard grants (e.g. Velero).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qbittorrent-egress-maintainer
rules:
  - apiGroups: [cilium.io]
    resources: [ciliumegressgatewaypolicies]
    resourceNames: [qbittorrent, qbittorrent-egress-protection-test]
    verbs: [get, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qbittorrent-egress-maintainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: qbittorrent-egress-maintainer
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: admin
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: qbittorrent-egress-protection
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [cilium.io]
        apiVersions: [v2]
        operations: [UPDATE, DELETE]
        resources: [ciliumegressgatewaypolicies]
        scope: Cluster
  matchConditions:
    - name: protected-policy-name
      expression: >-
        request.name in ['qbittorrent', 'qbittorrent-egress-protection-test']
  validations:
    - expression: >-
        request.userInfo.username in
        ['admin', 'system:serviceaccount:argocd:argocd-application-controller']
      message: Only Dave admin or the Argo application controller may change or delete this egress policy
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: qbittorrent-egress-protection
spec:
  policyName: qbittorrent-egress-protection
  validationActions: [Deny]
