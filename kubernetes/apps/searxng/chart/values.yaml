# Velero Schedule for this namespace (applied into the velero namespace).
# Manifests-only by design: Secrets are excluded (re-creatable from Vault)
# and there are no persistent volumes to capture.
backup:
  enabled: true
  schedule: "5 3 * * *"
  ttl: 336h
