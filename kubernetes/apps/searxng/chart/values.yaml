# Default values for the searxng chart.
# Secret-bearing values (settings.secretKey, newt credentials) ship empty and
# are supplied at deploy time from Ansible Vault -- see
# ../values.secrets.yaml.j2 and playbooks/talos-cluster/searxng.yml.

searxng:
  image: docker.io/searxng/searxng:2026.10.24-ef0ec03da@sha256:7c7cbe509429e82755104b2a95f52085a98633c95d53f44e4e905fa3a59f08c8
  uwsgiWorkers: "4"
  uwsgiThreads: "4"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

valkey:
  image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# The Newt sidecar owns the Pangolin site identity. The production values
# enable it; keep this default disabled for chart rendering without secrets.
newt:
  # Existing Secret keys: PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET.
  existingSecret: ""
  enabled: false
  image: docker.io/fosrl/newt:1.19.0@sha256:0189c8287058b800cca825590e4c39946b3815344ca48678dd0b96616d639319
  pangolinEndpoint: ""
  id: ""
  secret: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Non-secret SearXNG settings (rendered into the settings Secret alongside
# secretKey). The production values contain the active settings.
settings:
  # Existing Secret must contain the complete settings.yml file.
  existingSecret: ""
  secretKey: ""
  instanceName: "searxng"
  safeSearch: 0
  autocomplete: ""
  defaultLang: "auto"
  formats:
    - html
    - json
  limiter: false
  imageProxy: false
  disabledEngines:
