# Default values for the searxng chart.
# Secret-bearing values (settings.secretKey) ship empty and
# are supplied at deploy time from Ansible Vault -- see
# ../values.secrets.yaml.j2 and playbooks/talos-cluster/searxng.yml.

searxng:
  image: docker.io/searxng/searxng:2026.11.26-b5605b8f2@sha256:462d8dbeadd7c7c304be08d47084f5caba70f47a9145a01fd25990a7944e61b7
  uwsgiWorkers: "4"
  uwsgiThreads: "4"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  initContainerResources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

valkey:
  # DHI pilot: digest read from a pod pulled on k8s-w-1 after the Talos
  # registry auth was applied (dhi.io requires auth).
  image: dhi.io/valkey:9.2.1-debian13@sha256:7d7a29a35cf70266071d15a7de605011fc5bd160a45876947b409b4855d2ee3d
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Non-secret SearXNG settings (rendered into the settings Secret alongside
# secretKey). The production values contain the active settings.
settings:
  # Existing Secret must contain the complete settings.yml file.
  existingSecret: ""
  secretKey: ""
  instanceName: "searxng"
  safeSearch: 0
  autocomplete: ""
  defaultLang: "auto"
  formats:
    - html
    - json
  limiter: false
  imageProxy: false
  disabledEngines:
