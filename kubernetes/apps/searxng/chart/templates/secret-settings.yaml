{{- if not .Values.settings.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: searxng-settings
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  settings.yml: |
    # Rendered by the searxng chart from values; secretKey arrives via the
    # Vault-rendered values file at deploy time and is never committed.
    use_default_settings: true

    general:
      debug: false
      instance_name: {{ .Values.settings.instanceName | quote }}

    engines:
      {{- range .Values.settings.disabledEngines }}
      - name: {{ . | quote }}
        disabled: true
      {{- end }}

    search:
      safe_search: {{ .Values.settings.safeSearch }}
      autocomplete: {{ .Values.settings.autocomplete | quote }}
      default_lang: {{ .Values.settings.defaultLang | quote }}
      formats:
        {{- range .Values.settings.formats }}
        - {{ . }}
        {{- end }}

    server:
      port: 8080
      bind_address: "0.0.0.0"
      secret_key: {{ required "settings.secretKey must be supplied from Ansible Vault (see values.secrets.yaml.j2)" .Values.settings.secretKey | quote }}
      limiter: {{ .Values.settings.limiter }}
      image_proxy: {{ .Values.settings.imageProxy }}

    valkey:
      url: "redis://valkey.{{ .Release.Namespace }}.svc.cluster.local:6379/0"
{{- end }}
