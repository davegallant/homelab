apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
      {{- if not .Values.settings.existingSecret }}
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/secret-settings.yaml") . | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: {{ .Values.searxng.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: UWSGI_WORKERS
              value: {{ .Values.searxng.uwsgiWorkers | quote }}
            - name: UWSGI_THREADS
              value: {{ .Values.searxng.uwsgiThreads | quote }}
            - name: FORCE_OWNERSHIP
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add: []
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
        {{- if .Values.newt.enabled }}
        - name: newt
          image: {{ .Values.newt.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
          envFrom:
            - secretRef:
                name: {{ .Values.newt.existingSecret | default "searxng-newt" | quote }}
          volumeMounts:
            - name: newt-tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.newt.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: newt-tmp
          emptyDir: {}
        - name: searxng-settings
          secret:
            secretName: {{ .Values.settings.existingSecret | default "searxng-settings" | quote }}
