apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
      {{- if not .Values.settings.existingSecret }}
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/secret-settings.yaml") . | sha256sum }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-cache
          image: {{ .Values.searxng.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "mkdir -p /cache/searxng"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.searxng.initContainerResources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: searxng
          image: {{ .Values.searxng.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: UWSGI_WORKERS
              value: {{ .Values.searxng.uwsgiWorkers | quote }}
            - name: UWSGI_THREADS
              value: {{ .Values.searxng.uwsgiThreads | quote }}
            - name: FORCE_OWNERSHIP
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.searxng.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add: []
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
              subPath: searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: searxng-settings
          secret:
            secretName: {{ .Values.settings.existingSecret | default "searxng-settings" | quote }}
