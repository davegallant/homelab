apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argo-workflows-gotify-egress
  namespace: argo-workflows
spec:
  description: Allow only the workflow failure notifier to send Gotify messages.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-gotify
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchName: gotify.davegallant.ca
    - toFQDNs:
        - matchName: gotify.davegallant.ca
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
