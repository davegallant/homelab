singleNamespace: true
createAggregateRoles: false
workflow:
  serviceAccount:
    create: true
crds:
  upgradeJob:
    image:
      tag: v4.1.6@sha256:b9be70ef3f4a0709d771e9c098a99fd2d97be1b095c1b160c668a2fde61dc237
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
controller:
  metricsConfig:
    enabled: true
    secure: false
  podAnnotations:
    # Metrics server TLS is configured at controller startup; bump this to roll
    # the controller when metrics settings change.
    homelab.davegallant.ca/metrics-config-revision: "1"
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  clusterWorkflowTemplates:
    enabled: false
  workflowDefaults:
    spec:
      serviceAccountName: argo-workflow
      onExit: homelab-gotify-failure-notifier
      templates:
        - name: homelab-gotify-failure-notifier
          steps:
            - - name: send-failure-notification
                template: homelab-gotify-send
                when: "{{workflow.status}} != Succeeded"
        - name: homelab-gotify-send
          metadata:
            labels:
              app.kubernetes.io/name: argo-workflows-gotify
          script:
            image: docker.io/library/python:3.14.5-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            command: [python3]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 200m, memory: 128Mi}
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              seccompProfile:
                type: RuntimeDefault
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            source: |
              import json
              import os
              import urllib.request

              name = os.environ['WORKFLOW_NAME']
              namespace = os.environ['WORKFLOW_NAMESPACE']
              status = os.environ['WORKFLOW_STATUS']
              duration = os.environ['WORKFLOW_DURATION']
              ui_url = 'https://argo-workflows.tail.davegallant.ca'
              body = {
                  'title': f'Argo workflow {status}: {name}',
                  'message': (
                      f'Workflow **{namespace}/{name}** finished with status '
                      f'**{status}** after {duration} seconds.\n\n'
                      f'[Open Argo Workflows]({ui_url})'
                  ),
                  'priority': 8,
                  'extras': {
                      'client::display': {'contentType': 'text/markdown'}
                  },
              }
              request = urllib.request.Request(
                  'https://gotify.davegallant.ca/message',
                  data=json.dumps(body).encode(),
                  headers={
                      'Content-Type': 'application/json',
                      'X-Gotify-Key': os.environ['GOTIFY_TOKEN'],
                      'User-Agent': 'homelab-argo-workflows/1.0',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if not 200 <= response.status < 300:
                      raise RuntimeError(f'Gotify returned HTTP {response.status}')
          podSpecPatch: |
            {"containers":[{"name":"main","env":[
              {"name":"GOTIFY_TOKEN","valueFrom":{"secretKeyRef":{"name":"argo-workflows-gotify","key":"token"}}},
              {"name":"WORKFLOW_NAME","value":"{{workflow.name}}"},
              {"name":"WORKFLOW_NAMESPACE","value":"{{workflow.namespace}}"},
              {"name":"WORKFLOW_STATUS","value":"{{workflow.status}}"},
              {"name":"WORKFLOW_DURATION","value":"{{workflow.duration}}"}
            ]}]}
  image:
    tag: v4.1.6@sha256:a012a639ead374a4a9306093d6b29dfdc7e6c4c1a85c684582cb961a6cc8bcf3
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
    capabilities: {drop: [ALL]}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 512Mi}
executor:
  image:
    tag: v4.1.6@sha256:28432d912a716167709429b28e2755f49416eb4754c35ca3013863fb72717a00
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
    capabilities: {drop: [ALL]}
server:
  clusterWorkflowTemplates:
    enabled: false
  image:
    tag: v4.1.6@sha256:acb4c1de9a9c5fa109fb3094eebbc3eac42d2dd328181b0a395488cc97de75e5
  authModes: [client]
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile: {type: RuntimeDefault}
    capabilities: {drop: [ALL]}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
