---
# ChangeDetection — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. The workload uses
# docker.io/dgtlmoon/changedetection.io 0.60.9 on port 5000. HTTPS is
# terminated by the tailnet Gateway and forwarded to the existing Service.
controllers:
  changedetection:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the app config volume only;
        # the Schedule is opt-in.
        backup.velero.io/backup-volumes: datastore-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/dgtlmoon/changedetection.io
          tag: 0.60.10
          digest: sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
        env:
          HIDE_REFERER: "true"
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 15m
            memory: 112Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  changedetection:
    controller: changedetection
    ports:
      http:
        port: 5000

persistence:
  # Keep the original hostPath-backed claim mounted for rollback. Velero
  # cannot make a PodVolumeBackup from it.
  datastore:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      changedetection:
        app:
          - path: /mnt/changedetection-rollback-datastore
            readOnly: true
  datastore-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      changedetection:
        app:
          - path: /datastore
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: changedetection
      spec:
        description: Default deny with internet fetch access, cluster DNS, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: changedetection
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: changedetection
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
