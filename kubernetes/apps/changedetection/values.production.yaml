---
# ChangeDetection — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. The workload uses
# docker.io/dgtlmoon/changedetection.io 0.60.9 on port 5000. HTTPS is
# terminated by the tailnet Gateway and forwarded to the existing Service.
controllers:
  changedetection:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the app config volume only;
        # the Schedule is opt-in.
        backup.velero.io/backup-volumes: datastore-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image:
          repository: docker.io/dgtlmoon/changedetection.io
          tag: 0.60.10
          digest: sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
        env:
          HIDE_REFERER: "true"
          HOME: /tmp
          PYTHONDONTWRITEBYTECODE: "1"
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 5000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 15m
            memory: 112Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  changedetection:
    controller: changedetection
    ports:
      http:
        port: 5000

persistence:
  # Keep the original hostPath-backed claim mounted for rollback. Velero
  # cannot make a PodVolumeBackup from it.
  datastore:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      changedetection:
        app:
          - path: /mnt/changedetection-rollback-datastore
            readOnly: true
  datastore-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      changedetection:
        app:
          - path: /datastore
  tmp:
    type: emptyDir
    advancedMounts:
      changedetection:
        app:
          - path: /tmp
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: changedetection
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: changedetection
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: changedetection
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

  exactHubbleEgressPolicy:
    enabled: true
    suffix: exacthubbleegress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: exact-hubble-egress
        namespace: changedetection
      spec:
        description: Public HTTP(S) checks plus exact forwarded Hubble egress tuples captured on 2026-10-24.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: changedetection
        egress:
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "80"
                    protocol: TCP
                  - port: "443"
                    protocol: TCP
          - toCIDR:
