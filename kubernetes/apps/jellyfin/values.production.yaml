---
controllers:
  jellyfin:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      automountServiceAccountToken: false
      annotations:
        backup.velero.io/backup-volumes: config
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [108]
    containers:
      server:
        image:
          repository: docker.io/jellyfin/jellyfin
          tag: "12.4"
          digest: sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
            spec:
              periodSeconds: 5
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi
            gpu.intel.com/i915: 1
      newt:
        enabled: true
        image:
          repository: docker.io/fosrl/newt
          tag: 1.19.1
          digest: sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        envFrom:
          - secretRef:
              name: jellyfin-newt-external
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
service:
  jellyfin:
    controller: jellyfin
    ports:
      http:
        port: 8096
persistence:
  config:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations:
      volumeType: local
    advancedMounts:
      jellyfin:
        server:
          - path: /config
  cache:
    type: emptyDir
    advancedMounts:
      jellyfin:
        server:
          - path: /cache
  media:
    type: persistentVolumeClaim
    existingClaim: jellyfin-media
    advancedMounts:
      jellyfin:
        server:
          - path: /mnt
            readOnly: true
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: jellyfin
      spec:
        description: Default deny with cluster DNS, same-namespace access, Newt-to-Pangolin egress, and explicit internal-range denies.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: jellyfin
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: jellyfin
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: jellyfin
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "21820"
                    protocol: UDP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
  tmdbEgressPolicy:
    enabled: true
    suffix: tmdb-egress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: tmdb-egress
        namespace: jellyfin
      spec:
        description: Allow Jellyfin DNS tracking and HTTPS to the TMDb API.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: jellyfin
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          - toFQDNs:
              - matchName: api.themoviedb.org
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
