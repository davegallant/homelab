---
controllers:
  jellyfin:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [108]
    containers:
      server:
        image:
          repository: docker.io/jellyfin/jellyfin
          tag: "12.3"
          digest: sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
            spec:
              periodSeconds: 5
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
          liveness:
            enabled: true
            type: HTTP
            path: /health
            port: 8096
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi
            gpu.intel.com/i915: 1
service:
  jellyfin:
    controller: jellyfin
    ports:
      http:
        port: 8096
persistence:
  config:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations:
      volumeType: local
    globalMounts:
      - path: /config
  cache:
    type: emptyDir
    globalMounts:
      - path: /cache
  media:
    type: persistentVolumeClaim
    existingClaim: jellyfin-media
    globalMounts:
      - path: /mnt
        readOnly: true
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: jellyfin
      spec:
        description: Default deny with internet metadata access and cluster DNS.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: jellyfin
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: jellyfin
          - toEntities: [world]
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
