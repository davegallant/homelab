---
# Prowlarr — Argo CD production values (bjw-s app-template 5.3.0).
# Workload definition: this file, rendered by the bjw-s app-template chart.
# (app docker.io/linuxserver/prowlarr 2.6.5, port 9696, config on a
# local volume; Flaresolverr ghcr.io/flaresolverr/flaresolverr v3.5.2
# as a second service in the same compose).
# Tailnet-only: the Tailnet Gateway terminates HTTPS and routes the
# production hostname to the Prowlarr Service on port 9696.
#
# Flaresolverr runs in-pod as a second app container at 127.0.0.1:8191.
# Prowlarr has no media mounts and never talks to qBittorrent. The *arr
# apps poll its Torznab feeds and Prowlarr syncs profiles through their
# cluster Services, which the network policy below allows.
#
# Prowlarr's API key and app/indexer credentials live in its config,
# which arrives with the copied /config; no app Secret is used.
controllers:
  prowlarr:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the config volume.
        backup.velero.io/backup-volumes: config-local
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/linuxserver/prowlarr
          tag: 2.7.0
          digest: sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Etc/UTC
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 9696
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 9696
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 9696
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      flaresolverr:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.2
          digest: sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
        env:
          LOG_LEVEL: info
          LOG_HTML: "false"
          CAPTCHA_SOLVER: none
          TZ: Etc/UTC
        probes:
          startup:
            enabled: true
            type: TCP
            port: 8191
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 8191
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 8191
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            # Headless Chromium spikes while solving.
            cpu: 500m
            memory: 1Gi
service:
  prowlarr:
    controller: prowlarr
    ports:
      http:
        port: 9696

persistence:
  config-local:
    type: persistentVolumeClaim
    existingClaim: prowlarr-config-local
    advancedMounts:
      prowlarr:
        app:
          - path: /config
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: prowlarr
      spec:
        description: Default deny with indexer egress, cluster DNS, and two-way API access with the *arr apps.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
          # The *arr apps poll Prowlarr's Torznab feeds.
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lidarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: prowlarr
          # App-profile sync and connection tests use the app Services.
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lidarr
            toPorts:
              - ports:
                  - port: "8686"
                    protocol: TCP
          - toEntities:
              - cluster
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
