---
# Storage for miniflux, applied by playbooks/talos-cluster/miniflux.yml
# and deliberately NOT chart-managed: the chart adopts the PVC by name
# and never recreates it (same carve-out as Homepage/Kiwix).
#
# One volume: the Postgres data directory, on node-local disk at
# k8s-w-1. Postgres does not belong on NFS, and a single small static
# local PV is the pattern every stateful workload so far has used.
# The directory is materialized by a machine-config .keep entry
# (cluster/worker.patch.yaml.j2) and only appears on node reboot.
# This is the first volume Velero filesystem-backs-up for real — see
# the chart's schedule and the pre-backup pg_dump hook on the
# StatefulSet pod.
apiVersion: v1
kind: Namespace
metadata:
  name: miniflux
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: miniflux-postgres
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  local:
    path: /var/mnt/miniflux/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miniflux-postgres
  namespace: miniflux
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pve-g3-1-local
  volumeName: miniflux-postgres
  resources:
    requests:
      storage: 2Gi
