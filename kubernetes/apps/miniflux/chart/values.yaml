# Default values for the miniflux chart.
#
# Values that originate in Ansible (Vault secrets, group_vars) ship
# empty here and are supplied at deploy time through
# ../values.ansible.yaml.j2, rendered by
# playbooks/talos-cluster/miniflux.yml into a protected temp file.
# Templates fail to render (required) when the critical ones are
# missing.

# Existing Secret keys: db-user, db-password, admin-username,
# admin-password, and (when Newt is enabled) newt-id, newt-secret.
existingSecret: ""

miniflux:
  # Application image and runtime settings are managed in this chart.
  image: docker.io/miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

db:
  image: docker.io/postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
  name: miniflux # database name (also the DATABASE_URL path)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Public exposure via Pangolin. The production values enable this
# sidecar with its Vault-managed identity.
newt:
  enabled: false
  image: docker.io/fosrl/newt:1.19.1@sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Everything pins to the worker hosting the static local PV
# (../storage.yaml -- deliberately NOT managed by this chart; the
# chart adopts the existing PVC and never recreates it).
nodeHostname: k8s-w-1

# --- Supplied by the Ansible bridge (values.ansible.yaml.j2) ---

# Database user (Vault) and the app's public base URL (group_vars) —
# not sensitive; the passwords and Newt credentials are.
dbUser: ""
baseUrl: ""
pangolinEndpoint: ""

# Secrets, carried through the protected bridge render only.
dbPassword: ""
adminUsername: ""
adminPassword: ""
newtId: ""
newtSecret: ""

# Velero Schedule for this namespace (applied into the velero
# namespace). First REAL volume backup on the cluster: the schedule
# itself is opt-in-only (defaultVolumesToFsBackup false) and the
# StatefulSet pod opts its data volume in by annotation, with a
# pre-backup hook that writes a logical pg_dump into the volume so
# every filesystem backup also carries a restore-from-sql path.
# Secrets are excluded (re-creatable from Vault — the DB password in
# the restored data matches the Vault value by construction).
backup:
  enabled: true
  schedule: "40 3 * * *"
  ttl: 336h
