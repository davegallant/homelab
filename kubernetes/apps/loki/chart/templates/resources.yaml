apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |-
{{ .Files.Get "loki-config.yaml" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  annotations:
    volumeType: local
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-tailscale-state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-tailscale-config
data:
  serve-config.json: |
    {"TCP":{"3100":{"TCPForward":"127.0.0.1:3100"}}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
          args: [-config.file=/etc/loki/loki.yaml]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3100
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /ready, port: 3100}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
          livenessProbe:
            httpGet: {path: /ready, port: 3100}
          volumeMounts:
            - {name: data, mountPath: /loki}
            - {name: config, mountPath: /etc/loki}
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: loki-tailscale-auth
                optional: true
          env:
            - {name: TS_AUTH_ONCE, value: "true"}
            - {name: TS_HOSTNAME, value: loki}
            - {name: TS_STATE_DIR, value: /var/lib/tailscale}
            - {name: TS_KUBE_SECRET, value: ""}
            - {name: TS_USERSPACE, value: "true"}
            - {name: TS_EXTRA_ARGS, value: "--login-server=https://hs.davegallant.ca --accept-dns=false"}
            - {name: TS_SERVE_CONFIG, value: /etc/tailscale/serve-config.json}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          volumeMounts:
            - {name: tailscale-state, mountPath: /var/lib/tailscale}
            - {name: tailscale-config, mountPath: /etc/tailscale/serve-config.json, subPath: serve-config.json, readOnly: true}
      volumes:
        - name: tailscale-state
          persistentVolumeClaim: {claimName: loki-tailscale-state}
        - name: tailscale-config
          configMap: {name: loki-tailscale-config}
        - name: data
          persistentVolumeClaim: {claimName: loki-data}
        - name: config
          configMap: {name: loki-config}
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: loki-daily
  namespace: velero
spec:
  schedule: "50 5 * * *"
  template:
    ttl: 336h
    includedNamespaces: [loki]
    excludedResources: [secrets]
    defaultVolumesToFsBackup: false
    snapshotVolumes: false
    storageLocation: default
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki-default-deny
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alloy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: loki
      toPorts:
        - ports:
            - {port: "3100", protocol: TCP}
    - fromEntities: [world]
      toPorts:
        - ports:
            - {port: "41641", protocol: UDP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [world]
