---
# Production: one pod contains the server, ML,
# Valkey and Postgres; this is a single failure domain with no independent
# scaling or operator-managed database. Server transcoding can use the Intel
# GPU; ML remains CPU-only. Test PVCs are retained separately.
# The library remains on the existing TrueNAS NFS export. Postgres is local
# to k8s-w-2. Velero includes a consistent logical database dump; the library
# has TrueNAS snapshots but its off-host protection has not been verified.
controllers:
  immich:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      automountServiceAccountToken: false
      # k8s-w-2 hosts the passed-through Intel GPU and local production PV.
      # Check free disk and scheduled requests before changing placement.
      nodeSelector:
        kubernetes.io/hostname: k8s-w-2
      annotations:
        backup.velero.io/backup-volumes: postgres-production
        pre.hook.backup.velero.io/container: postgres
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","pg_dump --clean --if-exists -U $POSTGRES_USER -d $POSTGRES_DB > /var/lib/postgresql/data/immich-backup.sql"]'
    containers:
      server:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.3.5
          digest: sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
        envFrom:
          - secretRef:
              name: immich-production-external
        env:
          TZ: UTC
          NODE_ENV: production
          DB_HOSTNAME: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE_NAME: immich
          IMMICH_MEDIA_LOCATION: /usr/src/app/upload
          REDIS_HOSTNAME: 127.0.0.1
          REDIS_PORT: "6379"
          IMMICH_MACHINE_LEARNING_URL: http://127.0.0.1:3003
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /api/server/ping
            port: 2283
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
            gpu.intel.com/i915: 1
      machine-learning:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/immich-app/immich-machine-learning
          tag: v3.3.5
          digest: sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
        env:
          TZ: UTC
          MACHINE_LEARNING_HOST: 127.0.0.1
          MACHINE_LEARNING_PORT: "3003"
        probes:
          startup:
            enabled: true
            type: TCP
            port: 3003
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 3003
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 3003
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi
      valkey:
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/valkey/valkey
          tag: "9"
          digest: sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
        probes:
          startup:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      postgres:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/immich-app/postgres
          # RESOLVED from the v3.3.5 release compose
          # (docker/docker-compose.yml): tag is 14-, not 16-.
          tag: 14-vectorchord0.4.3-pgvectors0.2.0
          digest: sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
        envFrom:
          - secretRef:
              name: immich-production-external
        env:
          POSTGRES_DB: immich
          POSTGRES_INITDB_ARGS: "--data-checksums"
        # NOTE for Terra: the v3.3.5 compose sets shm_size: 128mb for
        # the database container. If Postgres fails with shared-memory
        # errors, add a /dev/shm emptyDir (Memory medium, 128Mi) mount
        # as a reported values change — do not silently edit at sync.
        probes:
          startup:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  immich:
    controller: immich
    ports:
      http:
        port: 2283

persistence:
  # Both claims are provisioned separately before the production cutover.
  library-production:
    type: persistentVolumeClaim
    existingClaim: immich-production-library
    advancedMounts:
      immich:
        server:
          - path: /usr/src/app/upload
  postgres-production:
    type: persistentVolumeClaim
    existingClaim: immich-production-postgres
    advancedMounts:
      immich:
        postgres:
          - path: /var/lib/postgresql/data
  model-cache-local:
    type: persistentVolumeClaim
    # Reuse the populated test cache instead of creating a second 1.7 GiB copy.
    existingClaim: immich-model-cache-local
    advancedMounts:
      immich:
        machine-learning:
          - path: /cache
  valkey-data:
    type: emptyDir
    advancedMounts:
      immich:
        valkey:
          - path: /data

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: immich
      spec:
        description: Default deny with internet fetch access, cluster DNS, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: immich
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: immich
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
