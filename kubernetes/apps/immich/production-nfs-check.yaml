---
apiVersion: v1
kind: Pod
metadata:
  name: immich-production-nfs-check
  namespace: immich
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-w-2
  containers:
    - name: check
      image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: [sh, -ec]
      args:
        - >-
          for path in upload library thumbs encoded-video backups; do
          test -d "/library/$path" || exit 1; done;
          stat -c '%u:%g %a' /library;
          echo 'Production library directories accessible read-only'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: library
          mountPath: /library
          readOnly: true
  volumes:
    - name: library
      persistentVolumeClaim:
        claimName: immich-production-library
        readOnly: true
