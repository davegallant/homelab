---
# Temporary restore target. Never mount the production library here.
apiVersion: v1
kind: Pod
metadata:
  name: immich-production-restore
  namespace: immich
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: k8s-w-2
  containers:
    - name: postgres
      image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
      envFrom:
        - secretRef:
            name: immich-production-external
      env:
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
      volumeMounts:
        - name: postgres
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: postgres
      persistentVolumeClaim:
        claimName: immich-production-postgres
