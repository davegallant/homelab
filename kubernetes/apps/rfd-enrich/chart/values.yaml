image:
  repository: ghcr.io/davegallant/rfd-enricher
  tag: local
  digest: sha256:REPLACE_AFTER_IMAGE_PUBLISH

schedule: "*/15 * * * *"
timezone: Etc/UTC
suspend: true
concurrencyPolicy: Forbid
startingDeadlineSeconds: 300
activeDeadlineSeconds: 600
retryLimit: 3
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 2

env: {}
secretEnv: {}
