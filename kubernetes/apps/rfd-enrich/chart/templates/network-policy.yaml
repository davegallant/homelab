apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rfd-enrich-egress
  namespace: argo-workflows
spec:
  description: Allow the RFD enricher to reach DNS, LiteLLM, and the RFD API.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: rfd-enrich
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: litellm.litellm.svc.cluster.local
              - matchName: rfd.davegallant.ca
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toFQDNs:
        - matchName: rfd.davegallant.ca
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
