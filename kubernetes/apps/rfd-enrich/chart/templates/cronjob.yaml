apiVersion: batch/v1
kind: CronJob
metadata:
  name: rfd-enrich
  labels:
    app.kubernetes.io/name: rfd-enrich
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: rfd-enrich
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rfd-enrich
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enricher
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
              imagePullPolicy: IfNotPresent
              command: [node, /app/tools/enricher/enrich.mjs]
              env:
                - name: RFD_FYI_ORIGIN
                  value: {{ .Values.env.RFD_FYI_ORIGIN | quote }}
                - name: ENRICH_PROVIDER
                  value: {{ .Values.env.ENRICH_PROVIDER | quote }}
                - name: ENRICH_MODEL
                  value: {{ .Values.env.ENRICH_MODEL | quote }}
                - name: ENRICH_BASE_URL
                  value: {{ .Values.env.ENRICH_BASE_URL | quote }}
                - name: ENRICH_STREAM
                  value: {{ .Values.env.ENRICH_STREAM | quote }}
                - name: ENRICH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretEnv.ENRICH_API_KEY.name }}
                      key: {{ .Values.secretEnv.ENRICH_API_KEY.key }}
                - name: REFRESH_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secretEnv.REFRESH_SECRET.name }}
                      key: {{ .Values.secretEnv.REFRESH_SECRET.key }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
