---
# Watchdog egress only. The velero namespace default-deny selects every
# endpoint, and Cilium policies union per endpoint, so this policy adds
# world:443 for watchdog pods ONLY (label-selected) without widening
# the Velero controller, which is not selected by this policy.
# Gotify is public (gotify.davegallant.ca), not LAN, so no LAN egress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-watchdog-egress
  namespace: velero
  labels:
    app.kubernetes.io/name: backup-watchdog
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backup-watchdog
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
