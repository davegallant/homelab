---
# Storage for speedtest-tracker, applied once by hand and
# deliberately NOT managed by Argo CD: the homelab
# AppProject allows namespace-scoped resources only, so namespaces
# and static volumes stay an Ansible / kubectl concern.
#
# App config, PostgreSQL, Apprise, Tailscale, and Caddy state use
# chart-managed local-path PVCs declared in values.production.yaml.
# This file creates just the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: speedtest-tracker
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
