---
# Speedtest Tracker — Argo CD production values (bjw-s app-template 5.3.0).
# Migrated from the LXC stack: Speedtest Tracker 1.15.1 (port 80),
# PostgreSQL 18.6, and Apprise 2.0.1 run as containers in this pod.
# Tailnet-only exposure is provided by the central Cilium Gateway.
# In-cluster database and Apprise traffic remains localhost-only.
#
# The former compose reached the database by service name; in-pod
# DB_HOST is 127.0.0.1. Apprise stays a separate container on
# 127.0.0.1:8000, as the app expects a notification service URL.
#
# Secrets stay outside Git and outside Argo's ownership:
#   speedtest-tracker-external        (DB_USERNAME, DB_PASSWORD,
#                                      APP_KEY, POSTGRES_USER,
#                                      POSTGRES_PASSWORD)
#                        — playbooks/talos-cluster/speedtest-secret.yml
# The app and db containers both envFrom-import the one app Secret
# (each ignores the other's keys): one Secret, no renames.
controllers:
  speedtest-tracker:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the state volumes, with a
        # consistent logical dump written into the database volume
        # first so the filesystem backup carries a restorable copy.
        backup.velero.io/backup-volumes: config-local,db-data-local,apprise-local
        pre.hook.backup.velero.io/container: db
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","PGPASSWORD=$POSTGRES_PASSWORD pg_dump -U $POSTGRES_USER
          -d $POSTGRES_DB > /var/lib/postgresql/speedtest-backup.sql"]'
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/linuxserver/speedtest-tracker
          tag: 1.15.1
          digest: sha256:8d3c2826b708c18be7fb46c1afebc6bb3b1ab7c519473df1be89f5ecaa8bb31f
        envFrom:
          - secretRef:
              name: speedtest-tracker-external
        env:
          PUID: "1000"
          PGID: "1000"
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_DATABASE: speedtest_tracker
          SPEEDTEST_SCHEDULE: "*/60 * * * *"
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /admin/login
            port: 80
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /admin/login
            port: 80
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 80
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            # A running speedtest saturates CPU briefly by design.
            cpu: 2000m
            memory: 1Gi
      db:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/library/postgres
          tag: "18.6"
          digest: sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        envFrom:
          - secretRef:
              name: speedtest-tracker-external
        env:
          POSTGRES_DB: speedtest_tracker
        probes:
          startup:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      apprise:
        image:
          repository: docker.io/caronc/apprise
          tag: 2.0.2
          digest: sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
        env:
          APPRISE_STATEFUL_MODE: simple
          APPRISE_WORKER_COUNT: "1"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            type: TCP
            port: 8000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 8000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 8000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
service:
  speedtest-tracker:
    controller: speedtest-tracker
    ports:
      http:
        port: 80

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      speedtest-tracker:
        app:
          - path: /mnt/speedtest-rollback-config
            readOnly: true
  config-local:
    type: persistentVolumeClaim
    existingClaim: speedtest-tracker-config-local
    advancedMounts:
      speedtest-tracker:
        app:
          - path: /config
  db-data:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      speedtest-tracker:
        db:
          - path: /mnt/speedtest-rollback-db-data
            readOnly: true
  db-data-local:
    type: persistentVolumeClaim
    existingClaim: speedtest-tracker-db-data-local
    advancedMounts:
      speedtest-tracker:
        db:
          - path: /var/lib/postgresql
  apprise:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      speedtest-tracker:
        apprise:
          - path: /mnt/speedtest-rollback-apprise
            readOnly: true
  apprise-local:
    type: persistentVolumeClaim
    existingClaim: speedtest-tracker-apprise-local
    advancedMounts:
      speedtest-tracker:
        apprise:
          - path: /config
            subPath: config
          - path: /plugin
            subPath: plugin
          - path: /attach
            subPath: attach
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: speedtest-tracker
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: speedtest-tracker
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: speedtest-tracker
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

