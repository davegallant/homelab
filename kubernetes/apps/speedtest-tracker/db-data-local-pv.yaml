---
# Static PV for the Speedtest Tracker database on k8s-w-1.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: speedtest-tracker-db-data-local
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-6476fabe-3d87-4dcd-bc77-1fc0098f8334_speedtest-tracker_speedtest-tracker-db-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1
  claimRef:
    namespace: speedtest-tracker
    name: speedtest-tracker-db-data-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-db-data-local
  namespace: speedtest-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: speedtest-tracker-db-data-local
