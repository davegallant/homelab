---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: popeye
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: popeye-readonly
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - endpoints
  - namespaces
  - persistentvolumes
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: popeye-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: popeye-readonly
subjects:
- kind: ServiceAccount
  name: popeye
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: popeye-api-only
  namespace: '{{ .Release.Namespace }}'
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: popeye
  ingress: []
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: UDP
      - port: '53'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: popeye
        k8s:app.kubernetes.io/name: popeye-pushgateway
    toPorts:
    - ports:
      - port: '9091'
        protocol: TCP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: popeye
  namespace: '{{ .Release.Namespace }}'
spec:
  schedule: '{{ .Values.schedule }}'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: popeye
        spec:
          serviceAccountName: popeye
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: popeye
            image: '{{ .Values.popeyeImage }}'
            args:
            - -A
            - -s
            - pv,pvc,cm,svc
            - -o
            - json
            - --logs
            - none
            - --force-exit-zero
            - --cluster-name
            - homelab
            - --push-gtwy-url
            - http://popeye-pushgateway.popeye.svc.cluster.local:9091
            env:
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext: &id001
              runAsNonRoot: true
              runAsUser: 5000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          - name: storage-audit
            image: '{{ .Values.pythonImage }}'
            command:
            - python3
            - /app/storage-audit.py
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: PUSHGATEWAY_URL
              value: http://popeye-pushgateway.popeye.svc.cluster.local:9091
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
            securityContext: *id001
            volumeMounts:
            - name: scripts
              mountPath: /app
              readOnly: true
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
          - name: scripts
            configMap:
              name: popeye-storage-audit
              defaultMode: 292
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: popeye-pushgateway
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: popeye-pushgateway
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pushgateway
        image: '{{ .Values.pushgatewayImage }}'
        args:
        - --web.listen-address=:9091
        ports:
        - name: metrics
          containerPort: 9091
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: metrics
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: popeye-pushgateway
  namespace: '{{ .Release.Namespace }}'
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9091'
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: popeye-pushgateway
  ports:
  - name: metrics
    port: 9091
    targetPort: metrics
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: popeye-pushgateway
  namespace: '{{ .Release.Namespace }}'
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: popeye-pushgateway
  egress: []
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: popeye
        k8s:app.kubernetes.io/name: popeye
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: alloy
    toPorts:
    - ports:
      - port: '9091'
        protocol: TCP
