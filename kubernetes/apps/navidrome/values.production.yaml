---
# Navidrome — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. Navidrome uses
# docker.io/deluan/navidrome 0.64.2 on port 4533.
#
# Public via Pangolin through the Newt sidecar. Preserve the existing
# identity when changing the sidecar configuration.
#
# Secrets stay outside Git and outside Argo's ownership, both created
# by playbooks/talos-cluster/navidrome-secret.yml from Vault:
#   navidrome-newt-external (PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET)
#   navidrome-external      (ND_LASTFM_APIKEY, ND_LASTFM_SECRET)
controllers:
  navidrome:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the app data volume only; the
        # NFS library is excluded by omission (TrueNAS snapshots +
        # Drive sync protect it, never Velero).
        backup.velero.io/backup-volumes: data-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: docker.io/deluan/navidrome
          tag: 0.64.2
          digest: sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        envFrom:
          - secretRef:
              name: navidrome-external
        env:
          ND_ENABLEINSIGHTSCOLLECTOR: "false"
          ND_AUTOIMPORTPLAYLISTS: "false"
          TMPDIR: /tmp
          # The LXC points ListenBrainz at Maloja's tailnet URL, which
          # a pod cannot resolve or route to (no MagicDNS in-pod).
          # Maloja is in-cluster now, so the scrobble target becomes
          # its Service DNS name. The egress policy permits only the
          # Maloja endpoints on TCP 42010; Maloja also allows this
          # namespace on ingress.
          ND_LISTENBRAINZ_BASEURL: http://maloja.maloja.svc.cluster.local:42010/apis/listenbrainz/1/
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /ping
            port: 4533
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /ping
            port: 4533
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /ping
            port: 4533
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 15m
            memory: 40Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      newt:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        env:
          HOME: /tmp
          XDG_CONFIG_HOME: /tmp/.config
        args:
          - --disable-ssh
        image:
          repository: docker.io/fosrl/newt
          tag: 1.19.1
          digest: sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
        envFrom:
          - secretRef:
              name: navidrome-newt-external
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi

service:
  navidrome:
    controller: navidrome
    ports:
      http:
        port: 4533

persistence:
  tmp:
    type: emptyDir
    advancedMounts:
      navidrome:
        app:
          - path: /tmp
        newt:
          - path: /tmp
  # Keep the original hostPath-backed claim present for rollback. Velero
  # cannot make a PodVolumeBackup from this claim.
  data:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      navidrome:
        app:
          - path: /mnt/navidrome-rollback-data
            readOnly: true
  data-local:
    type: persistentVolumeClaim
    existingClaim: navidrome-data-local
    advancedMounts:
      navidrome:
        app:
          - path: /data
  library:
    type: persistentVolumeClaim
    existingClaim: navidrome-music
    advancedMounts:
      navidrome:
        app:
          - path: /music
            readOnly: true

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: navidrome
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: navidrome
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: navidrome
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: maloja
            toPorts:
              - ports:
                  - port: "42010"
                    protocol: TCP
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12

  exactHubbleEgressPolicy:
    enabled: true
    suffix: exacthubbleegress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: exact-hubble-egress
        namespace: navidrome
      spec:
        description: Exact forwarded Hubble egress tuples captured on 2026-10-24.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: navidrome
        egress:
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "21820"
                    protocol: UDP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
