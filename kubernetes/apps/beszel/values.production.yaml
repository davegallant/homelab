---
# Beszel 0.21.1, app-template 5.3.0. Agents remain on their hosts.
# LXC preflight: 37,186,748 bytes across 6 files; UID/GID 0:0;
# image USER unset, running process 0:0; GET / returns 200.
# 1Gi provides growth headroom. Data is local-path + volumeType: local.
# Tailnet exposure follows Prowlarr: userspace Tailscale -> localhost Caddy.
# Bootstrap identity uses beszel-k8s; Headscale given_name becomes beszel
# during cutover. External Secrets: beszel-caddy-external and one-use
# beszel-tailscale-auth. Never back up or clone the tailnet identity.
controllers:
  beszel:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        backup.velero.io/backup-volumes: data
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: docker.io/henrygd/beszel
          tag: 0.21.1
          digest: sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
          APP_URL: https://beszel.tail.davegallant.ca
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8090
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8090
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8090
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  beszel:
    controller: beszel
    ports:
      http:
        port: 8090

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    annotations:
      volumeType: local
    advancedMounts:
      beszel:
        app:
          - path: /beszel_data

  tailscale-state:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
  caddy-state:
    annotations:
      volumeType: local
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 256Mi

rawResources:
  daily:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: beszel-daily
        namespace: velero
      spec:
        schedule: "35 4 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - beszel
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default

  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: beszel
      spec:
        description: >-
          Default deny with cluster DNS, same-namespace, world egress, and Beszel agent access on the LAN.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: beszel
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: beszel
          - toCIDR:
              - 192.168.1.205/32 # pve-g3-1
              - 192.168.1.206/32 # pve-g3-2
              - 192.168.1.16/32 # TrueNAS SCALE
            toPorts:
              - ports:
                  - port: "45876"
                    protocol: TCP
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 10.96.0.0/12
              - 10.245.0.0/16
