# Alloy DaemonSet — Argo plain-manifest source.
# Based on the Alloy Tier 1 DaemonSet at da4ed107.
# Only change: the Ansible checksum/config annotation is removed (see inline note).
# Image, resources, probes, tolerations, EmptyDir 256Mi unchanged.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
      # No checksum/config annotation here: Ansible computed it, Argo plain
      # sync does not. A ConfigMap sync alone will NOT roll Alloy pods.
      # After any ConfigMap sync, run: kubectl -n alloy rollout restart daemonset/alloy
    spec:
      serviceAccountName: alloy
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
              protocol: TCP
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: state
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: state
          emptyDir:
            sizeLimit: 256Mi
