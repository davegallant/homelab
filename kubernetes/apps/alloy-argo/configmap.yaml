# Alloy ConfigMap — Argo plain-manifest copy (DRAFT, not committed).
# De-templated from kubernetes/apps/alloy/configmap.yaml.j2 at da4ed107 (Tier 1, live 2026-11-05).
# Only change: the alloy_metrics_remote_write_url variable replaced with the
# in-cluster VictoriaMetrics URL from vars.yaml. alloy_loki_lan_ip (192.168.1.56) is NOT used
# anywhere in this config (repo code search: only vars.yaml) and is dropped.
# Rendered config.alloy is otherwise byte-identical to the live Tier 1 config.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: alloy
data:
  config.alloy: |
    discovery.kubernetes "local_pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.local_pods.targets

      // Pods that are Pending cannot produce logs. Excluding them avoids
      // retrying log requests for containers that cannot start, while
      // retaining logs from Running and completed Pods.
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending"
        action        = "drop"
      }

      // kube-apiserver audit logs are 99.9% of that pod's Loki volume
      // (416,848 / 417,268 lines in 24h, 2026-11-05) and are not needed
      // in Loki. The Talos audit file on cp-1 remains untouched; this
      // only stops Alloy shipping the pod's stdout to Loki.
      // Dropping the target here means Alloy never tails the pod.
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        regex         = "kube-apiserver-k8s-cp-1"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "host"
      }
      rule {
        replacement  = "homelab"
        target_label = "cluster"
      }
      rule {
        replacement  = "kubernetes"
        target_label = "job"
      }
    }

    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.drop_spam.receiver]
    }

    // Tier 1 (2026-11-05): drop low-value spam before it reaches Loki.
    // argocd-notifications-controller: 329,784 info lines/day
    // ("Processing completed" / "Start processing"). Errors are kept.
    // Alloy's own "opened log stream" info: ~49,902 lines/day.
    loki.process "drop_spam" {
      stage.match {
        selector = `{pod=~"argocd-notifications-controller.*"} |~ "Processing completed|Start processing"`
        action   = "drop"
      }

      stage.match {
        selector = `{pod=~"alloy-.*"} |~ "opened log stream"`
        action   = "drop"
      }

      forward_to = [loki.write.endpoint.receiver]
    }

    loki.write "endpoint" {
      endpoint {
        url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    // ---- Metrics -----------------------------------------------------
    // Scraped in-cluster and remote-written to VictoriaMetrics in the
    // monitoring namespace. Cilium allows only Alloy and Grafana.

    prometheus.remote_write "victoriametrics" {
      endpoint {
        url = "http://victoriametrics.monitoring.svc.cluster.local:8428/api/v1/write"
      }
    }

    // Kubelet + cAdvisor: one target per node, scraped over HTTPS with
    // this pod's ServiceAccount token (RBAC: alloy-metrics).
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        replacement  = "homelab"
        target_label = "cluster"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "kubelet"
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }

      forward_to = [prometheus.remote_write.victoriametrics.receiver]
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "cadvisor"
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }

      forward_to = [prometheus.remote_write.victoriametrics.receiver]
    }

    // node-exporter: discovered by pod label, scraped per pod. The
    // instance label is rewritten to the node name so dashboards group
    // by node, not by pod IP.
    discovery.kubernetes "node_exporter_pods" {
      role = "pod"

      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=node-exporter"
      }
    }

    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.node_exporter_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        replacement  = "homelab"
        target_label = "cluster"
      }
    }

    prometheus.scrape "node_exporter" {
      targets    = discovery.relabel.node_exporter.output
      job_name   = "node-exporter"
      forward_to = [prometheus.remote_write.victoriametrics.receiver]
    }

    // Annotation-driven targets: any Service annotated
    // prometheus.io/scrape=true is scraped (kube-state-metrics and Hubble).
    discovery.kubernetes "service_endpoints" {
      role = "endpoints"
    }

    discovery.relabel "annotated_services" {
      targets = discovery.kubernetes.service_endpoints.targets

      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_service_annotation_prometheus_io_port"]
        regex         = "([^:]+)(?::\\d+)?;(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
      // Keep the target identity on generated up series while honoring
      // namespace and pod labels emitted by the scraped metrics below.
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        target_label  = "service"
      }
      rule {
        replacement  = "homelab"
        target_label = "cluster"
      }
    }

    prometheus.scrape "annotated_services" {
      targets    = discovery.relabel.annotated_services.output
      forward_to = [prometheus.remote_write.victoriametrics.receiver]
      honor_labels = true
    }

