apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: grafana-daily
  namespace: velero
spec:
  paused: false
  schedule: 40 5 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - grafana
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
