apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: speedtest-tracker-daily
  namespace: velero
spec:
  paused: false
  schedule: 5 4 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - speedtest-tracker
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
