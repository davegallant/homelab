apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: lidarr-daily
  namespace: velero
spec:
  paused: false
  schedule: 50 4 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - lidarr
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
