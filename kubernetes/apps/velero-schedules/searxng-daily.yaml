apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: searxng-daily
  namespace: velero
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  paused: false
  schedule: 5 3 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - searxng
    ttl: 336h
