apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: lubelogger-backupschedule
  namespace: velero
spec:
  paused: false
  schedule: 25 3 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - lubelogger
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
