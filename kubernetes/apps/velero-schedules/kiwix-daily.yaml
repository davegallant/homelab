apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: kiwix-daily
  namespace: velero
  labels:
    app.kubernetes.io/managed-by: ArgoCD
spec:
  paused: false
  schedule: 10 3 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - kiwix
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
