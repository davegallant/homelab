apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: invidious-daily
  namespace: velero
spec:
  paused: false
  schedule: 55 3 * * *
  skipImmediately: false
  template:
    defaultVolumesToFsBackup: false
    excludedResources:
    - secrets
    includedNamespaces:
    - invidious
    snapshotVolumes: false
    storageLocation: default
    ttl: 336h
