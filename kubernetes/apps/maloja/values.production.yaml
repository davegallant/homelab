---
# Maloja — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. Maloja uses
# docker.io/krateng/maloja 3.2.9 on port 42010.
# Tailnet-only inbound HTTPS is served by the shared Cilium Gateway.
controllers:
  maloja:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the app data volume only.
        backup.velero.io/backup-volumes: data-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/krateng/maloja
          tag: 3.2.9
          digest: sha256:313b58d282934b2e7dc27f794462eb2ceb1567db23806b49f78b706dd86afe09
        env:
          # The image's s6 init remains root, but Maloja itself drops to
          # this UID/GID. The data PVC is already owned by 1000:1000.
          PUID: "1000"
          PGID: "1000"
          # Parity with the LXC compose. MALOJA_FORCE_PASSWORD=stub is
          # already committed in the LXC playbook; it is not a real
          # credential — access control is the tailnet itself.
          MALOJA_SKIP_SETUP: "true"
          MALOJA_FORCE_PASSWORD: stub
          MALOJA_DATA_DIRECTORY: /data
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 42010
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 42010
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 42010
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 30m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
service:
  maloja:
    controller: maloja
    ports:
      http:
        port: 42010

persistence:
  # Keep the original hostPath-backed claim present for rollback. Velero
  # cannot make a PodVolumeBackup from this claim.
  data:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      maloja:
        app:
          - path: /mnt/maloja-rollback-data
            readOnly: true
  data-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      maloja:
        app:
          - path: /data
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: maloja
      spec:
        description: Default deny with tailnet control, relay, and Cloudflare egress.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: maloja
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: navidrome
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: maloja
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "3478"
                    protocol: UDP
                  - port: "41641"
                    protocol: UDP
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
