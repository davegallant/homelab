---
# csi-driver-nfs overrides. Deliberately minimal: the driver's defaults
# are the product. v1 is static provisioning only — workloads bind
# pre-created PVs that point at existing TrueNAS exports (see the
# kiwix storage.yaml for the shape). No StorageClass yet: dynamic
# provisioning arrives with the first consumer that actually needs
# per-PVC directories (RomM/Navidrome tier), with its own design.
storageClass:
  create: false
image:
  nfs:
    tag: v4.13.6@sha256:40663419bac36836b8e4ef6929199e35920e28f6a74a46892e1c125ea5f0ce0b
  csiProvisioner:
    tag: v5.0.2@sha256:7b9cdb5830d01bda96111b4f138dbddcc01eed2f95aa980a404c45a042d60a10
  csiResizer:
    tag: v2.2.1@sha256:ea1d25e23479000c7e8eeb92d827df66258df4e482ca054c5e7ce3fc0f5c41a5
  csiSnapshotter:
    tag: v8.0.1@sha256:2e04046334baf9be425bb0fa1d04c2d1720d770825eedbdbcdb10d430da4ad8c
  livenessProbe:
    tag: v2.13.1@sha256:d2a9027a4876e039185e9bef7c61a0142c8ea14e7440860285c34ac73fee4ffb
  nodeDriverRegistrar:
    tag: v2.11.1@sha256:e01facb9fb9cffaf52d0053bdb979fbd8c505c8e411939a6e026dd061a6b4fbe

# The 4.13 chart defaults to an HTTP liveness probe, while the live 4.9
# DaemonSet has an exec probe. With server-side apply both handlers conflict.
nodeDriverRegistrar:
  livenessProbe:
    enabled: false
