apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    # DinD requires privileged pods. Do NOT set this namespace to baseline —
    # the runner + DinD sidecar will fail to start under baseline/restricted.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.37
