apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  labels:
    # DinD requires privileged enforcement. Restricted audit/warn labels keep
    # the privileged exception visible while the workload remains necessary.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37
