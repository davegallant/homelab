apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-runner-egress
  namespace: forgejo-runner
spec:
  description: Deny ingress; allow Forgejo, cluster DNS, and approved public HTTPS destinations.
  endpointSelector: {}
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo
            k8s:app: forgejo
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toFQDNs:
        - matchName: data.forgejo.org
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
        - matchName: production.cloudfront.docker.com
        - matchName: forums.redflagdeals.com
        - matchName: gotify.davegallant.ca
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: raw.githubusercontent.com
        - matchName: releases.astral.sh
        - matchName: www.gasbuddy.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
