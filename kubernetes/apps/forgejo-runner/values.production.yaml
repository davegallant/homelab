# Trusted Docker workflows only: privileged DinD shares a production worker.
# Current networking, registration and verification: README.md.
# Keep registration in Vault; the existing Secret bypasses chart registration.
replicaCount: 1

# Chart 0.7.5 always renders DinD; privileged mode is its reviewed exception.

securityContext:
  privileged: true

runner:
  config:
    # ExistingSecret skips the chart's registration Job; do not create a token-based config Secret.
    create: false
    # Internal polling URL; nested jobs share the DinD network namespace.
    instance: "http://forgejo.forgejo.svc.cluster.local:3000"
    # Prebuilt user-scoped .runner file, provisioned from Vault by Ansible.
    # It covers repositories owned by dave; see the runner README.
    existingSecret: "forgejo-runner-config"
    file:
      runner:
        capacity: 2
        # runs-on: docker needs an executor image; this includes Node for
        # actions/checkout and git/curl for both scheduled workflows.
        labels:
          - "docker:docker://node:22-bookworm"
      container:
        # Job containers stay unprivileged; the DinD pod sidecar is privileged.
        privileged: false
        network: host
        # Provide the DinD client certificates to trusted image-build jobs.
        # Chart 0.7.5 uses a string for container.options.
        options: "--volume /certs/client:/certs/client:ro"
        valid_volumes:
          - /certs/client

# Nested jobs consume the DinD container budget, not separate Kubernetes pods.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# The runner and its nested jobs do not need Kubernetes API credentials.
serviceAccount:
  automount: false

# Bound the privileged DinD daemon and all nested job containers to a
# predictable share of a worker. The runner can execute two jobs concurrently.
dind:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
