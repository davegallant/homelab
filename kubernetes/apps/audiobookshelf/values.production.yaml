---
# Audiobookshelf — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. Audiobookshelf uses
# ghcr.io/advplyr/audiobookshelf 2.37.1 on port 80.
#
# Public via Pangolin through the Newt sidecar. Preserve the existing
# identity when changing the sidecar configuration.
#
# Secrets stay outside Git and outside Argo's ownership, created by
# playbooks/talos-cluster/audiobookshelf-secret.yml from Vault:
#   audiobookshelf-newt-external (PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET)
#
# The image runs as root; no fsGroup is set here.
controllers:
  audiobookshelf:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Opt-in filesystem backup of the two state volumes; the NFS
        # libraries are excluded by omission (TrueNAS snapshots +
        # Drive sync protect them, never Velero).
        backup.velero.io/backup-volumes: config-local,metadata-local
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
          digest: sha256:581d68b2a6fc7ebf58d81c878a9f387cbbc0d88ac9d37b298b9cee10168af85b
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 80
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 80
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 80
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 272Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      newt:
        securityContext:
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/fosrl/newt
          tag: 1.19.0
          digest: sha256:0189c8287058b800cca825590e4c39946b3815344ca48678dd0b96616d639319
        envFrom:
          - secretRef:
              name: audiobookshelf-newt-external
        resources:
          requests:
            cpu: 5m
            memory: 40Mi
          limits:
            cpu: 200m
            memory: 192Mi

service:
  audiobookshelf:
    controller: audiobookshelf
    ports:
      http:
        port: 80

persistence:
  config:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      audiobookshelf:
        app:
          - path: /mnt/audiobookshelf-rollback-config
            readOnly: true
  config-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      audiobookshelf:
        app:
          - path: /config
  metadata:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      audiobookshelf:
        app:
          - path: /mnt/audiobookshelf-rollback-metadata
            readOnly: true
  metadata-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      audiobookshelf:
        app:
          - path: /metadata
  audiobooks:
    type: persistentVolumeClaim
    existingClaim: audiobookshelf-audiobooks
    advancedMounts:
      audiobookshelf:
        app:
          - path: /audiobooks
  podcasts:
    type: persistentVolumeClaim
    existingClaim: audiobookshelf-podcasts
    advancedMounts:
      audiobookshelf:
        app:
          - path: /podcasts

rawResources:
  daily:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: audiobookshelf-daily
        namespace: velero
      spec:
        schedule: "50 3 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - audiobookshelf
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default

  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: audiobookshelf
      spec:
        description: Default deny with internet fetch access, cluster DNS, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: audiobookshelf
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: audiobookshelf
          - toEntities:
              - world
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
