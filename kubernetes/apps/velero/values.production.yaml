---
configuration:
  backupStorageLocation:
    - bucket: velero
      config:
        region: garage
        s3ForcePathStyle: "true"
        s3Url: http://192.168.1.16:3900
      credential:
        key: cloud
        name: velero-garage-credentials
      default: true
      name: default
      provider: aws
  defaultVolumesToFsBackup: true
  uploaderType: kopia
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
credentials:
  existingSecret: velero-garage-credentials
  useSecret: true
deployNodeAgent: true
# Keep the Velero controller on the larger worker; w-2's memory headroom
# is too small during concurrent filesystem backups and Kopia maintenance.
nodeSelector:
  kubernetes.io/hostname: k8s-w-1
image:
  digest: sha256:37396519f399536e5f01427d723565ae69294ec3fb5625cf1c87c09eaa9de16b
  repository: docker.io/velero/velero:v1.18.2
  tag: ''
initContainers:
  - image: docker.io/velero/velero-plugin-for-aws:v1.15.0@sha256:cb8fdbefc54e2d99b124f6611bc8cad31a1e546689dfb2a32c9307339c492750
    imagePullPolicy: IfNotPresent
    name: velero-plugin-for-aws
    volumeMounts:
      - mountPath: /target
        name: plugins
kubectl:
  image:
    digest: sha256:82f06779a0dcd86225ffdb96c005418b9716093a39907a5ecf686d7a22e6b788
    repository: registry.k8s.io/kubectl:v1.37.3
    tag: ''
namespace:
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.37
nodeAgent:
  disableHostPath: false
snapshotsEnabled: false
