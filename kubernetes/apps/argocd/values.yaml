---
global:
  image:
    tag: v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
configs:
  cm:
    application.resourceTrackingMethod: annotation
    timeout.reconciliation: 120s
    timeout.reconciliation.jitter: 60s
  rbac:
    policy.default: ""
dex:
  enabled: false
applicationSet:
  replicas: 0
notifications:
  enabled: true
  argocdUrl: https://argocd.tail.davegallant.ca
  secret:
    create: false
  notifiers:
    service.webhook.gotify: |
      url: https://gotify.davegallant.ca
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Gotify-Key
          value: $gotify-token
  subscriptions:
    - recipients: [gotify]
      triggers: [on-sync-failed, on-health-degraded]
  templates:
    template.gotify-failure: |
      webhook:
        gotify:
          method: POST
          path: /message
          body: |
            {{ $operation := "none" }}{{ if .app.status.operationState }}{{ $operation = .app.status.operationState.message }}{{ end }}
            {{ $details := printf "Application: %s\nHealth: %s\nSync: %s" .app.metadata.name .app.status.health.status .app.status.sync.status }}
            {{ $details = printf "%s\nOperation: %s" $details $operation }}
            {{ $link := printf "%s/applications/%s" .context.argocdUrl .app.metadata.name }}
            {
              "title": {{ printf "%q" (printf "Argo CD failure: %s" .app.metadata.name) }},
              "message": {{ printf "%q" (printf "%s\n%s" $details $link) }},
              "priority": 8
            }
  triggers:
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Error', 'Failed']
        send: [gotify-failure]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [gotify-failure]
controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
server:
  replicas: 1
  extraArgs:
    - --insecure
  deploymentStrategy:
    type: Recreate
  podAnnotations:
    backup.velero.io/backup-volumes-excludes: tailscale-state,caddy-state,caddy-runtime
  extraContainers:
    - name: tailscale
      image: ghcr.io/tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: argocd-tailscale-auth
              key: TS_AUTHKEY
              optional: true
        - name: TS_AUTH_ONCE
          value: "true"
        - name: TS_HOSTNAME
          value: argocd
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_USERSPACE
          value: "true"
        - name: TS_EXTRA_ARGS
          valueFrom:
            configMapKeyRef:
              name: argocd-tailnet
              key: TS_EXTRA_ARGS
        - name: TS_SERVE_CONFIG
          value: /etc/tailscale/serve-config.json
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi
      volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: tailnet-config
          mountPath: /etc/tailscale/serve-config.json
          subPath: serve-config.json
          readOnly: true
    - name: caddy
      image: ghcr.io/davegallant/homelab-caddy-cloudflare:2.11.6-a8737d0@sha256:36cb30f2df99d3aa9d41ed3bbf4685e662c9fe42cfbb5b06b4d98173d7473f03
      command: [caddy]
      args: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: tailnet-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
          readOnly: true
        - name: caddy-state
          mountPath: /data
        - name: caddy-runtime
          mountPath: /config
        - name: caddy-secret
          mountPath: /run/secrets/cloudflare_api_token
          subPath: cloudflare_api_token
          readOnly: true
  volumes:
    - name: tailscale-state
      persistentVolumeClaim:
        claimName: argocd-tailscale
    - name: caddy-state
      persistentVolumeClaim:
        claimName: argocd-caddy
    - name: caddy-runtime
      emptyDir: {}
    - name: tailnet-config
      configMap:
        name: argocd-tailnet
    - name: caddy-secret
      secret:
        secretName: argocd-caddy
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
redis:
  image:
    repository: docker.io/library/redis
    tag: 8.10.2-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
