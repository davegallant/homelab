dex:
  enabled: false
applicationSet:
  replicas: 0
notifications:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi
  argocdUrl: https://argocd.tail.davegallant.ca
  secret:
    create: false
  notifiers:
    service.webhook.gotify: |
      url: https://gotify.davegallant.ca
      headers:
        - name: Content-Type
          value: application/json
        - name: X-Gotify-Key
          value: $gotify-token
  subscriptions:
    - recipients: [gotify]
      triggers: [on-sync-failed, on-health-degraded]
  templates:
    template.gotify-failure: |
      webhook:
        gotify:
          method: POST
          path: /message
          body: |
            {{ $operation := "none" }}{{ if .app.status.operationState }}{{ $operation = .app.status.operationState.message }}{{ end }}
            {{ $details := printf "Application: %s\nHealth: %s\nSync: %s" .app.metadata.name .app.status.health.status .app.status.sync.status }}
            {{ $details = printf "%s\nOperation: %s" $details $operation }}
            {{ $link := printf "%s/applications/%s" .context.argocdUrl .app.metadata.name }}
            {
              "title": {{ printf "%q" (printf "Argo CD failure: %s" .app.metadata.name) }},
              "message": {{ printf "%q" (printf "%s\n%s" $details $link) }},
              "priority": 8
            }
  triggers:
    trigger.on-sync-failed: |
      - when: app.status.operationState.phase in ['Error', 'Failed']
        send: [gotify-failure]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        send: [gotify-failure]
controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
server:
  replicas: 1
  extraArgs:
    - --insecure
  deploymentStrategy:
    type: Recreate
  # Replace the legacy Helm-owned sidecar list on this Deployment only.
  deploymentAnnotations:
    argocd.argoproj.io/sync-options: Replace=true
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
redis:
