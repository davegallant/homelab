---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argocd-tailscale
  namespace: argocd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argocd-caddy
  namespace: argocd
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
