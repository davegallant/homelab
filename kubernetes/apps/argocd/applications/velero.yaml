---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-platform
  sources:
    - repoURL: ghcr.io/vmware-tanzu/charts
      chart: velero
      targetRevision: "12.2.2"
      helm:
        releaseName: velero
        valueFiles:
          - $values/kubernetes/apps/velero/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: velero
          targetNamespace: velero
          gateNamespace: presync-gate
          scheduleName: ''
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
