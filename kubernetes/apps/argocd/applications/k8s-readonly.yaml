---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-readonly
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: "5.3.0"
      helm:
        releaseName: k8s-readonly
        valueFiles:
          - $values/kubernetes/apps/k8s-readonly/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-readonly
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  # Namespace + RBAC are hand-applied, NOT Argo-managed (see
  # apps/k8s-readonly/README.md) - Argo syncs the workload only.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
