---
# Manual sync only. Renders the Caddy proxy in lan-gateway and one
# CiliumNetworkPolicy per backend app namespace. The namespace, LB-IPAM pool
# and L2 announcement policy are applied by hand from kubernetes/apps/lan-gateway/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lan-gateway
  namespace: argocd
  annotations:
    homelab.davegallant.ca/backup-policy: not-required
spec:
  project: homelab-lan-gateway
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/lan-gateway/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: lan-gateway
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
