---
# Immich — manually synced workload definition.
# Mirrors kubernetes/apps/argocd/applications/paperless-ngx.yaml:
# bjw-s app-template 5.3.0, multi-source ($values ref), project homelab,
# manual sync only, ServerSideApply + FailOnSharedResource, no prune,
# no auto-sync, no deletion finalizer.
#
# The namespace and its staged Pod Security labels are provisioned separately
# from the Argo-managed application; see apps/immich/namespace.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
    homelab.davegallant.ca/backup-policy: scheduled
spec:
  project: homelab
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: "5.3.0"
      helm:
        releaseName: immich
        valueFiles:
          - $values/kubernetes/apps/immich/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: immich
          targetNamespace: immich
          gateNamespace: presync-gate
          scheduleName: immich-daily
          requiredHooks:
            - selector:
                app.kubernetes.io/name: immich
              container: postgres
          excludedVolumes:
            - library-production
            - model-cache-local
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
