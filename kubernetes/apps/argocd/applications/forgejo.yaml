---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: homelab-platform
  sources:
    # Pinned upstream chart, resolved through the Argo CD repo-server.
    - repoURL: oci://code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: "7.1.7"
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/kubernetes/apps/forgejo/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  # Staged at zero replicas until the frozen /data copy and Velero restore
  # drill have passed. Production cutover is HTTPS-only; Git-over-SSH never
  # worked on the LXC and is intentionally not exposed by this Application.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
