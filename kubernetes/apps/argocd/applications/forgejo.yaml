---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: homelab-platform
  sources:
    # Pinned upstream chart, resolved through the Argo CD repo-server.
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: "17.3.2"
      helm:
        releaseName: forgejo
        valueFiles:
          - $values/kubernetes/apps/forgejo/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  # Rootless production startup passed an isolated /data Velero restore drill.
  # SQLite uses one Recreate pod; production access remains HTTPS-only.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
