---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: popeye
  namespace: argocd
  annotations:
    homelab.davegallant.ca/backup-policy: not-required
spec:
  project: homelab-popeye
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/popeye/chart
    helm:
      releaseName: popeye
      valueFiles:
      - ../values.production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: popeye
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
