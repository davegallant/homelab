---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bentopdf
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
    homelab.davegallant.ca/backup-policy: scheduled
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/bentopdf/chart
      helm:
        releaseName: bentopdf
        valueFiles:
          - ../values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: bentopdf
          targetNamespace: bentopdf
          gateNamespace: presync-gate
          scheduleName: bentopdf-daily
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: bentopdf
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
