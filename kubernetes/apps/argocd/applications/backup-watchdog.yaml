---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup-watchdog
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-platform
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/backup-watchdog
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: backup-watchdog
          targetNamespace: velero
          gateNamespace: presync-gate
          scheduleName: ''
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  # Manual sync only, like every other Application except the
  # qbittorrent-egress guardrail. No prune, no deletion finalizer:
  # deleting this Application preserves the CronJob history, it does
  # not delete cluster state.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
