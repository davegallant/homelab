---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kor
  namespace: argocd
  annotations:
    homelab.davegallant.ca/backup-policy: not-required
spec:
  project: homelab-platform
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/kor
  destination:
    server: https://kubernetes.default.svc
    namespace: kor
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
