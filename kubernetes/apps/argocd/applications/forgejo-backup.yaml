---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-backup
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-velero-backup
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/forgejo-backup
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: forgejo-backup
          targetNamespace: velero
          gateNamespace: presync-gate
          scheduleName: ''
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  # Raw path Application, not a Helm chart: the Velero project permits only
  # Schedule resources in this privileged namespace.
  # FailOnSharedResource is intentionally OMITTED: first sync must adopt
  # the pre-existing kubectl-created forgejo-daily Schedule (no Argo
  # tracking annotation). With FailOnSharedResource, that adoption sync
  # would fail. After adoption, Argo owns the Schedule from Git.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
