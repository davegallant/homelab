---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: presync-gate
  namespace: argocd
spec:
  project: homelab-platform
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/presync-gate
  destination:
    server: https://kubernetes.default.svc
    namespace: miniflux
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
