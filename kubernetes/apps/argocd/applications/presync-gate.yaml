---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: presync-gate
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-platform
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: presync-gate
          targetNamespace: presync-gate
          gateNamespace: presync-gate
          scheduleName: ''
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: presync-gate
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
