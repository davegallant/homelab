---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/grafana/chart
    helm:
      releaseName: grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
