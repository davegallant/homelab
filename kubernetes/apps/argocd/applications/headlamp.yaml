---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    homelab.davegallant.ca/backup-policy: not-required
spec:
  project: homelab
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: "0.46.0"
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/kubernetes/apps/headlamp/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
