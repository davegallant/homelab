apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rfd-rising-deals
  namespace: argocd
  annotations:
    homelab.davegallant.ca/backup-policy: not-required
spec:
  project: homelab-platform
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/rfd-rising-deals/chart
    helm:
      releaseName: rfd-rising-deals
      valueFiles:
        - ../values.production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
