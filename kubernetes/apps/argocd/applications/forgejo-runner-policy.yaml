---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner-policy
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-platform
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/forgejo-runner
      directory:
        recurse: true
        include: '{namespace.yaml,policy/network-policy.yaml}'
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: forgejo-runner-policy
          targetNamespace: forgejo-runner
          gateNamespace: presync-gate
          scheduleName: 'forgejo-daily'
          requiredHooks: []
          excludedVolumes: []
          defaultVolumesToFsBackup: true
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo-runner
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
