---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miniflux
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/davegallant/homelab.git
    targetRevision: main
    path: kubernetes/apps/miniflux/chart
    helm:
      releaseName: miniflux
      valueFiles:
        - ../values.production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: miniflux
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
