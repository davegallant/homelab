---
# Manual sync only. Helm owns the generated application routes and policies;
# Kustomize keeps the tailnet gateway platform resources in the same Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailnet-gateway
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
spec:
  project: homelab-tailnet-gateway
  sources:
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/tailnet-gateway/chart
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/tailnet-gateway
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: tailnet-gateway
          targetNamespace: tailnet-gateway
          gateNamespace: presync-gate
          scheduleName: ''
          requiredHooks: []
          excludedVolumes:
            - tailscale-state
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tailnet-gateway
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
