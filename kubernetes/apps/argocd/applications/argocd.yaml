---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: homelab-platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.11.6"
      helm:
        releaseName: argocd
        valuesObject:
          controller:
            nodeSelector:
              kubernetes.io/hostname: k8s-cp-1
              kubernetes.io/os: linux
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
          repoServer:
            nodeSelector:
              kubernetes.io/hostname: k8s-cp-1
              kubernetes.io/os: linux
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
        valueFiles:
          - $values/kubernetes/apps/argocd/values.yaml
          - $values/kubernetes/apps/argocd/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: argocd-server-grpc
      namespace: argocd
      jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
