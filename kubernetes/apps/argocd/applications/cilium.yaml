---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: homelab-platform
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: "1.20.4"
      helm:
        releaseName: cilium
        valueFiles:
          - $values/kubernetes/apps/cilium/values.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cilium-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
