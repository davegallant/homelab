---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
    homelab.davegallant.ca/backup-policy: scheduled
spec:
  project: homelab
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: "5.3.0"
      helm:
        releaseName: paperless-ngx
        valueFiles:
          - $values/kubernetes/apps/paperless-ngx/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: paperless-ngx
          targetNamespace: paperless-ngx
          gateNamespace: presync-gate
          scheduleName: paperless-ngx-daily
          requiredHooks:
            - selector:
                app.kubernetes.io/name: paperless-ngx
              container: app
          excludedVolumes:
            - consume
            - data
            - export
            - media
            - redis-data
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless-ngx
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
