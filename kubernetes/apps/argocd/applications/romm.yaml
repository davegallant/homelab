---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: romm
  namespace: argocd
  annotations:
    homelab.davegallant.ca/pre-sync-backup: enabled
    homelab.davegallant.ca/backup-policy: scheduled
spec:
  project: homelab
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: "5.3.0"
      helm:
        releaseName: romm
        valueFiles:
          - $values/kubernetes/apps/romm/values.production.yaml
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/davegallant/homelab.git
      targetRevision: main
      path: kubernetes/apps/presync-gate/chart
      helm:
        valuesObject:
          application: romm
          targetNamespace: romm
          gateNamespace: presync-gate
          scheduleName: romm-daily
          requiredHooks:
            - selector:
                app.kubernetes.io/name: romm
              container: db
          excludedVolumes:
            - library
            - romm-caddy-state-w1
            - romm-tailscale-state-w1
          defaultVolumesToFsBackup: false
  destination:
    server: https://kubernetes.default.svc
    namespace: romm
  # No automated sync or deletion finalizer: syncs require approval,
  # and deleting this Application preserves its workloads.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
