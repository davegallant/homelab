---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-popeye
  namespace: argocd
spec:
  description: Read-only cluster audit resources in the popeye namespace
  sourceRepos:
  - https://github.com/davegallant/homelab.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: popeye
  clusterResourceWhitelist:
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: ConfigMap
  - group: batch
    kind: CronJob
  - group: cilium.io
    kind: CiliumNetworkPolicy
  - group: apps
    kind: Deployment
  - group: ''
    kind: Service
