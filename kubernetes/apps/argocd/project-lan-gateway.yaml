---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-lan-gateway
  namespace: argocd
spec:
  description: LAN gateway Caddy proxy, its namespaced Reloader, and backend policies
  sourceRepos:
    - https://github.com/davegallant/homelab.git
    - https://stakater.github.io/stakater-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: lan-gateway
    - server: https://kubernetes.default.svc
      namespace: audiobookshelf
    - server: https://kubernetes.default.svc
      namespace: bentopdf
    - server: https://kubernetes.default.svc
      namespace: forgejo
    - server: https://kubernetes.default.svc
      namespace: jellyfin
    - server: https://kubernetes.default.svc
      namespace: mealie
    - server: https://kubernetes.default.svc
      namespace: navidrome
    - server: https://kubernetes.default.svc
      namespace: paperless-ngx
    - server: https://kubernetes.default.svc
      namespace: umami
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
