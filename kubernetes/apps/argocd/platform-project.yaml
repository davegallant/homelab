---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-platform
  namespace: argocd
spec:
  description: Pinned platform charts with manually approved syncs
  sourceRepos:
    - https://github.com/davegallant/homelab.git
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - ghcr.io/vmware-tanzu/charts
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io/
    - https://aquasecurity.github.io/helm-charts/
    - code.forgejo.org/forgejo-helm
    - https://code.forgejo.org/forgejo-helm/forgejo-runner.git
  destinations:
    - server: https://kubernetes.default.svc
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cilium-system
    - server: https://kubernetes.default.svc
      namespace: cilium-secrets
    - server: https://kubernetes.default.svc
      namespace: forgejo
    - server: https://kubernetes.default.svc
      namespace: forgejo-runner
    - server: https://kubernetes.default.svc
      namespace: intel-gpu
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: velero
  clusterResourceWhitelist:
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: cilium.io
      kind: CiliumLoadBalancerIPPool
    - group: cilium.io
      kind: CiliumL2AnnouncementPolicy
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: CSIDriver
    - group: apiregistration.k8s.io
      kind: APIService
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: cilium.io
      kind: CiliumIdentity
    - group: cilium.io
      kind: CiliumCIDRGroup
    - group: cilium.io
      kind: CiliumEgressGatewayPolicy
    - group: cilium.io
      kind: CiliumLocalRedirectPolicy
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: gateway.networking.k8s.io
      kind: Gateway
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: cilium.io
      kind: CiliumNodeConfig
    - group: cilium.io
      kind: CiliumEndpoint
    - group: cilium.io
      kind: CiliumNode
    - group: velero.io
      kind: BackupStorageLocation
    - group: velero.io
      kind: VolumeSnapshotLocation
    - group: ""
      kind: PersistentVolumeClaim
