apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-monitoring
  namespace: argocd
spec:
  description: VictoriaMetrics resources in the privileged monitoring namespace
  sourceRepos:
    - https://github.com/davegallant/homelab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: cilium.io
      kind: CiliumNetworkPolicy
