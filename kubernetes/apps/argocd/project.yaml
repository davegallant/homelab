---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Manually approved homelab applications
  sourceRepos:
    - https://github.com/davegallant/homelab.git
    # Batch A: the bjw-s app-template chart for the simple workloads
    # (Sol review #4 — pilot on new apps, bespoke charts stay for
    # unusual topologies).
    - https://bjw-s-labs.github.io/helm-charts
  destinations:
    - namespace: immich
      server: https://kubernetes.default.svc
    - namespace: qbittorrent
      server: https://kubernetes.default.svc
    - namespace: beszel
      server: https://kubernetes.default.svc
    - server: https://kubernetes.default.svc
      namespace: bentopdf
    - server: https://kubernetes.default.svc
      namespace: velero
    - server: https://kubernetes.default.svc
      namespace: homepage
    - server: https://kubernetes.default.svc
      namespace: kiwix
    - server: https://kubernetes.default.svc
      namespace: miniflux
    - server: https://kubernetes.default.svc
      namespace: searxng
    - server: https://kubernetes.default.svc
      namespace: seerr
    - server: https://kubernetes.default.svc
      namespace: lubelogger
    - server: https://kubernetes.default.svc
      namespace: maloja
    - server: https://kubernetes.default.svc
      namespace: changedetection
    # Batch B: the NFS media tier (authored 2026-10-22).
    - server: https://kubernetes.default.svc
      namespace: navidrome
    - server: https://kubernetes.default.svc
      namespace: audiobookshelf
    - server: https://kubernetes.default.svc
      namespace: romm
    # Jellyfin migration (2026-10-28): test instance, media tier.
    - server: https://kubernetes.default.svc
      namespace: jellyfin
    # Batch C: the Postgres-pattern batch (authored 2026-10-23).
    - server: https://kubernetes.default.svc
      namespace: umami
    - server: https://kubernetes.default.svc
      namespace: paperless-ngx
    - server: https://kubernetes.default.svc
      namespace: invidious
    - server: https://kubernetes.default.svc
      namespace: speedtest-tracker
    # Batch D: the *arr suite (authored 2026-10-23). qBittorrent
    # deliberately stays on its LXC — no namespace for it.
    - server: https://kubernetes.default.svc
      namespace: prowlarr
    - server: https://kubernetes.default.svc
      namespace: sonarr
    - server: https://kubernetes.default.svc
      namespace: radarr
    - server: https://kubernetes.default.svc
      namespace: lidarr
    # k8s-readonly proxy (2026-10-24): tailnet-only read-only API
    # proxy for Tux's Velero/PV audit. Workload only via Argo;
    # namespace + RBAC are hand-applied (see apps/k8s-readonly/README.md).
    - server: https://kubernetes.default.svc
      namespace: k8s-readonly
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: velero.io
      kind: Schedule
    # The default-deny CiliumNetworkPolicy each app carries as a
    # rawResource in its values (Phase 4 pattern).
    - group: cilium.io
      kind: CiliumNetworkPolicy
