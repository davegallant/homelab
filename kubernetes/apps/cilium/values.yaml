rollOutCiliumPods: true
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.245.0.0/16
    clusterPoolIPv4MaskSize: 24
routingMode: tunnel
tunnelProtocol: vxlan
tunnelPort: 8473
kubeProxyReplacement: false
encryption:
  enabled: true
  type: wireguard
policyEnforcementMode: default
operator:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k8s-cp-1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi
  unmanagedPodWatcher:
    restart: true
bpf:
  autoMount:
    enabled: false
  root: /sys/fs/bpf
  hostLegacyRouting: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
cni:
  customConf: false
  uninstall: false
  confPath: /etc/cni/net.d
  hostConfDirMountPath: /host/etc/cni/net.d
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 512Mi
hubble:
  enabled: true
  tls:
    auto:
      enabled: false
    server:
      existingSecret: hubble-server-certs
  relay:
    enabled: true
    tls:
      client:
        existingSecret: hubble-relay-client-certs
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    nodeSelector:
      kubernetes.io/hostname: k8s-cp-1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  ui:
    enabled: true
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/hostname: k8s-cp-1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
    backend:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  metrics:
    enabled:
      - drop
      - flow
      - dns
      - http
