{{- if and .Values.newt.enabled (not .Values.newt.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: bentopdf-newt
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  PANGOLIN_ENDPOINT: {{ required "newt.pangolinEndpoint must be supplied from Ansible Vault" .Values.newt.pangolinEndpoint | quote }}
  NEWT_ID: {{ required "newt.id must be supplied from Ansible Vault" .Values.newt.id | quote }}
  NEWT_SECRET: {{ required "newt.secret must be supplied from Ansible Vault" .Values.newt.secret | quote }}
{{- end }}
