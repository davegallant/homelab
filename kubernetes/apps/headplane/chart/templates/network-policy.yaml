apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headplane
  namespace: {{ .Release.Namespace }}
spec:
  description: Limit Headplane to the tailnet Gateway, cluster DNS, and HTTPS egress.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headplane
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidr: 192.168.1.0/24
