apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      base_path: "/admin"
      base_url: {{ required "headplaneUrl is required" .Values.headplaneUrl | quote }}
      cookie_secret_path: "/run/secrets/cookie-secret"
      cookie_secure: true
      data_path: "/var/lib/headplane"
    headscale:
      url: {{ required "headscaleUrl is required" .Values.headscaleUrl | quote }}
    integration:
      docker:
        enabled: false
      kubernetes:
        enabled: false
        pod_name: "headplane"
