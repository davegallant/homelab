apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gaswatch-egress
  namespace: argo-workflows
spec:
  description: Allow Gaswatch to reach DNS, PyPI, GasBuddy, and Gotify.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gaswatch
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: pypi.org
              - matchName: files.pythonhosted.org
              - matchName: www.gasbuddy.com
              - matchName: gotify.davegallant.ca
    - toFQDNs:
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: www.gasbuddy.com
        - matchName: gotify.davegallant.ca
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
