# Forgejo production values for forgejo-helm/forgejo 7.1.7.
# Staging is deliberately at zero replicas until the frozen /data copy and
# Velero restore drill have passed. SSH remains internal; production cutover
# is HTTPS-only because the live instance did not expose Git-over-SSH.
#
# STORAGE TEST (2026-10-24): persistence uses the manually created
# forgejo-data-local PVC, annotated with volumeType: local before
# local-path provisioning. If this Velero test fails, the static local
# PV in storage.yaml is the fallback; it requires its Talos host path.

image:
  registry: codeberg.org
  repository: forgejo/forgejo
  tag: "17.0.0"
  digest: sha256:06d38310de496a10186d952bdad5ca764c153c8023ede8dfa0944c79a1dc5412
  rootless: false

deployment:
  env:
    - name: FORGEJO_WORK_DIR
      value: /data/gitea

# One internal Forgejo pod is running for the Velero volume-backup test.
# The Newt Deployment remains at zero until separately approved cutover.
replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: k8s-w-1

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

persistence:
  enabled: true
  # This PVC was manually created with metadata annotation
  # volumeType: local before provisioning, so its PV uses spec.local and
  # Velero can back up the mounted volume. The static storage.yaml PV is
  # the fallback if the annotation test fails.
  create: false
  mount: true
  claimName: forgejo-data-local
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: local-path

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

ingress:
  enabled: false

serviceAccount:
  automountServiceAccountToken: false

gitea:
  podAnnotations:
    backup.velero.io/backup-volumes: data
  config:
    repository:
      ROOT: /data/git/repositories
    server:
      HTTP_PORT: 3000
      SSH_PORT: 22
      SSH_LISTEN_PORT: 22
    database:
      DB_TYPE: sqlite3
      PATH: /data/gitea/gitea.db
  additionalConfigFromEnvs:
    - name: FORGEJO__server__ROOT_URL
      valueFrom:
        secretKeyRef:
          name: forgejo-external
          key: ROOT_URL

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

redis-cluster:
  enabled: false

test:
  enabled: false

# The upstream chart has no extra-container hook. Keep the existing Pangolin
# Newt identity staged but inactive until cutover, and retain the current
# target hostname (`forgejo:3000`) with a same-namespace Service alias.
extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: forgejo
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/instance: forgejo
    spec:
      type: ClusterIP
      selector:
        app: forgejo
      ports:
        - name: http
          port: 3000
          targetPort: http
          protocol: TCP
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: forgejo-newt
      labels:
        app.kubernetes.io/name: forgejo-newt
        app.kubernetes.io/instance: forgejo
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: forgejo-newt
          app.kubernetes.io/instance: forgejo
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-newt
            app.kubernetes.io/instance: forgejo
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: newt
              image: docker.io/fosrl/newt:1.19.1@sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: forgejo-newt-external
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 512Mi
  - apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: forgejo-default-deny
    spec:
      description: Default deny with same-namespace access, cluster DNS, and internet egress.
      endpointSelector: {}
      ingress:
        - fromEntities:
            - host
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo-runner
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        # Ingress already allowed same-namespace traffic, but egress did not.
        # Hubble proved the egress denial (2026-10-24 cutover 503).
        # Hubble proved the fix (2026-10-25): Pod IP and Service ClusterIP
        # both 200, EGRESS ALLOWED BY forgejo-default-deny. Service traffic
        # is translated to the Pod, so the Service CIDR egressDeny below
        # does NOT block this path - no deny revision or headless switch needed.
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo
                k8s:app: forgejo
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
        - toEntities:
            - world
      egressDeny:
        - toCIDR:
            - 192.168.1.0/24
            - 10.96.0.0/12
