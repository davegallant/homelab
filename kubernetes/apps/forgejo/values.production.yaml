# Forgejo production values for forgejo-helm/forgejo 17.3.2.
# Rootless operation passed an isolated Velero restore and startup drill on
# 2026-10-31. Git-over-SSH is tailnet-only (2026-11-04): the built-in SSH
# server listens on 2222, reached via the tailnet-gateway fronting node
# (100.100.0.8:2222, forwarded directly to forgejo-ssh, not via the
# Gateway HTTP listener). It is NOT public via Pangolin; the public web
# route remains HTTPS-only.
#
# STORAGE TEST (2026-10-24): persistence uses the manually created
# forgejo-data-local PVC, annotated with volumeType: local before
# local-path provisioning. If this Velero test fails, the static local
# PV in storage.yaml is the fallback; it requires its Talos host path.

image:
  registry: codeberg.org
  repository: forgejo/forgejo
  tag: "17.0.1"
  # Hold the last known working build until the new digest is verified with a read-only root filesystem.
  digest: sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
  rootless: true

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

deployment:
  env:
    - name: FORGEJO_WORK_DIR
      value: /data/gitea

# Forgejo uses one pod because SQLite is not HA-ready.
replicaCount: 1

# Forgejo is not HA-ready; do not overlap pods that share its data volume.
strategy:
  type: Recreate

nodeSelector:
  kubernetes.io/hostname: k8s-w-1

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

initContainers:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  # This PVC was manually created with metadata annotation
  # volumeType: local before provisioning, so its PV uses spec.local and
  # Velero can back up the mounted volume. The static storage.yaml PV is
  # the fallback if the annotation test fails.
  create: false
  mount: true
  claimName: forgejo-data-local
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClass: local-path

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 2222

ingress:
  enabled: false

serviceAccount:
  create: true
  automountServiceAccountToken: false

gitea:
  admin:
    username: gitea_admin
    existingSecret: forgejo-admin-external
    passwordMode: keepUpdated
  podAnnotations:
    backup.velero.io/backup-volumes: data
  config:
    repository:
      ROOT: /data/git/repositories
    server:
      HTTP_PORT: 3000
      SSH_DOMAIN: forgejo.davegallant.ca
      SSH_PORT: 2222
      SSH_LISTEN_PORT: 2222
      START_SSH_SERVER: "true"
    database:
      DB_TYPE: sqlite3
      PATH: /data/gitea/gitea.db
  additionalConfigFromEnvs:
    - name: FORGEJO__server__ROOT_URL
      valueFrom:
        secretKeyRef:
          name: forgejo-external
          key: ROOT_URL

postgresql:
  enabled: false

postgresql-ha:
  enabled: false

redis-cluster:
  enabled: false

test:
  enabled: false

# The upstream chart has no extra-container hook. Keep the existing Pangolin
# Newt identity staged but inactive until cutover, and retain the current
# target hostname (`forgejo:3000`) with a same-namespace Service alias.
extraDeploy:
  - apiVersion: v1
    kind: Service
    metadata:
      name: forgejo
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/instance: forgejo
    spec:
      type: ClusterIP
      selector:
        app: forgejo
      ports:
        - name: http
          port: 3000
          targetPort: http
          protocol: TCP
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: forgejo-newt
      labels:
        app.kubernetes.io/name: forgejo-newt
        app.kubernetes.io/instance: forgejo
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: forgejo-newt
          app.kubernetes.io/instance: forgejo
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-newt
            app.kubernetes.io/instance: forgejo
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: newt-tmp
              emptyDir: {}
          containers:
            - name: newt
              image: docker.io/fosrl/newt:1.20.0@sha256:2170e673c4c72d905764fa22e83d0ae0aa3239fb1ab3b9fcaefb2b00fffb2d6e
              imagePullPolicy: IfNotPresent
              args:
                - --disable-ssh
              envFrom:
                - secretRef:
                    name: forgejo-newt-external
              env:
                - name: HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp/.config
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: newt-tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 512Mi
  - apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: forgejo-default-deny
    spec:
      description: Default deny with same-namespace access and cluster DNS.
      endpointSelector: {}
      ingress:
        - fromEntities:
            - host
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo-runner
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
        # Tailnet SSH (2026-11-04): only the tailnet-gateway fronting pod
        # may reach Forgejo on 2222. It forwards TCP 2222 directly to
        # forgejo-ssh, bypassing the Gateway HTTP listener.
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: tailnet-gateway
                k8s:app.kubernetes.io/name: tailnet-gateway-fronting
          toPorts:
            - ports:
                - port: "2222"
                  protocol: TCP
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        # Ingress already allowed same-namespace traffic, but egress did not.
        # Hubble proved the egress denial (2026-10-24 cutover 503).
        # Hubble proved the fix (2026-10-25): Pod IP and Service ClusterIP
        # both 200, EGRESS ALLOWED BY forgejo-default-deny. Service traffic
        # is translated to the Pod, so the Service CIDR egressDeny below
        # does NOT block this path - no deny revision or headless switch needed.
        - toEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: forgejo
                k8s:app: forgejo
          toPorts:
            - ports:
                - port: "3000"
                  protocol: TCP
      egressDeny:
        - toCIDR:
            - 192.168.1.0/24
            - 10.96.0.0/12
  - apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: forgejo-newt-egress
    spec:
      description: Allow the Forgejo Newt pod to reach the observed Pangolin VPS endpoints.
      endpointSelector:
        matchLabels:
          k8s:app.kubernetes.io/instance: forgejo
          k8s:app.kubernetes.io/name: forgejo-newt
      egress:
        - toCIDR:
            - 72.11.149.242/32
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
        - toCIDR:
            - 72.11.149.242/32
          toPorts:
            - ports:
                - port: "21820"
                  protocol: UDP
        - toCIDR:
            - 72.11.149.242/32
          toPorts:
            - ports:
                - port: "51820"
                  protocol: UDP
  - apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: forgejo-mirror-egress
    spec:
      description: Allow Forgejo repository mirrors to the observed public Git hosts over HTTPS.
      endpointSelector:
        matchLabels:
          k8s:app.kubernetes.io/instance: forgejo
          k8s:app.kubernetes.io/name: forgejo
      egress:
        - toEndpoints:
            - matchLabels:
                k8s:k8s-app: kube-dns
                k8s:io.kubernetes.pod.namespace: kube-system
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
              rules:
                dns:
                  - matchPattern: "*"
        - toFQDNs:
            - matchName: github.com
            - matchPattern: "*.github.com"
            - matchName: git.ryujinx.app
          toPorts:
            - ports:
                - port: "443"
                  protocol: TCP
