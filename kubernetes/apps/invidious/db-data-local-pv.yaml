---
# Cutover PV points at the directory provisioned by the initial local-path
# claim; keep that original claim mounted read-only for rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: invidious-db-data-local
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-9ec07eca-afab-42e8-9e11-76b11a1880ff_invidious_invidious-db-w1-stage
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1
  claimRef:
    namespace: invidious
    name: invidious-db-data-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: invidious-db-data-local
  namespace: invidious
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: invidious-db-data-local
