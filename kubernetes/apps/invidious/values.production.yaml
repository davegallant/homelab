---
# Invidious — Argo CD production values (bjw-s app-template 5.3.0).
# Active workload definition: this file; the LXC Compose stack is retired.
# (app quay.io/invidious/invidious 2026.10.23-4a271da, port 3000;
# companion quay.io/invidious/invidious-companion 2026.10.18-fcb0456,
# port 8282; database docker.io/postgres 18.6 — all in one pod).
# Tailnet-only: the shared tailnet Gateway routes HTTPS to the Invidious
# Service. Pangolin/Newt exposure has been retired.
#
# Two deliberate in-pod translations of the compose:
#   - The database and the companion are neighbouring containers, so
#     the generated INVIDIOUS_CONFIG points at 127.0.0.1 for both
#     (see playbooks/talos-cluster/invidious-secret.yml, which builds
#     the whole config block into the Secret).
#   - The companion keeps the compose's hardening (read-only root
#     filesystem, all capabilities dropped); its only writable path
#     is the youtubei.js cache volume.
#
# Secrets stay outside Git and outside Argo's ownership:
#   invidious-external       (INVIDIOUS_CONFIG, SERVER_SECRET_KEY,
#                             POSTGRES_USER, POSTGRES_PASSWORD)
#                            — same playbook
controllers:
  invidious:
    type: deployment
    strategy: Recreate
    replicas: 1
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Opt-in filesystem backup of the database volume, with a
        # consistent logical dump written into the volume first so
        # the filesystem backup carries a restorable copy. The
        # companion cache is excluded by omission (it regenerates).
        backup.velero.io/backup-volumes: db-data-local
        pre.hook.backup.velero.io/container: db
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","umask 077; PGPASSWORD=\"$POSTGRES_PASSWORD\" pg_dump -U \"$POSTGRES_USER\"
          -d \"$POSTGRES_DB\" > \"/var/lib/postgresql/invidious-backup.sql.tmp\" && mv -f \"/var/lib/postgresql/invidious-backup.sql.tmp\"
          \"/var/lib/postgresql/invidious-backup.sql\""]'
    containers:
      app:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        image:
          repository: quay.io/invidious/invidious
          tag: 2026.11.05-863a07b
          digest: sha256:ca4a568d73998bb6bdd5e6d7b919f55fc3579388145e73c8158aee9d41c95f1c
        envFrom:
          - secretRef:
              name: invidious-external
        probes:
          startup:
            enabled: true
            type: TCP
            port: 3000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              # First boot checks/migrates every table
              # (check_tables: true); give it the wide budget.
              failureThreshold: 60
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 3000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            # TCP on purpose: an HTTP liveness would couple restarts
            # to page rendering and upstream YouTube state.
            enabled: true
            type: TCP
            port: 3000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 150Mi
          limits:
            cpu: 2000m
            memory: 1Gi
      companion:
        image:
          repository: quay.io/invidious/invidious-companion
          tag: 2026.11.07-f4cdf76
          digest: sha256:d63f3c55edf281073c1e3ce23ab528b2d8c7561071a5426e62effd19c39a8748
        envFrom:
          - secretRef:
              name: invidious-external
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 65533
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            type: TCP
            port: 8282
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 8282
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 8282
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      db:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        image:
          repository: docker.io/library/postgres
          tag: "18.6"
          digest: sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        envFrom:
          - secretRef:
              name: invidious-external
        env:
          POSTGRES_DB: invidious
        probes:
          startup:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 5432
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 105Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  invidious:
    controller: invidious
    ports:
      http:
        port: 3000

persistence:
  app-tmp:
    type: emptyDir
    advancedMounts:
      invidious:
        app:
          - path: /tmp
  db-tmp:
    type: emptyDir
    advancedMounts:
      invidious:
        db:
          - path: /tmp
  db-run:
    type: emptyDir
    advancedMounts:
      invidious:
        db:
          - path: /var/run/postgresql
  # Keep the original local-path claim read-only for rollback.
  db-data:
    type: persistentVolumeClaim
    existingClaim: invidious-db-rollback-w1
    advancedMounts:
      invidious:
        db:
          - path: /mnt/invidious-rollback-db-data
            readOnly: true
  db-data-local:
    type: persistentVolumeClaim
    existingClaim: invidious-db-data-local
    advancedMounts:
      invidious:
        db:
          - path: /var/lib/postgresql
  companion-cache:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      invidious:
        companion:
          - path: /var/tmp/youtubei.js
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: invidious
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: invidious
          - fromEntities:
              - ingress
            toPorts:
              - ports:
                  - port: "3000"
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: invidious
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

  exactHubbleEgressPolicy:
    enabled: true
    suffix: exacthubbleegress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: exact-hubble-egress
        namespace: invidious
      spec:
        description: Captured egress tuples and DNS-tracked YouTube API, video, and thumbnail access.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: invidious
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
                rules:
                  dns:
                    - matchPattern: "*"
          - toFQDNs:
              # The Invidious Companion calls youtubei on www.youtube.com and
              # retrieves video streams from Google Video; the main app also
              # fetches thumbnails from i.ytimg.com and channel avatars from
              # yt3.ggpht.com.
              - matchName: i.ytimg.com
              - matchName: yt3.ggpht.com
              - matchName: www.youtube.com
              # The Companion's PO-token validation uses YouTube's search flow,
              # which also reaches www.google.com.
              - matchName: www.google.com
              - matchPattern: "*.googlevideo.com"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
              - 93.95.230.186/32
              - 96.127.240.13/32
              - 96.127.240.185/32
              - 142.251.150.4/32
              - 142.251.151.119/32
              - 142.251.152.4/32
              - 142.251.153.4/32
              - 142.251.153.119/32
              - 142.251.154.4/32
              - 142.251.154.119/32
              - 142.251.155.4/32
              - 142.251.155.119/32
              - 142.251.156.4/32
              - 142.251.157.4/32
              - 142.251.157.119/32
              - 172.93.16.236/32
              - 172.93.16.237/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "21820"
                    protocol: UDP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
