apiVersion: v1
kind: Service
metadata:
  name: tdarr
  labels:
    app.kubernetes.io/name: tdarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tdarr
    app.kubernetes.io/instance: tdarr
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
