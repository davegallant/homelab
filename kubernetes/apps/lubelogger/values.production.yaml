---
# LubeLogger — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. The app uses
# ghcr.io/hargata/lubelogger v1.4.5 on port 8080.
controllers:
  lubelogger:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      annotations:
        # Velero backs up the live app data volume; the rollback PVC
        # remains excluded by omission.
        backup.velero.io/backup-volumes: data-local
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: ghcr.io/hargata/lubelogger
          tag: v1.4.5
          digest: sha256:e915b53eba78349348c8a1937122d8dccc7eba6f71898eecb2af208bc213fe2e
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 104Mi
          limits:
            cpu: 1000m
            memory: 1Gi
service:
  lubelogger:
    controller: lubelogger
    ports:
      http:
        port: 8080

persistence:
  data:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      lubelogger:
        app:
          - path: /mnt/lubelogger-rollback/config
            subPath: config
            readOnly: true
          - path: /mnt/lubelogger-rollback/data
            subPath: data
            readOnly: true
          - path: /mnt/lubelogger-rollback/translations
            subPath: translations
            readOnly: true
          - path: /mnt/lubelogger-rollback/documents
            subPath: documents
            readOnly: true
          - path: /mnt/lubelogger-rollback/images
            subPath: images
            readOnly: true
          - path: /mnt/lubelogger-rollback/temp
            subPath: temp
            readOnly: true
          - path: /mnt/lubelogger-rollback/log
            subPath: log
            readOnly: true
          # DataProtection keys: losing them invalidates protected
          # data (auth cookies), so they ride the same PVC.
          - path: /mnt/lubelogger-rollback/keys
            subPath: keys
            readOnly: true
  data-local:
    type: persistentVolumeClaim
    annotations:
      argocd.argoproj.io/ignore-healthcheck: "true"
    storageClass: pve-g3-1-local
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      lubelogger:
        app:
          - path: /App/config
            subPath: config
          - path: /App/data
            subPath: data
          - path: /App/wwwroot/translations
            subPath: translations
          - path: /App/wwwroot/documents
            subPath: documents
          - path: /App/wwwroot/images
            subPath: images
          - path: /App/wwwroot/temp
            subPath: temp
          - path: /App/log
            subPath: log
          - path: /root/.aspnet/DataProtection-Keys
            subPath: keys

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: lubelogger
      spec:
        description: Default deny with tailnet control, relay, and Cloudflare egress.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lubelogger
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: lubelogger
          - toEntities:
              - world
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                  - port: "3478"
                    protocol: UDP
                  - port: "41641"
                    protocol: UDP
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16
  backupSchedule:
    enabled: true
    manifest:
      apiVersion: velero.io/v1
      kind: Schedule
      metadata:
        name: lubelogger-daily
        namespace: velero
      spec:
        schedule: "25 3 * * *"
        template:
          ttl: 336h
          includedNamespaces:
            - lubelogger
          excludedResources:
            - secrets
          defaultVolumesToFsBackup: false
          snapshotVolumes: false
          storageLocation: default
