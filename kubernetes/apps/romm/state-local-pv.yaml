---
# These static local PVs bind the copied state directories on k8s-w-2 so
# Velero can create PodVolumeBackups for RomM's mutable data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-config-local
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-c439162a-2849-496d-865a-95a7574aa0ca_romm_romm-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: romm
    name: romm-config-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-config-local
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: romm-config-local
