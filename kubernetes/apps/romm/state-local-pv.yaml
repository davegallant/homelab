---
# Static local PVs bind the active RomM data directories on k8s-w-1.
# Kubernetes local volumes are eligible for Velero filesystem backups;
# hostPath volumes from the local-path StorageClass are not.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-config-w1-local
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-08d863f3-c4b8-4bee-b6f8-c6aa7a0afcff_romm_romm-config-w1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-config-w1
  namespace: romm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: romm-config-w1-local
---
