---
# Storage for romm, applied once by hand and
# deliberately NOT managed by Argo CD: the homelab AppProject allows
# namespace-scoped resources only, so namespaces and static volumes
# stay an Ansible / kubectl concern.
#
# Two volume families, two different natures:
#   romm-library    - the ROM library, a static NFS PV onto the
#                     existing TrueNAS export the LXC reads today
#                     (mounted as /mnt/media/romm by the Proxmox
#                     host). Read-write, matching the LXC mount;
#                     the assets tree is the library's assets/
#                     subdirectory, mounted separately by subPath
#                     in the values. The data never moves and is
#                     never Velero-backed-up (TrueNAS snapshots +
#                     Drive sync, same as Kiwix).
#   app state       - config, resources, redis data and MariaDB data
#                     use static local PVs declared in
#                     state-local-pv.yaml. Their paths stay on w-1;
#                     the local volume type is required for Velero
#                     filesystem backups.
#
# Verify the share path against the LXC's mount before applying:
# the export below follows the Kiwix spelling (/mnt/tank/media/<app>).
apiVersion: v1
kind: Namespace
metadata:
  name: romm
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-library
spec:
  capacity:
    storage: 1Ti # nominal; NFS reports the export's real size
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: truenas-romm-library
    volumeAttributes:
      server: 192.168.1.16
      share: /mnt/tank/media/romm

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-library
  namespace: romm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: romm-library
  resources:
    requests:
      storage: 1Ti
