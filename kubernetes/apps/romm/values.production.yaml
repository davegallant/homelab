---
# RomM — Argo CD production values (bjw-s app-template 5.3.0).
# Application configuration: this file. RomM uses docker.io/rommapp/romm
# 5.4.0 and MariaDB 13.0.2 in the same pod.
# Tailnet-only exposure is provided by the central Cilium Gateway.
#
# The library stays on TrueNAS (static NFS claim romm-library, see
# storage.yaml); only the small state volumes are PVCs here.
#
# Secrets stay outside Git and outside Argo's ownership:
#   romm-app-external      (DB_PASSWD, ROMM_AUTH_SECRET_KEY,
#                           IGDB_CLIENT_ID, IGDB_CLIENT_SECRET)
#   romm-db-external       (MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD)
#                          — playbooks/talos-cluster/romm-secret.yml
# Keep app and database credentials in separate Secrets so the web
# application never receives MARIADB_ROOT_PASSWORD.
# The optional MOBYGAMES / STEAMGRIDDB keys are commented out in the
# source compose and are deliberately not carried over.
controllers:
  romm:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k8s-w-1
      annotations:
        # Opt-in filesystem backup of the state volumes; the NFS
        # library is excluded by omission (TrueNAS snapshots + Drive
        # sync protect it, never Velero). The pre-backup hook writes
        # a consistent logical dump into the database volume so the
        # filesystem backup carries a restorable copy.
        backup.velero.io/backup-volumes: mysql-data-local,config-local,resources-local,redis-data-local
        pre.hook.backup.velero.io/container: db
        pre.hook.backup.velero.io/command: '["/bin/sh","-c","mariadb-dump --single-transaction -u root
          -p$MARIADB_ROOT_PASSWORD romm > /var/lib/mysql/romm-backup.sql"]'
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - SETGID
              - SETUID
        image:
          repository: docker.io/rommapp/romm
          tag: 5.4.1
          digest: sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
        envFrom:
          - secretRef:
              name: romm-app-external
        env:
          # The compose reaches the database by service name; in-pod
          # it is the neighbouring container.
          DB_HOST: 127.0.0.1
          DB_NAME: romm
          DB_USER: romm-user
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8080
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      db:
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          capabilities:
            drop:
              - ALL
        image:
          repository: docker.io/mariadb
          tag: 13.0.2
          digest: sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        envFrom:
          - secretRef:
              name: romm-db-external
        env:
          MARIADB_DATABASE: romm
          MARIADB_USER: romm-user
        probes:
          startup:
            enabled: true
            type: TCP
            port: 3306
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 3306
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 3306
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

service:
  romm:
    controller: romm
    ports:
      http:
        port: 8080

persistence:
  library:
    type: persistentVolumeClaim
    existingClaim: romm-library
    advancedMounts:
      romm:
        app:
          - path: /romm/library
          - path: /romm/assets
            subPath: assets
  resources-local:
    type: persistentVolumeClaim
    existingClaim: romm-resources-w1
    advancedMounts:
      romm:
        app:
          - path: /romm/resources

  redis-data-local:
    type: persistentVolumeClaim
    existingClaim: romm-redis-data-w1
    advancedMounts:
      romm:
        app:
          - path: /redis-data
  config-local:
    type: persistentVolumeClaim
    existingClaim: romm-config-w1
    advancedMounts:
      romm:
        app:
          - path: /romm/config
  mysql-data-local:
    type: persistentVolumeClaim
    existingClaim: romm-mysql-data-w1
    advancedMounts:
      romm:
        db:
          - path: /var/lib/mysql
rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: romm
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: romm
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: romm
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

