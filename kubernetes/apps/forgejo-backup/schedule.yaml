---
# Forgejo daily Velero schedule, Argo-managed in the homelab project.
# NOT in the Forgejo Application: homelab-platform forbids velero.io:Schedule,
# which is why the extraDeploy Schedule in values.production.yaml failed sync.
# Spec matches the kubectl-created schedule it adopts on first sync:
# 05:00 UTC (01:00 EDT), after the 03:00-04:30 UTC stagger window,
# ttl 336h like the other daily schedules, forgejo + forgejo-runner,
# defaultVolumesToFsBackup true. Secrets remain included until fresh Forgejo
# runner registration is verified with the deployed chart's `.runner` Secret.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: forgejo-daily
  namespace: velero
spec:
  schedule: "0 5 * * *"
  template:
    ttl: 336h
    includedNamespaces:
      - forgejo
      - forgejo-runner
    defaultVolumesToFsBackup: true
