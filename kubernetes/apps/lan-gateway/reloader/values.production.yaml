---
image:
  repository: ghcr.io/stakater/reloader
  tag: v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410
# Restarts the Caddy Deployment when cert-manager renews its TLS Secret
# (Caddy reads certificate files only at startup). Namespaced: it can read
# Secrets in lan-gateway only, not cluster-wide.
reloader:
  watchGlobally: false
  ignoreConfigMaps: true
  readOnlyRootFileSystem: true
  rbac:
    enabled: true
  deployment:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
