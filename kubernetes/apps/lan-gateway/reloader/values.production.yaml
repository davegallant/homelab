---
image:
  repository: ghcr.io/stakater/reloader
  tag: v1.4.25@sha256:db8b1818f5da373ab85c05b30220fcae80a9ac0532052e6d68a6a5999111f18f
# Restarts the Caddy Deployment when cert-manager renews its TLS Secret
# (Caddy reads certificate files only at startup). Namespaced: it can read
# Secrets in lan-gateway only, not cluster-wide.
reloader:
  watchGlobally: false
  ignoreConfigMaps: true
  readOnlyRootFileSystem: true
  rbac:
    enabled: true
  deployment:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
