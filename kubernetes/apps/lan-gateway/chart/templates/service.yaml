apiVersion: v1
kind: Service
metadata:
  name: lan-gateway
  namespace: lan-gateway
  annotations:
    lbipam.cilium.io/ips: {{ .Values.loadBalancerIP | quote }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: lan-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
