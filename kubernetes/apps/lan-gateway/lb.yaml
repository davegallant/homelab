---
# Applied by hand, like namespace.yaml. 192.168.1.186 was confirmed free and
# outside DHCP by Dave on 2026-11-27. Announced only from k8s-w-1, where the
# Caddy pod is pinned, so externalTrafficPolicy Local keeps client source IPs.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-gateway
spec:
  disabled: false
  blocks:
    - start: 192.168.1.186
      stop: 192.168.1.186
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: lan-gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-gateway
spec:
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: lan-gateway
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-w-1
  interfaces:
    - ^ens18$
  loadBalancerIPs: true
  externalIPs: false
