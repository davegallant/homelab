# Default values for the kiwix chart.
#
# Kiwix is served over the tailnet through the central Cilium Gateway
# (see kubernetes/apps/tailnet-gateway). This chart renders only the
# kiwix-serve Deployment and its ClusterIP Service; there are no
# Vault-supplied values. Argo CD reads this file plus
# ../values.production.yaml directly.

kiwix:
  # Application image and runtime settings are managed in this chart.
  image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# The pod is pinned to k8s-w-1, a holdover from the retired Tailscale
# sidecar era (the sidecar identity lived on a node-local volume). The
# ZIM data itself is NFS and would float; revisit whether this pin is
# still needed before removing it. The chart adopts the existing PVCs
# from ../storage.yaml by name and never recreates them.
nodeHostname: k8s-w-1
fsGroup: 1000
