---
# Storage for kiwix, applied by playbooks/talos-cluster/kiwix.yml and
# deliberately NOT chart-managed: the chart adopts the PVCs by name and
# never recreates them (same carve-out as Homepage).
#
# kiwix-data is the read-only ZIM library on TrueNAS. Its protection is
# TrueNAS snapshots and Drive sync, not Velero filesystem backup.
# Retired Caddy/Tailscale local volumes were removed on 2026-11-10.
apiVersion: v1
kind: Namespace
metadata:
  name: kiwix
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kiwix-data
spec:
  capacity:
    storage: 1Ti # nominal; NFS reports the export's real size
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true
    volumeHandle: truenas-kiwix-media
    volumeAttributes:
      server: 192.168.1.16
      share: /mnt/tank/media/kiwix

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-data
  namespace: kiwix
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: kiwix-data
  resources:
    requests:
      storage: 1Ti
