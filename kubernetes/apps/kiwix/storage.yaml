---
# Storage for kiwix, applied by playbooks/talos-cluster/kiwix.yml and
# deliberately NOT chart-managed: the chart adopts the PVCs by name and
# never recreates them (same carve-out as Homepage).
#
# Three volumes, three different natures:
#   kiwix-data      - the ZIM library, a static NFS PV onto the
#                     existing TrueNAS export the LXC reads today via
#                     the Proxmox host mount. Read-only; the data never
#                     moves and is never Velero-backed-up (its
#                     protection is TrueNAS snapshots + Drive sync).
#   kiwix-tailscale - sidecar identity state on k8s-w-1 (local).
#                     Restoring it would clone a live tailnet
#                     identity: never backed up.
#   kiwix-caddy     - Caddy's Let's Encrypt state on k8s-w-1 (local),
#                     so pod restarts do not re-request certificates.
# The two local dirs are materialized by machine-config .keep entries
# (cluster/worker.patch.yaml.j2) and only appear on node reboot.
apiVersion: v1
kind: Namespace
metadata:
  name: kiwix
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kiwix-data
spec:
  capacity:
    storage: 1Ti # nominal; NFS reports the export's real size
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true
    volumeHandle: truenas-kiwix-media
    volumeAttributes:
      server: 192.168.1.16
      share: /mnt/tank/media/kiwix

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-data
  namespace: kiwix
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: kiwix-data
  resources:
    requests:
      storage: 1Ti

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kiwix-tailscale
spec:
  capacity:
    storage: 64Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  local:
    path: /var/mnt/kiwix/tailscale
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-tailscale
  namespace: kiwix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pve-g3-1-local
  volumeName: kiwix-tailscale
  resources:
    requests:
      storage: 64Mi

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kiwix-caddy
spec:
  capacity:
    storage: 256Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  local:
    path: /var/mnt/kiwix/caddy
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kiwix-caddy
  namespace: kiwix
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: pve-g3-1-local
  volumeName: kiwix-caddy
  resources:
    requests:
      storage: 256Mi
