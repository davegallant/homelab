{{- if not .Values.configFiles.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: {{ .Release.Namespace }}
data:
  services.yaml: |
{{- .Values.configFiles.servicesYaml | nindent 4 }}
  settings.yaml: |
{{- .Values.configFiles.settingsYaml | nindent 4 }}
  widgets.yaml: |
{{- .Values.configFiles.widgetsYaml | nindent 4 }}
{{- end }}

{{- if not .Values.configFiles.proxyExistingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-node-proxy
  namespace: {{ .Release.Namespace }}
data:
  proxy-agent.cjs: |
{{- .Values.configFiles.proxyAgentCjs | nindent 4 }}
{{- end }}
