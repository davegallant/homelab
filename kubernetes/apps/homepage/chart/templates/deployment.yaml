apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
      annotations:
        checksum/config: {{ .Values.configChecksum | default (printf "%s%s%s" .Values.configFiles.servicesYaml .Values.configFiles.settingsYaml .Values.configFiles.proxyAgentCjs | sha256sum) | quote }}
        {{- with .Values.restartTimestamp }}
        kubectl.kubernetes.io/restartedAt: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: false
      securityContext:
        fsGroup: {{ .Values.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .Values.nodeHostname }}
      containers:
        - name: homepage
          image: {{ .Values.homepage.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: PUID
              value: {{ .Values.homepage.puid | quote }}
            - name: PGID
              value: {{ .Values.homepage.pgid | quote }}
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.{{ required "magicDnsDomain must be supplied from Ansible (see values.ansible.yaml.j2)" .Values.magicDnsDomain }}"
          envFrom:
            - secretRef:
                name: {{ .Values.homepage.existingSecret | default "homepage-environment" | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: "homepage.{{ .Values.magicDnsDomain }}"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: "homepage.{{ .Values.magicDnsDomain }}"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: "homepage.{{ .Values.magicDnsDomain }}"
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.homepage.resources | nindent 12 }}
          volumeMounts:
            - name: homepage-config
              mountPath: /app/config
            - name: managed-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true
            - name: managed-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true
            - name: managed-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true
            - name: custom-icons
              mountPath: /app/public/icons
              readOnly: true
            - name: custom-icons
              mountPath: /app/config/icons
              readOnly: true
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: homepage-config
          persistentVolumeClaim:
            claimName: homepage-config
        - name: managed-config
          configMap:
            name: {{ .Values.configFiles.existingConfigMap | default "homepage-config" | quote }}
        - name: custom-icons
          configMap:
            name: homepage-icons
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
