---
# Paperless-ngx — Argo CD production values (bjw-s app-template 5.3.0).
# Active workload definition: this file; the LXC Compose stack is retired.
# (app docker.io/paperlessngx/paperless-ngx 3.3.3, port 8000; broker
# docker.io/library/redis 8 as a second container in the same pod).
# Public via Pangolin: the retired LXC paired the app with a Newt sidecar,
# reproduced in-pod with the *same* Newt identity, so the existing
# Pangolin route and public URL carry over unchanged. Do not rewrite
# this app as tailnet-only.
#
# Paperless uses SQLite in the data volume; there is no Postgres.
# State is four chart-managed local-path PVCs (data, media, consume,
# export). Media stays local because Velero does not back up NFS data.
# Redis data is disposable broker state.
#
# Secrets stay outside Git and outside Argo's ownership:
#   paperless-newt-external  (PANGOLIN_ENDPOINT, NEWT_ID, NEWT_SECRET)
#                            — playbooks/talos-cluster/paperless-secret.yml
#   paperless-external       (PAPERLESS_SECRET_KEY,
#                             PAPERLESS_ADMIN_USER,
#                             PAPERLESS_ADMIN_PASSWORD, PAPERLESS_URL)
#                            — same playbook
controllers:
  paperless-ngx:
    type: deployment
    strategy: Recreate
    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      annotations:
        # Opt-in filesystem backup of the file volumes (Redis broker
        # state excluded by omission). The pre-backup hook writes a
        # consistent SQLite copy into the data volume first, so the
        # filesystem backup carries a clean database alongside the
        # live (possibly WAL-dirty) one.
        backup.velero.io/backup-volumes: data-local,media-local,consume-local,export-local
        pre.hook.backup.velero.io/container: app
        pre.hook.backup.velero.io/command: '["/usr/bin/env","python3","-c","import sqlite3; s=sqlite3.connect(\"/usr/src/paperless/data/db.sqlite3\");
          d=sqlite3.connect(\"/usr/src/paperless/data/db-backup.sqlite3\"); s.backup(d)"]'
    containers:
      app:
        securityContext:
          allowPrivilegeEscalation: false
        image:
          repository: docker.io/paperlessngx/paperless-ngx
          tag: 3.4.0
          digest: sha256:7c1d98afd200def9e2bad3a377d30829e8d486554b3c818995af5860114ea17f
        envFrom:
          - secretRef:
              name: paperless-external
        env:
          PAPERLESS_TIME_ZONE: UTC
          # The compose reaches Redis by service name; in-pod it is
          # the neighbouring container.
          PAPERLESS_REDIS: redis://127.0.0.1:6379
        probes:
          startup:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              # First boot runs migrations and builds the search
              # index; give it the wide budget.
              failureThreshold: 60
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: 8000
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 512Mi
          limits:
            # OCR and indexing bursts are CPU-hungry and brief.
            cpu: 4000m
            memory: 2Gi
      redis:
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        image:
          repository: docker.io/library/redis
          tag: "8"
          digest: sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
        probes:
          startup:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          readiness:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            type: TCP
            port: 6379
            spec:
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 500m
            memory: 512Mi
      newt:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
        image:
          repository: docker.io/fosrl/newt
          tag: 1.19.1
          digest: sha256:c89f01cb387bf6c598959036cbf56306b068a43e8784345bee7398b7af8ee2e1
        envFrom:
          - secretRef:
              name: paperless-newt-external
        env:
          HOME: /tmp
          XDG_CONFIG_HOME: /tmp/.config
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 192Mi

service:
  paperless-ngx:
    controller: paperless-ngx
    ports:
      http:
        port: 8000

persistence:
  newt-tmp:
    type: emptyDir
    advancedMounts:
      paperless-ngx:
        newt:
          - path: /tmp
  data:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      paperless-ngx:
        app:
          - path: /mnt/paperless-rollback-data
            readOnly: true
  data-local:
    type: persistentVolumeClaim
    existingClaim: paperless-ngx-data-local
    advancedMounts:
      paperless-ngx:
        app:
          - path: /usr/src/paperless/data
  media:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 20Gi
    advancedMounts:
      paperless-ngx:
        app:
          - path: /mnt/paperless-rollback-media
            readOnly: true
  media-local:
    type: persistentVolumeClaim
    existingClaim: paperless-ngx-media-local
    advancedMounts:
      paperless-ngx:
        app:
          - path: /usr/src/paperless/media
  consume:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      paperless-ngx:
        app:
          - path: /mnt/paperless-rollback-consume
            readOnly: true
  consume-local:
    type: persistentVolumeClaim
    existingClaim: paperless-ngx-consume-local
    advancedMounts:
      paperless-ngx:
        app:
          - path: /usr/src/paperless/consume
  export:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 5Gi
    advancedMounts:
      paperless-ngx:
        app:
          - path: /mnt/paperless-rollback-export
            readOnly: true
  export-local:
    type: persistentVolumeClaim
    existingClaim: paperless-ngx-export-local
    advancedMounts:
      paperless-ngx:
        app:
          - path: /usr/src/paperless/export
  redis-data:
    type: persistentVolumeClaim
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      paperless-ngx:
        redis:
          - path: /data
  redis-tmp:
    type: emptyDir
    advancedMounts:
      paperless-ngx:
        redis:
          - path: /tmp

rawResources:
  defaultDenyNetworkPolicy:
    enabled: true
    suffix: defaultdenynetworkpolicy
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: paperless-ngx
      spec:
        description: Default deny with cluster DNS, same-namespace access, and explicit internal-range denies.
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: paperless-ngx
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: "53"
                    protocol: UDP
                  - port: "53"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: paperless-ngx
        egressDeny:
          - toCIDR:
              - 192.168.1.0/24
              - 10.96.0.0/12
              - 10.245.0.0/16

  exactHubbleEgressPolicy:
    enabled: true
    suffix: exacthubbleegress
    manifest:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: exact-hubble-egress
        namespace: paperless-ngx
      spec:
        description: Exact forwarded Hubble egress tuples captured on 2026-10-24.
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: paperless-ngx
        egress:
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "21820"
                    protocol: UDP
          - toCIDR:
              - 72.11.149.242/32
            toPorts:
              - ports:
                  - port: "51820"
                    protocol: UDP
