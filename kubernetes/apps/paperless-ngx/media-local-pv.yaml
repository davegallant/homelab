---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-ngx-media-local
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/local-path/pvc-c2537965-2131-4a42-8f2a-6742cbfede41_paperless-ngx_paperless-ngx-media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-w-2
  claimRef:
    namespace: paperless-ngx
    name: paperless-ngx-media-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-media-local
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: pve-g3-1-local
  volumeMode: Filesystem
  volumeName: paperless-ngx-media-local
