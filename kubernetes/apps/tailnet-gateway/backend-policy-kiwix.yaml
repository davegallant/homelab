apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kiwix-gateway
  namespace: kiwix
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kiwix
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
