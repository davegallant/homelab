{{- range .Values.apps }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .policyName | default (printf "%s-gateway" .name) }}
  namespace: {{ .namespace | default .name }}
spec:
  endpointSelector:
    matchLabels:
{{- range $k, $v := .selectorLabels }}
      {{ $k }}: {{ $v }}
{{- end }}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "{{ .policyPort | default .port }}"
              protocol: TCP
{{- end }}
