# Production changedetection hostname. Keep the test route available during migration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: changedetection-gateway-production
  namespace: changedetection
spec:
  parentRefs:
    - kind: Gateway
      name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - changedetection.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: changedetection
          port: 5000
