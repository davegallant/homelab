# Production changedetection hostname. Keep the test route available during migration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: changedetection-gateway-production
  namespace: changedetection
spec:
  parentRefs:
    - kind: Gateway
      name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - changedetection.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: changedetection
          port: 5000
---
# Production k8s-readonly hostname. The sidecar remains live until transport
# through the Gateway has been proven.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-readonly-gateway-production
  namespace: k8s-readonly
spec:
  parentRefs:
    - kind: Gateway
      name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - k8s-readonly.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: k8s-readonly
          port: 8001
---
# Production Prowlarr hostname. The Tailscale and Caddy sidecars remain live
# until Gateway transport is proven.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-gateway-production
  namespace: prowlarr
spec:
  parentRefs:
    - kind: Gateway
      name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - prowlarr.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: prowlarr
          port: 9696
