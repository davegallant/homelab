---
# Selects the shared ingress identity on every node, not just this Gateway.
# Keep this allow scoped to the fronting pod and HTTPS only.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tailnet-gateway-entry
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved:ingress
        operator: Exists
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: tailnet-gateway
            k8s:app.kubernetes.io/name: tailnet-gateway-fronting
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
