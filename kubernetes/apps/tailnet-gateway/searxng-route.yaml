apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: searxng
spec:
  parentRefs:
    - name: tailnet-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - searxng.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: searxng
          group: ""
          kind: Service
          port: 8080
          weight: 1
