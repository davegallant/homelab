apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unmanic
  namespace: unmanic
spec:
  parentRefs:
    - name: tailnet-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - unmanic.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: unmanic
          group: ""
          kind: Service
          port: 8888
          weight: 1
