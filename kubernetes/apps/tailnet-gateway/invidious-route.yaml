apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invidious
  namespace: invidious
spec:
  parentRefs:
    - name: tailnet-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - invidious.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: invidious
          group: ""
          kind: Service
          port: 3000
          weight: 1
