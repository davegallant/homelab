apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage-gateway-production
  namespace: homepage
spec:
  parentRefs:
    - name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - homepage.tail.davegallant.ca
  rules:
    - backendRefs:
        - name: homepage
          port: 3000
