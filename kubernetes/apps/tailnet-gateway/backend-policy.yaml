---
# Additive only; do not replace the existing app policies.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: changedetection-gateway-test
  namespace: changedetection
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: changedetection
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
---
# Permit only the Gateway ingress identity to reach k8s-readonly on 8001.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-readonly-gateway
  namespace: k8s-readonly
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: k8s-readonly
      app.kubernetes.io/instance: k8s-readonly
      app.kubernetes.io/name: k8s-readonly
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8001"
              protocol: TCP
---
# Permit only the Gateway ingress identity to reach Prowlarr on 9696.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr-gateway
  namespace: prowlarr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: prowlarr
      app.kubernetes.io/instance: prowlarr
      app.kubernetes.io/name: prowlarr
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
