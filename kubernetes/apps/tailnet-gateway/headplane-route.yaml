apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headplane
  namespace: headplane
spec:
  parentRefs:
    - name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - headplane.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: headplane
          port: 3000
