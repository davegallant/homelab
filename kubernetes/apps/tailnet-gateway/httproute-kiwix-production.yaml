apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiwix-gateway-production
  namespace: kiwix
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - kiwix.tail.davegallant.ca
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kiwix
          port: 8080
          weight: 1
