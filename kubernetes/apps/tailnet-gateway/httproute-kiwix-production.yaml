apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiwix-gateway-production
  namespace: kiwix
spec:
  parentRefs:
    - name: tailnet-gateway
      namespace: tailnet-gateway
      sectionName: https
  hostnames:
    - kiwix.tail.davegallant.ca
  rules:
    - backendRefs:
        - name: kiwix
          port: 8080
