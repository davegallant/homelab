apiVersion: v1
kind: PersistentVolume
metadata:
  name: unmanic-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: cinema-unmanic-media
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unmanic-media
  namespace: unmanic
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: unmanic-media
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: unmanic-source
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - hard
    - nfsvers=4.1
    - noatime
  csi:
    driver: nfs.csi.k8s.io
    readOnly: true
    volumeHandle: cinema-unmanic-source
    volumeAttributes:
      server: 192.168.1.83
      share: /mnt/pool
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unmanic-source
  namespace: unmanic
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: unmanic-source
  resources:
    requests:
      storage: 1Ti
