apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unmanic
spec:
  description: Restrict Unmanic to the tailnet Gateway, cluster DNS, and Cinema NFS export.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unmanic
  ingress:
    - fromEntities:
        - host
        - ingress
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 192.168.1.83/32
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  egressDeny:
    - toCIDRSet:
        - cidr: 192.168.1.0/24
          except:
            - 192.168.1.83/32
