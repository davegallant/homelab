---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: trivy-scan-parallelism
spec:
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: trivy-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
  matchConditions:
    - name: trivy-scan-job
      expression: object.metadata.name.startsWith("scan-vulnerabilityreport-")
  reinvocationPolicy: Never
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c,
                Object.spec.containers{
                  name: c.name,
                  env: [Object.spec.containers.env{
                    name: "TRIVY_PARALLEL",
                    value: "1"
                  }]
                }
              )
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: trivy-scan-parallelism
spec:
  policyName: trivy-scan-parallelism
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: trivy-system
