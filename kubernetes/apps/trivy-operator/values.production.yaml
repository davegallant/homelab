targetNamespaces: ""
excludeNamespaces: trivy-system

image:
  registry: mirror.gcr.io
  repository: aquasec/trivy-operator
  tag: "0.36.1@sha256:05191a514247ae644dd5cc71306a94f44faff0a6a3fa817235911b911ecebcb9"

trivy:
  storageClassEnabled: false
  server:
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
  image:
    registry: mirror.gcr.io
    repository: aquasec/trivy
    tag: "0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c"
  resources:
    requests:
      cpu: 25m
      memory: 100M
      ephemeralStorage: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeralStorage: 2Gi

operator:
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false
  sbomGenerationEnabled: false
  scanJobsConcurrentLimit: 1
  accessGlobalSecretsAndServiceAccount: false
  builtInTrivyServer: true

compliance:
  specs: []

nodeCollector:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

podSecurityContext:
  runAsUser: 10000
  runAsGroup: 10000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
